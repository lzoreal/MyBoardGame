<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>大富翁 · 萌趣街区（Q 版透视棋盘）</title>
<link rel="stylesheet" href="board-q.css?v=12">
</head>
<body>
<div class="app mobile" id="app">
  <div class="bgCity" aria-hidden="true"></div>

  <header class="topbar">
    <button class="homeBtn" id="btnHome" aria-label="返回大厅">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3.4 11.6 12 4l8.6 7.6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M6.4 10.8h11.2v8.2H6.4z" fill="#fff" opacity=".9"/></svg>
    </button>
    <button class="roomPill" id="roomPill" type="button"><b>房间：A12345</b></button>
    <div class="tbSp"></div>
    <div class="roundPill">回合 <b id="roundNo">1</b>/20</div>
    <button class="logBtn" id="btnLog">日志</button>
  </header>

  <main class="boardWrap" id="boardWrap">
    <div class="boardInner" id="boardInner">
      <svg id="boardSvg" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="tokens" id="tokens"></div>
      <div class="fxLayer" id="fxLayer" aria-hidden="true"></div>
      <div class="center" id="center">
        <div class="rankList" id="rankList"></div>
        <div class="diceWrap"><canvas id="diceCv" role="img" aria-label="骰子"></canvas><div class="diceSum" id="diceSum"></div></div>
        <button class="rollBtn" id="rollBtn">掷骰子</button>
        <div class="ctHint" id="ctHint">点击中间区域掷骰子</div>
      </div>
    </div>
  </main>

  <aside class="rail railL" id="railL" aria-label="玩家资产"></aside>
  <aside class="rail railR" id="railR" aria-label="本局动态"></aside>
  <footer class="dock" id="dock">
    <div class="turnPanel">
      <div class="tpAv" id="turnAv"></div>
      <div class="tpTx">
        <b id="turnName">玩家A 的回合</b>
        <span id="turnHint" aria-live="polite">掷骰子，前进吧！</span>
      </div>
      <div class="tsecWrap"><div class="timer"><i id="timerFill"></i></div><div class="tsec" id="timerTxt">30s</div></div>
    </div>
    <div class="actions" id="actions"></div>
    <div class="locBar">
      <div class="locIc" id="locIc"></div>
      <div class="locTx"><b id="locName">当前位置：起点</b><span id="locTip">经过起点，获得 $200</span></div>
      <button class="miniBtn" id="btnProps" type="button" aria-label="打开我的地产">地产</button>
      <button class="miniBtn" id="btnTrade" type="button" aria-label="发起交易">交易</button>
    </div>
  </footer>

  <div class="buyCard" id="popCard"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="turnBanner" id="turnBanner" aria-live="polite"></div>
  <div class="cardPop" id="cardPop"><div class="cpDeck" id="cpDeck">机会</div><div class="cpTx" id="cpTx"></div></div>

  <div class="modal" id="tileModal">
    <div class="mBox">
      <div class="mHead"><b id="tmName">地块</b><button class="xBtn" id="tmClose" type="button" aria-label="关闭"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="#c9554a" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg></button></div>
      <div class="mBody" id="tmBody"></div>
    </div>
  </div>

  <div class="modal" id="tradeModal">
    <div class="mBox wide">
      <div class="mHead"><b>发起交易</b><button class="xBtn" id="trClose" type="button" aria-label="关闭"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="#c9554a" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg></button></div>
      <div class="mBody" id="trBody"></div>
    </div>
  </div>

  <div class="modal" id="trInModal">
    <div class="mBox">
      <div class="mHead"><b>交易请求</b></div>
      <div class="mBody" id="trInBody"></div>
    </div>
  </div>

  <div class="sheet" id="logSheet">
    <div class="sheetHead"><b>行动日志</b><button class="xBtn" id="logClose" type="button" aria-label="关闭"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="#c9554a" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg></button></div>
    <div class="logList" id="logList"></div>
  </div>

  <div class="sheet" id="propSheet">
    <div class="sheetHead"><b>我的地产</b><button class="xBtn" id="propClose" type="button" aria-label="关闭"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="#c9554a" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg></button></div>
    <div class="logList" id="propList"></div>
  </div>

  <div class="modal" id="winModal">
    <div class="mBox win"><div class="mBody" id="winBody"></div></div>
  </div>

  <div class="sheet" id="roomSheet">
    <div class="sheetHead"><b>房间</b><button class="xBtn" id="roomClose" type="button" aria-label="关闭"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="#c9554a" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg></button></div>
    <div class="roomBody" id="roomBody"></div>
  </div>

  <div class="roomLayer" id="roomLayer"><div class="rlCard" id="rlCard"></div></div>
</div>
<pre id="dbg"></pre>

<script src="assets/lib/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/data.js"></script>
<script src="../js/engine.js"></script>
<script src="../js/net.js"></script>
<script>
(function () {
  'use strict';
  const D = window.MonoData, ENG = window.MonoEngine;
  const TILES = D.TILES, GROUPS = D.GROUPS;
  const dbgEl = document.getElementById('dbg');
  const dbg = function (s) { dbgEl.textContent += s + '\n'; };
  window.addEventListener('error', function (e) { dbg('ERR ' + e.message + ' @' + e.lineno); });
  const $ = function (id) { return document.getElementById(id); };

  /* ================= 透视几何 ================= */
  const B0 = 0.024;                   // 外框（白边）
  const RING = 0.082;                // 地块环厚
  const PAD = 26;                    // viewBox 留白
  let WB = 1120, HB = 880, QP = 0.34; // 透视强度：顶部宽度 = WB/(1+QP)
  let VB = { x: 0, y: 0, w: 1, h: 1 };
  let LARGE = false;
  let built = false;
  const SPAN = 1 - (B0 + RING) * 2;
  const CW = SPAN / 9;

  function gY(t) { return 1 - Math.log(1 + QP * (1 - t)) / Math.log(1 + QP); }
  function proj(u, v) {
    const s = 1 / (1 + QP * (1 - v));
    return { x: (u - 0.5) * WB * s, y: gY(v) * HB };
  }
  function setGeom(desktop) {
    if (desktop) { WB = 1100; HB = 790; QP = 0.34; }
    else { WB = 900; HB = 858; QP = 0.44; }
    VB = { x: -WB / 2 - PAD, y: -PAD, w: WB + PAD * 2, h: HB + PAD * 2 };
  }

  /* 40 格：u 左右、v 远近（0 远端，1 近端） */
  function cellUV(i) {
    const a = B0, r = RING, b = 1 - B0, e = 1 - B0 - RING;
    if (i === 0) return { u0: e, u1: b, v0: e, v1: b };
    if (i === 10) return { u0: a, u1: a + r, v0: e, v1: b };
    if (i === 20) return { u0: a, u1: a + r, v0: a, v1: a + r };
    if (i === 30) return { u0: e, u1: b, v0: a, v1: a + r };
    if (i < 10) { const k = i; return { u0: e - k * CW, u1: e - (k - 1) * CW, v0: e, v1: b }; }
    if (i < 20) { const k = i - 10; return { u0: a, u1: a + r, v0: e - k * CW, v1: e - (k - 1) * CW }; }
    if (i < 30) { const k = i - 20; return { u0: a + r + (k - 1) * CW, u1: a + r + k * CW, v0: a, v1: a + r }; }
    const k = i - 30;
    return { u0: e, u1: b, v0: a + r + (k - 1) * CW, v1: a + r + k * CW };
  }
  function quad(i) {
    const c = cellUV(i);
    return [proj(c.u0, c.v0), proj(c.u1, c.v0), proj(c.u1, c.v1), proj(c.u0, c.v1)];
  }
  function pathOf(pts) {
    return 'M' + pts.map(function (p) { return p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' L') + ' Z';
  }
  function isPropCell(tt) { return tt && tt.type === 'prop'; }
  function edgeStrip(i) {
    const c = cellUV(i), w = RING * 0.34;
    if (i >= 1 && i <= 9) return { u0: c.u0, u1: c.u1, v0: c.v1 - w, v1: c.v1 };
    if (i >= 11 && i <= 19) return { u0: c.u0, u1: c.u0 + w, v0: c.v0, v1: c.v1 };
    if (i >= 21 && i <= 29) return { u0: c.u0, u1: c.u1, v0: c.v0, v1: c.v0 + w };
    if (i >= 31 && i <= 39) return { u0: c.u1 - w, u1: c.u1, v0: c.v0, v1: c.v1 };
    return null;
  }
  function cellCenter(i) {
    const c = cellUV(i);
    return proj((c.u0 + c.u1) / 2, (c.v0 + c.v1) / 2);
  }
  function cellSize(i) {
    const q = quad(i);
    const w = Math.hypot(q[1].x - q[0].x, q[1].y - q[0].y);
    const h = Math.hypot(q[3].x - q[0].x, q[3].y - q[0].y);
    return { w: w, h: h };
  }
  function cellAngle(i) {
    if (i >= 11 && i <= 19) return -90;
    if (i >= 31 && i <= 39) return 90;
    return 0;
  }

  /* ================= 调色 ================= */
  function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const f = function (v) { return Math.max(0, Math.min(255, Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k))); };
    return '#' + ((f(r) << 16) | (f(g) << 8) | f(b)).toString(16).padStart(6, '0');
  }
  const TYPE_COLOR = {
    go: '#f7e8bd', rail: '#9ecdf2', util: '#9fe6d6', chance: '#ffd97a',
    chest: '#cfb4f2', tax: '#ffb3a9', jail: '#cddbea', free: '#b1e9ac', gotojail: '#ffb7ab'
  };
  const TYPE_TXT = { go: 'START', rail: '车站', util: '公用', chance: '机会', chest: '命运', tax: '税', jail: '监狱', free: '停车场', gotojail: '入狱' };
  function tileColor(t) {
    if (t.type === 'prop') return (GROUPS[t.group] || {}).color || '#e6dfcc';
    return TYPE_COLOR[t.type] || '#e6dfcc';
  }

  /* ================= 头像 ================= */
  function avatarSVG(pl) {
    const hat = pl.hat || '#f2c94c', skin = '#ffddbd';
    return '<svg viewBox="0 0 44 44">' +
      '<circle cx="22" cy="22" r="21" fill="#ffffff"/>' +
      '<circle cx="22" cy="23.5" r="13.6" fill="' + skin + '"/>' +
      '<path d="M7.6 20.4c0-8.6 6.4-13.4 14.4-13.4s14.4 4.8 14.4 13.4z" fill="' + hat + '"/>' +
      '<path d="M7.2 19.4h29.6c1.4 0 2.4 1 2.4 2.2s-1 2.2-2.4 2.2H7.2c-1.4 0-2.4-1-2.4-2.2s1-2.2 2.4-2.2z" fill="' + shade(hat, -0.14) + '"/>' +
      '<circle cx="16.4" cy="26" r="2.35" fill="#26304a"/>' +
      '<circle cx="27.6" cy="26" r="2.35" fill="#26304a"/>' +
      '<circle cx="17.2" cy="25.2" r="0.9" fill="#fff" opacity=".9"/>' +
      '<circle cx="28.4" cy="25.2" r="0.9" fill="#fff" opacity=".9"/>' +
      '<circle cx="12.8" cy="29.4" r="2.5" fill="#ff9d90" opacity=".5"/>' +
      '<circle cx="31.2" cy="29.4" r="2.5" fill="#ff9d90" opacity=".5"/>' +
      '<path d="M18.8 31.2c1.8 1.8 4.6 1.8 6.4 0" stroke="#26304a" stroke-width="1.5" fill="none" stroke-linecap="round"/>' +
      '<path d="M6 44c1.6-6.6 8-9.4 16-9.4s14.4 2.8 16 9.4z" fill="' + pl.color + '"/>' +
      '</svg>';
  }
  const FACES = [
    avatarSVG({ color: '#e8544a', hat: '#f2c94c' }),
    avatarSVG({ color: '#3f7fe0', hat: '#2c3e57' }),
    avatarSVG({ color: '#2f9e63', hat: '#e0a35c' }),
    avatarSVG({ color: '#d9a13b', hat: '#6b4a2f' })
  ];
  const FACE_OF = function (i) { return FACES[((i % 4) + 4) % 4]; };

  /* ================= Q 版小房子 ================= */
  function house(cx, cy, w, body, roof, sw, hf) {
    const hh = w * 0.56 * (hf || 1), rh = w * 0.52;
    const x0 = cx - w / 2, y0 = cy - hh;
    const f = function (n) { return n.toFixed(1); };
    return '<g>' +
      '<ellipse cx="' + f(cx) + '" cy="' + f(cy + w * 0.05) + '" rx="' + f(w * 0.54) + '" ry="' + f(w * 0.16) + '" fill="#20361c" opacity=".22"/>' +
      /* 房体 */
      '<rect x="' + f(x0) + '" y="' + f(y0) + '" width="' + f(w) + '" height="' + f(hh) + '" rx="' + f(w * 0.1) + '" fill="' + body + '" stroke="#ffffff" stroke-width="' + sw + '"/>' +
      /* 右侧受光弱一点 */
      '<rect x="' + f(x0 + w * 0.74) + '" y="' + f(y0 + hh * 0.14) + '" width="' + f(w * 0.22) + '" height="' + f(hh * 0.8) + '" rx="' + f(w * 0.06) + '" fill="#2b3a2b" opacity=".1"/>' +
      /* 屋顶 */
      '<path d="M' + f(cx - w * 0.66) + ',' + f(y0 + 1) + ' L' + f(cx) + ',' + f(y0 - rh) + ' L' + f(cx + w * 0.66) + ',' + f(y0 + 1) + ' Z" fill="' + roof + '" stroke="#ffffff" stroke-width="' + sw + '"/>' +
      '<path d="M' + f(cx - w * 0.5) + ',' + f(y0 - rh * 0.28) + ' L' + f(cx - w * 0.14) + ',' + f(y0 - rh * 0.86) + ' L' + f(cx - w * 0.02) + ',' + f(y0 - rh * 0.72) + ' L' + f(cx - w * 0.36) + ',' + f(y0 - rh * 0.18) + ' Z" fill="#ffffff" opacity=".3"/>' +
      /* 两扇窗 */
      '<rect x="' + f(cx - w * 0.33) + '" y="' + f(y0 + hh * 0.18) + '" width="' + f(w * 0.2) + '" height="' + f(hh * 0.26) + '" rx="' + f(w * 0.04) + '" fill="#fffdf6"/>' +
      '<rect x="' + f(cx + w * 0.13) + '" y="' + f(y0 + hh * 0.18) + '" width="' + f(w * 0.2) + '" height="' + f(hh * 0.26) + '" rx="' + f(w * 0.04) + '" fill="#fffdf6"/>' +
      '<path d="M' + f(cx - w * 0.23) + ',' + f(y0 + hh * 0.18) + ' v' + f(hh * 0.26) + ' M' + f(cx + w * 0.23) + ',' + f(y0 + hh * 0.18) + ' v' + f(hh * 0.26) + '" stroke="' + roof + '" stroke-width="' + f(Math.max(1, w * 0.02)) + '" opacity=".5"/>' +
      /* 门 */
      '<rect x="' + f(cx - w * 0.12) + '" y="' + f(cy - hh * 0.42) + '" width="' + f(w * 0.24) + '" height="' + f(hh * 0.42) + '" rx="' + f(w * 0.05) + '" fill="#fffdf6"/>' +
      '<circle cx="' + f(cx + w * 0.07) + '" cy="' + f(cy - hh * 0.18) + '" r="' + f(Math.max(1, w * 0.025)) + '" fill="' + roof + '" opacity=".7"/>' +
      '</g>';
  }
  function tower(cx, cy, w, hf, c1, c2) {
    const bh = w * 1.05 * (hf || 1), rh = w * 0.3, sd = w * 0.2;
    const f = function (n) { return n.toFixed(1); };
    let o = '<g>' +
      '<ellipse cx="' + f(cx + sd * 0.4) + '" cy="' + f(cy + 2) + '" rx="' + f(w * 0.56) + '" ry="' + f(w * 0.15) + '" fill="#20361c" opacity=".22"/>' +
      /* 右侧面（暗） */
      '<path d="M' + f(cx + w / 2) + ',' + f(cy - bh + rh * 0.1) + ' L' + f(cx + w / 2 + sd) + ',' + f(cy - bh - rh * 0.2) +
        ' L' + f(cx + w / 2 + sd) + ',' + f(cy - rh * 0.2) + ' L' + f(cx + w / 2) + ',' + f(cy) + ' Z" fill="' + shade(c1, -0.2) + '" stroke="#ffffff" stroke-width="1.8"/>' +
      /* 正面 */
      '<rect x="' + f(cx - w / 2) + '" y="' + f(cy - bh) + '" width="' + f(w) + '" height="' + f(bh) + '" rx="' + f(w * 0.08) + '" fill="' + c1 + '" stroke="#ffffff" stroke-width="2"/>' +
      /* 屋顶 */
      '<path d="M' + f(cx - w * 0.56) + ',' + f(cy - bh) + ' L' + f(cx) + ',' + f(cy - bh - rh) + ' L' + f(cx + w * 0.56) + ',' + f(cy - bh) + ' Z" fill="' + c2 + '" stroke="#ffffff" stroke-width="2"/>' +
      '<path d="M' + f(cx - w * 0.4) + ',' + f(cy - bh - rh * 0.22) + ' L' + f(cx - w * 0.06) + ',' + f(cy - bh - rh * 0.82) + ' L' + f(cx + w * 0.1) + ',' + f(cy - bh - rh * 0.66) + ' L' + f(cx - w * 0.22) + ',' + f(cy - bh - rh * 0.12) + ' Z" fill="#ffffff" opacity=".26"/>';
    for (let row = 0; row < 2; row++) {
      for (let k = -1; k <= 1; k++) {
        o += '<rect x="' + f(cx + k * w * 0.27 - w * 0.075) + '" y="' + f(cy - bh * (0.72 - row * 0.3)) +
          '" width="' + f(w * 0.15) + '" height="' + f(bh * 0.17) + '" rx="1.4" fill="#fffdf6" opacity=".9"/>';
      }
    }
    return o + '</g>';
  }

  /* ================= 棋盘 ================= */
  const DECOR = [['#ffe3ad', '#e08d55'], ['#bcdffa', '#4b8bd0'], ['#ffc7db', '#d8648c'],
    ['#cdeeb2', '#5da457'], ['#ffe1a4', '#c9963f'], ['#cdd2fb', '#737ecb'],
    ['#ffcdae', '#cb7442'], ['#b4ebdd', '#46a794'], ['#e5d4fb', '#9e82d1']];

  function buildBoard() {
    let s = '<defs>' +
      '<pattern id="grass" width="120" height="120" patternUnits="userSpaceOnUse">' +
      '<image href="assets/tex/grass.png" width="120" height="120" preserveAspectRatio="none"/></pattern>' +
      '<filter id="softDrop" x="-20%" y="-20%" width="150%" height="160%">' +
      '<feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#20303a" flood-opacity=".32"/></filter>' +
      '</defs>';

    /* 1. 棋盘板：青绿厚框 + 白色内沿 + 草地内场 */
    const outer = [proj(-0.028, -0.028), proj(1.028, -0.028), proj(1.028, 1.028), proj(-0.028, 1.028)];
    const plate = [proj(0, 0), proj(1, 0), proj(1, 1), proj(0, 1)];
    const court = [proj(B0 + RING, B0 + RING), proj(1 - B0 - RING, B0 + RING),
      proj(1 - B0 - RING, 1 - B0 - RING), proj(B0 + RING, 1 - B0 - RING)];

    s += '<g filter="url(#softDrop)">';
    s += '<path d="' + pathOf(outer) + '" fill="#2e94ab"/>';
    s += '<path d="' + pathOf(plate) + '" fill="#5ad0e0"/>';
    s += '<path d="' + pathOf(court) + '" fill="#ffffff"/>';
    s += '<path d="' + pathOf(plate) + '" fill="none" stroke="#ffffff" stroke-width="2.2" opacity=".65"/>';
    s += '<path d="' + pathOf([proj(0, 0), proj(1, 0), proj(1, 0.22), proj(0, 0.22)]) + '" fill="#ffffff" opacity=".16"/>';
    s += '<path d="' + pathOf(court) + '" fill="url(#grass)"/>';
    s += '<path d="' + pathOf(court) + '" fill="#8ed363" opacity=".3"/>';
    s += '<path d="' + pathOf(court) + '" fill="none" stroke="#ffffff" stroke-width="3" opacity=".9"/>';
    s += '</g>';

    /* 2. 内场装饰：草地上的浅纹路（横竖两条石板路） */
    s += '<g opacity=".5">';
    const roadV = [proj(0.5 - 0.035, RING), proj(0.5 + 0.035, RING), proj(0.5 + 0.045, 1 - RING), proj(0.5 - 0.045, 1 - RING)];
    s += '<path d="' + pathOf(roadV) + '" fill="#eaf3d8"/>';
    const roadH = [proj(RING, 0.5 - 0.032), proj(1 - RING, 0.5 - 0.036), proj(1 - RING, 0.5 + 0.036), proj(RING, 0.5 + 0.032)];
    s += '<path d="' + pathOf(roadH) + '" fill="#eaf3d8"/>';
    s += '</g>';

    /* 2.5 中央广场：给 logo / 排行 / 骰子垫一块浅色场地 */
    const ctr = proj(0.5, 0.5);
    const rxp = Math.abs(proj(0.72, 0.5).x - proj(0.28, 0.5).x) / 2;
    const ryp = Math.abs(proj(0.5, 0.74).y - proj(0.5, 0.26).y) / 2;
    s += '<ellipse cx="' + ctr.x.toFixed(1) + '" cy="' + ctr.y.toFixed(1) + '" rx="' + rxp.toFixed(1) +

  function roundedBoxGeo(w, h, d, seg, r) {
    const geo = new THREE.BoxGeometry(w, h, d, seg, seg, seg);

    const inx = w / 2 - r, iny = h / 2 - r, inz = d / 2 - r;
    const v = new THREE.Vector3(), n = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {

      n.set(Math.max(-inx, Math.min(inx, v.x)), Math.max(-iny, Math.min(iny, v.y)), Math.max(-inz, Math.min(inz, v.z)));
      v.sub(n);
      if (v.lengthSq() > 1e-8) v.normalize().multiplyScalar(r);
      pos.setXYZ(i, n.x + v.x, n.y + v.y, n.z + v.z);
    }
    geo.computeVertexNormals();
    return geo;
  }

    el.classList.add('show');

    el._t = setTimeout(function () { el.classList.remove('show'); }, 1700);

  function toast(msg) {
    const el = $('toast');

    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('show'); }, 1700);
  }

  /* ================= 动作 ================= */
  function act(action, actor) {
    if (NET.on) return netAct(action, actor);
    actor = actor || actorId();
    const before = state.players.map(function (p) { return p.pos; });
    const res = ENG.act(state, action, actor);
    if (!res.ok) { toast(res.msg || '不能这么做'); return false; }
    state = res.state;
    if (action.type === 'roll' && state.lastRoll) { rolling = true; spinDice(state.lastRoll.d1, state.lastRoll.d2); }
    syncAll(before);
    return true;
  }

  /* 联机：把动作交给房间（乐观锁写回），结果由 onRoomState 回来 */
  function netAct(action, actor) {
    window.Net.mutate(function (st) {
      const r = ENG.act(st, action, actor || NET.myId, Math.random);
      if (!r.ok) { toast(r.msg || '不能这么做'); return null; }
      return r.state;
    }).catch(function (e) { toast(e.message || '同步失败'); });
    return true;
  }
  function spinDice(d1, d2) {
    if (document.hidden) { setDieFace(dieA, d1); setDieFace(dieB, d2); renderDice(); rolling = false; return; }
    const dw = document.querySelector('.diceWrap');
    if (dw) dw.classList.add('spinning');
    const t0 = performance.now(), dur = 620;
    const ax = dieA.rotation.x, az = dieA.rotation.z, bx = dieB.rotation.x, bz = dieB.rotation.z;
    (function step() {
      const k = Math.min(1, (performance.now() - t0) / dur);
      dieA.rotation.x = ax + k * 9 * Math.PI; dieA.rotation.z = az + k * 7 * Math.PI;
      dieB.rotation.x = bx + k * 8 * Math.PI; dieB.rotation.z = bz + k * 6 * Math.PI;
      renderDice();
      if (k < 1) requestAnimationFrame(step);
      else {
        setDieFace(dieA, d1); setDieFace(dieB, d2); renderDice(); rolling = false;
        if (dw) { dw.classList.remove('spinning'); dw.classList.add('landed'); setTimeout(function () { dw.classList.remove('landed'); }, 320); }
        const ds = $('diceSum');
        if (ds) { ds.textContent = (d1 + d2); ds.classList.remove('show'); void ds.offsetWidth; ds.classList.add('show'); }
      }
    })();
  }

  /* ================= 棋子 ================= */
  const tokensEl = $('tokens');
  const tokenEls = [];
  const OFF = [[-10, -8], [10, -8], [-10, 9], [10, 9]];
  function tokenScale(pos) {
    const c = cellCenter(pos);
    const t = (c.y - VB.y) / VB.h;
    return 0.78 + 0.34 * t;
  }
  function buildTokens() {
    tokensEl.innerHTML = '';
    tokenEls.length = 0;
    state.players.forEach(function (p, i) {
      const d = document.createElement('div');
      d.className = 'token';
      d.style.setProperty('--c', D.COLORS[i]);
      d.innerHTML = '<div class="tkSh"></div><div class="tkBody">' + FACE_OF(i) + '</div>';
      tokensEl.appendChild(d);
      tokenEls.push(d);
    });
  }
  function pct(p) { return { l: ((p.x - VB.x) / VB.w) * 100, t: ((p.y - VB.y) / VB.h) * 100 }; }
  function placeToken(i, pos, hop) {
    const d = tokenEls[i];
    if (!d) return;
    if (pos == null) pos = state.players[i].pos;
    const c = cellCenter(pos), pt = pct(c);
    const sc = tokenScale(pos);
    d.style.left = pt.l.toFixed(2) + '%';
    d.style.top = pt.t.toFixed(2) + '%';
    d.style.zIndex = String(20 + Math.round(c.y / 4));
    d.style.setProperty('--tk', sc.toFixed(3));
    d.style.setProperty('--dx', OFF[i % 4][0] + 'px');
    d.style.setProperty('--dy', OFF[i % 4][1] + 'px');
    d.style.opacity = state.players[i].bankrupt ? '.3' : '1';
    if (hop) { d.classList.remove('hop'); void d.offsetWidth; d.classList.add('hop'); }
  }
  function syncTokens(before) {
    state.players.forEach(function (p, i) {
      const from = before && before[i] != null ? before[i] : p.pos;
      if (from === p.pos) { placeToken(i, p.pos); return; }
      const steps = (p.pos - from + 40) % 40;
      if (steps > 18) { placeToken(i, p.pos); return; }
      let k = 0;
      const t = setInterval(function () {
        k++;
        placeToken(i, (from + k) % 40, true);
        if (k >= steps) clearInterval(t);
      }, 82);
    });
    tokenEls.forEach(function (el, i) {
      el.className = 'token' + (state.players[i].id === actorId() ? ' me' : '') + (state.players[i].inJail ? ' jailed' : '');
    });
  }

  function renderRails() {

  /* ================= 交易 ================= */
  const tradeDraft = { toId: null, offerTiles: [], requestTiles: [], offerCash: 0, requestCash: 0 };
  function openTrade() {
    const me = cur();
    const others = state.players.filter(function (p) { return p.id !== me.id && !p.bankrupt; });
    tradeDraft.toId = others.length ? others[0].id : null;

  function renderTrade() {
    const me = cur();
    if (!tradeDraft.toId) {
      $('trBody').innerHTML = '<div class="logrow">没有可交易的玩家</div>';
      return;
    }
    const other = pById(tradeDraft.toId);
    const mineTiles = ENG.propsOf(state, me.id).filter(function (i) { return state.props[i].houses === 0; });

      const on = (side === 'offer' ? tradeDraft.offerTiles : tradeDraft.requestTiles).indexOf(i) >= 0;
      return '<button class="tchip' + (on ? ' on' : '') + '" data-side="' + side + '" data-i="' + i + '" style="--gc:' + tileColor(TILES[i]) + '">' + TILES[i].name + '</button>';
    };

      '<div class="trWho">和谁换 <div class="trWhoBtns">' + state.players.filter(function (p) { return p.id !== me.id && !p.bankrupt; })
        .map(function (p) { return '<button class="wBtn' + (p.id === tradeDraft.toId ? ' on' : '') + '" data-to="' + p.id + '">' + p.name + '</button>'; }).join('') + '</div></div>' +
      '<div class="trSec"><b>你给出（现金 $' + me.money + '）</b><div class="trChips">' +

        '<input class="trInput" id="trOfferCash" type="number" min="0" max="' + me.money + '" placeholder="附加现金" value="' + (tradeDraft.offerCash || '') + '"></div>' +
      '<div class="trSec"><b>你要换到（现金 $' + other.money + '）</b><div class="trChips">' +
        (otherTiles.length ? otherTiles.map(function (i) { return chip(i, 'request'); }).join('') : '<span class="dim">对方没有可交易的地产</span>') + '</div>' +
        '<input class="trInput" id="trRequestCash" type="number" min="0" max="' + other.money + '" placeholder="要对方补现金" value="' + (tradeDraft.requestCash || '') + '"></div>' +
      '<div class="trBtns"><button class="actBtn alt" id="trCancel">取消</button><button class="actBtn primary" id="trSend">发起交易</button></div>';

    $('trBody').querySelectorAll('.wBtn').forEach(function (b) {
      b.onclick = function () { tradeDraft.toId = b.getAttribute('data-to'); tradeDraft.offerTiles = []; tradeDraft.requestTiles = []; renderTrade(); };
    });
    $('trBody').querySelectorAll('.tchip').forEach(function (b) {
      b.onclick = function () {
        const side = b.getAttribute('data-side'), i = Number(b.getAttribute('data-i'));
        const arr = side === 'offer' ? tradeDraft.offerTiles : tradeDraft.requestTiles;

        renderTrade();
      };
    });
    const oc = $('trOfferCash'), rc = $('trRequestCash');
    if (oc) oc.oninput = function () { tradeDraft.offerCash = Math.max(0, Math.min(me.money, Number(oc.value) || 0)); };
    if (rc) rc.oninput = function () { tradeDraft.requestCash = Math.max(0, Math.min(other.money, Number(rc.value) || 0)); };
    $('trCancel').onclick = function () { $('tradeModal').classList.remove('open'); };
    $('trSend').onclick = function () {
      const ok = act({
        type: 'tradePropose', toId: tradeDraft.toId,
        offerTiles: tradeDraft.offerTiles, requestTiles: tradeDraft.requestTiles,
        offerCash: tradeDraft.offerCash, requestCash: tradeDraft.requestCash
      });
      if (ok) $('tradeModal').classList.remove('open');
    };
  }

  /* ================= 计时 ================= */
  function updateTimer() {
    if (NET.on) {
      const p0 = state.players[state.turn];
      $('timerFill').style.width = '100%';
      $('timerFill').style.background = '#7ed957';
      if (!p0) $('timerTxt').textContent = '';
      else if (p0.id === NET.myId) $('timerTxt').textContent = '你的回合';
      else if (window.Net.presenceActive() && !window.Net.isOnline(p0.id)) $('timerTxt').textContent = '离线 · 稍后自动跳过';
      else $('timerTxt').textContent = '在线';
      return;
    }
    const p = Math.max(0, timerLeft / 30);
    $('timerFill').style.width = (p * 100) + '%';
    $('timerFill').style.background = p > 0.5 ? '#7ed957' : (p > 0.25 ? '#ffc244' : '#ff6b5b');
    $('timerTxt').textContent = Math.max(0, timerLeft) + 's';
    const pcT = $('pcT');
    if (pcT) pcT.textContent = Math.max(0, timerLeft) + 's';
  }
  function resetTimer() { timerLeft = 30; updateTimer(); }
  function autoAct() {
    if (state.phase === 'ended' || autoLock || NET.on) return;
    autoLock = true;
    setTimeout(function () { autoLock = false; }, 700);
    const tp = state.turnPhase;
    if (tp === 'awaitRoll') act({ type: 'roll' });
    else if (tp === 'awaitBuy') act({ type: 'decline' });
    else if (tp === 'awaitAuction') {
      const a = state.auction;
      const bidder = a ? a.queue[a.i] : null;
      if (bidder) act({ type: 'auctionPass' }, bidder);
    } else act({ type: 'endTurn' });
    resetTimer();
  }

  /* ================= 总渲染 ================= */
  let lastMoneyMap = null, lastTurnKey = null, prevHouses = {}, curDelta = {};
  function syncAll(before) {
    /* 金钱变化 → 棋子旁边飘 +$ / -$ */
    curDelta = {};
    if (lastMoneyMap) {
      state.players.forEach(function (p, i) {
        const prev = lastMoneyMap[p.id];
        if (prev == null || prev === p.money) return;
        const d = p.money - prev;
        curDelta[p.id] = d;
        const c = cellCenter(p.pos), pt = pct(c);
        spawnFloat((d > 0 ? '+$' : '-$') + Math.abs(d), pt.l.toFixed(2), (pt.t - 9).toFixed(2), d > 0 ? 'plus' : 'minus');
        if (d > 0) spawnCoins(pt.l.toFixed(2), (pt.t - 7).toFixed(2), Math.min(10, 3 + Math.round(Math.abs(d) / 60)));
      });
    }
    /* 回合切换 → 顶部横幅 */
    const tk = state.players[state.turn] ? state.players[state.turn].id : null;
    if (lastTurnKey !== null && tk !== lastTurnKey && state.phase !== 'ended') {
      showTurnBanner(state.players[state.turn], state.turn);
    }
    lastTurnKey = tk;
    renderOverlay();
    if (lastPurchases.length) {
      lastPurchases.forEach(function (idx) {
        const pt = pct(cellCenter(idx));
        spawnCoins(pt.l.toFixed(2), (pt.t - 4).toFixed(2), 6);
      });
      lastPurchases = [];
      const bw = document.querySelector('.boardWrap');
      if (bw) { bw.classList.remove('punch'); void bw.offsetWidth; bw.classList.add('punch'); setTimeout(function () { bw.classList.remove('punch'); }, 520); }
    }
    syncTokens(before);
    renderHUD();
    renderLog();
    if ($('roomSheet').classList.contains('open')) refreshRoomSheet();
    if ($('propSheet').classList.contains('open')) renderProps();
    if (state.card && state.card.at !== lastCardAt) { lastCardAt = state.card.at; showCard(state.card); }
    const auc = !!state.auction;
    if (hadAuction && !auc) {
      const last = state.logs[state.logs.length - 1] || '拍卖结束';
      toast(last);
    }
    hadAuction = auc;
    lastMoneyMap = {};
    state.players.forEach(function (p) { lastMoneyMap[p.id] = p.money; });
    const outCount = state.players.filter(function (x) { return x.bankrupt; }).length;
    if (outCount > outSeen) { outSeen = outCount; toast('有玩家破产出局'); }
    const key = state.turn + '#' + state.turnPhase + '#' + state.phase + '#' + (state.trade ? 'T' : '') +
      '#' + (state.auction ? 'A' + state.auction.i : '');
    if (key !== lastKey) {
      lastKey = key;
      if (state.phase !== 'ended') startTimer();
    }
  }
  function startTimer() {
    if (timerId) clearInterval(timerId);
    resetTimer();
    if (NET.on) { updateTimer(); return; }
    timerId = setInterval(function () {
      timerLeft--;
      updateTimer();
      if (timerLeft <= 0) autoAct();
    }, 1000);
  }

  /* ================= 联机：房间层 ================= */
  const rl = $('roomLayer');
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function seatRow(p, i, st) {
    const on = NET.on && window.Net.presenceActive() ? window.Net.isOnline(p.id) : true;
    const isHost = p.id === (st.hostId || NET.myId);
    return '<div class="seatRow">' +
      '<span class="sDot" style="background:' + D.COLORS[i % 4] + '"></span>' +
      '<span class="sName">' + esc(p.name) + '</span>' +
      (isHost ? '<span class="sTag host">房主</span>' : '') +
      (p.id === NET.myId ? '<span class="sTag me">你</span>' : '') +
      (p.kicked ? '<span class="sTag out">已移出</span>' : '') +
      (NET.on ? '<span class="sTag ' + (on ? 'on' : 'off') + '">' + (on ? '在线' : '离线') + '</span>' : '') +
      (NET.on && NET.host && p.id !== NET.myId && !p.kicked
        ? '<button class="kickBtn" data-kick="' + p.id + '">移出</button>' : '') +
      '</div>';
  }
  function renderEntry() {
    roomPhase = 'entry';
    const nick = (window.Net && window.Net.identity.name) || localStorage.getItem('mbg:nick') || '';
    $('rlCard').innerHTML =
      '<div class="rlTitle">萌趣街区 · 联机</div>' +
      '<div class="rlSub">建个房间把邀请码发给朋友，或者输入朋友的邀请码</div>' +
      '<label class="rlField"><span>昵称</span><input id="rlNick" maxlength="12" placeholder="例如 阿蒙" value="' + esc(nick) + '"></label>' +
      '<label class="rlField"><span>邀请码</span><input id="rlCode" maxlength="5" placeholder="5 位，如 K7M2Q"></label>' +
      '<div class="rlBtns">' +
      '<button class="actBtn primary" id="rlCreate">创建房间</button>' +
      '<button class="actBtn alt" id="rlJoin">加入房间</button>' +
      '</div>' +
      '<button class="rlLocal" id="rlLocalBtn">先本地试玩（4 人热座）</button>' +
      (hasNet() ? '' : '<div class="rlWarn">没读到 Supabase 配置，联机不可用；检查 js/config.js</div>');
    rl.classList.add('show');
    $('rlCode').addEventListener('input', function (e) {
      e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');

    $('rlCreate').onclick = function () { doCreate(); };
    $('rlJoin').onclick = function () { doJoin(); };
    $('rlLocalBtn').onclick = function () { rl.classList.remove('show'); roomPhase = 'table'; };
    if (hasNet()) setTimeout(function () { if ($('rlNick')) $('rlNick').focus(); }, 120);
  }
  function readNick() {
    const v = (($('rlNick') && $('rlNick').value) || '').trim().slice(0, 12);
    if (!v) { toast('先填个昵称'); return ''; }
    window.Net.setName(v);
    return v;
  }
  async function doCreate() {
    if (!hasNet()) return toast('联机不可用：检查 js/config.js');
    const nick = readNick(); if (!nick) return;
    NET.myId = window.Net.identity.id;
    NET.host = true;
    const seed = {
      game: 'monopoly', phase: 'lobby', hostId: NET.myId,
      players: [{ id: NET.myId, name: nick }],
      logs: ['房间已建立，等朋友加入'], createdAt: Date.now()
    };
    try {
      const code = await window.Net.createRoom(seed);
      NET.code = code; NET.on = true;
      if (timerId) { clearInterval(timerId); timerId = null; }
      localStorage.setItem('mbg:room', code);
      window.Net.subscribe(code, onRoomState, onStatus);
      state = JSON.parse(JSON.stringify(seed));
      renderWaiting(seed);
    } catch (e) { toast(e.message || '创建失败'); }
  }
  async function doJoin() {
    if (!hasNet()) return toast('联机不可用：检查 js/config.js');
    const nick = readNick(); if (!nick) return;
    const code = (($('rlCode') && $('rlCode').value) || '').trim().toUpperCase();
    if (code.length !== 5) return toast('邀请码是 5 位');
    NET.myId = window.Net.identity.id;
    try {
      const row = await window.Net.joinRoom(code);
      const st = row.state;
      if (!st || !st.game) throw new Error('房间数据异常');
      if (!st.players.some(function (p) { return p.id === NET.myId; })) {
        if (st.phase === 'playing' || st.phase === 'ended') throw new Error('这局已经开始了，等下一局吧');
        if (st.players.length >= 4) throw new Error('房间满了（最多 4 人）');
        await window.Net.mutate(function (s) {
          s.players.push({ id: NET.myId, name: nick });
          s.logs = (s.logs || []).concat(nick + ' 加入了房间').slice(-20);
          return s;
        });
      }
      NET.code = code; NET.on = true;
      NET.host = st.hostId === NET.myId;
      if (timerId) { clearInterval(timerId); timerId = null; }
      localStorage.setItem('mbg:room', code);
      window.Net.subscribe(code, onRoomState, onStatus);
      const fresh = await window.Net.fetchRoom(code);
      onRoomState(fresh.state, fresh.version);
    } catch (e) {
      localStorage.removeItem('mbg:room');
      toast(e.message || '加入失败');
    }
  }
  function renderWaiting(st) {
    roomPhase = 'waiting';

  function roomPhaseState() { return $('roomSheet').classList.contains('open'); }
  function bindKickButtons() {

  function startGame() {

      if (st.players.length < 2) { toast('至少 2 人才能开始'); return null; }
      const init = ENG.createInitial(st.players.map(function (p) { return { id: p.id, name: p.name }; }), Math.random);
      init.hostId = st.hostId;

  function copyCode() {
    const code = NET.code || window.Net.getCode();
    if (!code) return;
    const done = function () { toast('邀请码已复制：' + code); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done).catch(function () { fallbackCopy(code, done); });
    } else fallbackCopy(code, done);
  }
  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('复制失败，请手动记下：' + text); }
    document.body.removeChild(ta);
  }
  function leaveNet() {
    if (NET.on && window.Net) window.Net.leave();
    localStorage.removeItem('mbg:room');
    NET.on = false; NET.code = null; NET.host = false; NET.myId = null;
    roomPhase = 'entry';
    state = ENG.createInitial(NAMES, Math.random);
    buildTokens();
    state.players.forEach(function (p, i) { placeToken(i, p.pos); });
    syncAll(null);
    rl.classList.remove('show');
    renderEntry();
    showLayer();
  }
  function showLayer() { rl.classList.add('show'); }

  /* 房间面板（局内，房主踢人 / 看在线） */
  function refreshRoomSheet() {
    const st = state;
    const seats = st.players.map(function (p, i) { return seatRow(p, i, st); }).join('');
    $('roomBody').innerHTML =
      '<div class="rsCode">邀请码 <b>' + (NET.code || '—') + '</b>' +
      '<button class="miniBtn" id="rsCopy">复制</button></div>' +
      '<div class="rsList">' + seats + '</div>' +
      '<div class="rsHint">' + (NET.host ? '你是房主：可以把掉线的人移出对局' : '房主可以把掉线的人移出对局') + '</div>' +
      '<div class="rsBtns"><button class="actBtn alt" id="rsLeave">退出房间</button></div>';
    if ($('rsCopy')) $('rsCopy').onclick = copyCode;
    if ($('rsLeave')) $('rsLeave').onclick = function () {
      $('roomSheet').classList.remove('open');
      leaveNet();
    };
    bindKickButtons();
  }

  /* 房间状态回来 */
  function onRoomState(ns, ver) {
    if (!ns || !ns.game) return;
    const prev = state;
    const before = prev && prev.players ? prev.players.map(function (p) { return p.pos; }) : null;
    const prevRoll = prev ? JSON.stringify(prev.lastRoll) : '';
    state = ns;
    if (ns.phase === 'lobby') {
      if (roomPhase !== 'waiting') renderWaiting(ns); else renderWaiting(ns);
      return;
    }
    roomPhase = 'table';
    $('app').classList.remove('waiting');
    rl.classList.remove('show');
    if (tokenEls.length !== state.players.length) {
      buildTokens();
      state.players.forEach(function (p, i) { placeToken(i, p.pos); });
    }
    if (JSON.stringify(state.lastRoll) !== prevRoll && ns.lastRoll) {
      rolling = true;
      spinDice(ns.lastRoll.d1, ns.lastRoll.d2);
    }
    syncAll(before);
    const me = state.players.filter(function (p) { return p.id === NET.myId; })[0];
    if (me && me.kicked) {
      toast('你已被房主移出对局');
      setTimeout(leaveNet, 900);
    }
  }
  function onStatus(s) {
    if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') toast('实时连接断开，正在重连…');
  }

  /* 掉线跳过：对方既不在线、这个状态又静止 30 秒，就替他跳过 */
  function skipTick() {
    if (!NET.on || roomPhase !== 'table' || !state || state.phase !== 'playing') { idleSince = Date.now(); return; }
    const p = state.players[state.turn];
    if (!p || p.bankrupt || p.id === NET.myId) { idleSince = Date.now(); return; }
    if (!window.Net.presenceActive() || window.Net.isOnline(p.id)) { idleSince = Date.now(); return; }
    if (Date.now() - idleSince < 30000) return;
    idleSince = Date.now();
    toast(p.name + ' 掉线，替他跳过这一回合');
    netAct({ type: 'skipTurn' }, NET.myId);
  }

  function bootNet() {
    const q = new URLSearchParams(location.search);
    if (q.get('local') === '1' || !hasNet()) {
      NET.on = false;
      roomPhase = 'table';
      rl.classList.remove('show');
      return;
    }
    rl.classList.add('show');
    const code = (q.get('room') || localStorage.getItem('mbg:room') || '').trim().toUpperCase();
    if (code && code.length === 5) {
      window.Net.joinRoom(code).then(function (row) {
        const st = row.state;
        if (!st || !st.players.some(function (p) { return p.id === window.Net.identity.id; })) {
          localStorage.removeItem('mbg:room');
          renderEntry();
          return;
        }
        NET.myId = window.Net.identity.id;
        NET.code = code; NET.on = true; NET.host = st.hostId === NET.myId;
        if (!window.Net.identity.name) {
          const me = st.players.filter(function (p) { return p.id === NET.myId; })[0];
          if (me) window.Net.setName(me.name);
        }
        window.Net.subscribe(code, onRoomState, onStatus);
        onRoomState(st, row.version);
      }).catch(function () {
        localStorage.removeItem('mbg:room');
        renderEntry();
      });
    } else {
      renderEntry();
    }
  }

  function applyMode() {
    const q = new URLSearchParams(location.search).get('mode');
    const desktop = q ? q === 'desktop' : window.innerWidth >= 900;
    const was = LARGE;
    LARGE = desktop;
    $('app').className = 'app ' + (desktop ? 'desktop' : 'mobile');
    setGeom(desktop);
    if (built && was !== desktop) {
      buildBoard();
      if (tokenEls.length) state.players.forEach(function (p, i) { placeToken(i, p.pos); });
    }
    setTimeout(function () { sizeBoard(); renderDice(); }, 60);
  }
  function sizeBoard() {
    const wrap = $('boardWrap'), inner = $('boardInner');
    const aw = wrap.clientWidth, ah = wrap.clientHeight;
    if (!aw || !ah) return;
    const ratio = VB.w / VB.h;
    let w = aw, h = aw / ratio;
    if (h > ah) { h = ah; w = ah * ratio; }
    inner.style.width = Math.floor(w) + 'px';
    inner.style.height = Math.floor(h) + 'px';
    inner.style.setProperty('--bs', Math.floor(w) + 'px');
    const cy0 = gY(B0 + RING), cy1 = gY(1 - B0 - RING);
    inner.style.setProperty('--cty', ((((cy0 + cy1) / 2) * HB - VB.y) / VB.h * 100).toFixed(2) + '%');
    inner.style.setProperty('--cs', Math.round((cy1 - cy0) * h) + 'px');
    if (tokenEls.length) state.players.forEach(function (p, i) { placeToken(i, p.pos); });
  }

  /* ================= 弹层按钮 ================= */
  $('btnLog').onclick = function () { $('propSheet').classList.remove('open'); $('logSheet').classList.add('open'); };
  $('logClose').onclick = function () { $('logSheet').classList.remove('open'); };
  $('btnProps').onclick = function () { $('logSheet').classList.remove('open'); $('propSheet').classList.add('open'); renderProps(); };
  $('propClose').onclick = function () { $('propSheet').classList.remove('open'); };
  $('btnTrade').onclick = openTrade;
  $('trClose').onclick = function () { $('tradeModal').classList.remove('open'); };
  $('tmClose').onclick = function () { $('tileModal').classList.remove('open'); };
  $('btnHome').onclick = function () { location.href = '../index.html'; };
  $('roomPill').onclick = function () {
    if (!NET.on) { toast('本地热座：没有房间'); return; }
    refreshRoomSheet();
    $('roomSheet').classList.add('open');
  };
  $('roomClose').onclick = function () { $('roomSheet').classList.remove('open'); };
  $('rollBtn').onclick = function () { if (state.turnPhase === 'awaitRoll' && !rolling && myTurn()) act({ type: 'roll' }); };
  $('center').addEventListener('click', function (e) {
    if (e.target.closest('#rollBtn') || e.target.closest('.rankList')) return;
    if (state.turnPhase === 'awaitRoll' && !rolling && myTurn()) act({ type: 'roll' });
  });

  function syncAnimFlag() { document.body.classList.toggle('noanim', document.hidden); }
  syncAnimFlag();
  document.addEventListener('visibilitychange', syncAnimFlag);
  setInterval(syncAnimFlag, 500);

  applyMode();
  buildBoard();
  built = true;
  buildTokens();
  state.players.forEach(function (p, i) { placeToken(i, p.pos); });
  syncAll(null);
  renderDice();
  window.addEventListener('resize', function () { applyMode(); });
  window.addEventListener('orientationchange', function () { setTimeout(applyMode, 200); });
  sizeBoard();
  bootNet();
  setInterval(skipTick, 5000);
  setInterval(function () {
    if (NET.on && roomPhase === 'table' && window.Net.presenceActive()) renderRank();
  }, 6000);
  if (new URLSearchParams(location.search).get('dbg') === '1') dbgEl.style.display = 'block';
  if (new URLSearchParams(location.search).get('dbg') === '1') {
    const panel = document.createElement('div');
    panel.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:9999;display:flex;gap:6px;flex-wrap:wrap;max-width:60vw';
    const mk = function (label, fn) {
      const b = document.createElement('button');
      b.textContent = label;
      b.style.cssText = 'font:12px/1.2 sans-serif;padding:6px 8px;border-radius:8px;border:1px solid #333;background:#fff';
      b.onclick = function () { fn(); syncAll(null); };
      panel.appendChild(b);
    };
    mk('入狱A', function () {
      const p0 = state.players[0];
      p0.pos = 10; p0.inJail = true; p0.jailTurns = 0;
      state.turn = 0; state.turnPhase = 'awaitRoll';
    });
    mk('给A棕地', function () {
      [1, 3].forEach(function (i) { state.props[i].owner = state.players[0].id; });
      state.players[0].pos = 1; state.turn = 0; state.turnPhase = 'awaitEnd';
    });
    mk('A钱1000', function () { state.players[0].money = 1000; });
    mk('B破产', function () { state.players[1].bankrupt = true; });
    mk('C破产', function () { state.players[2].bankrupt = true; });
    mk('抽卡', function () {
      state.card = { deck: 'chance', text: '银行分红，领取 $50（调试卡）', at: Date.now() };
    });
    mk('终局', function () { [1, 2, 3].forEach(function (k) { state.players[k].bankrupt = true; }); state.phase = 'ended'; state.winner = state.players[0].id; });
    document.body.appendChild(panel);
  }
  dbg('ready ' + VB.w.toFixed(0) + 'x' + VB.h.toFixed(0));
})();
</script>
</body>
</html>
