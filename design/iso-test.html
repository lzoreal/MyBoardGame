<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>等距素材拼装测试</title>
<style>
  html,body{margin:0;background:#101720;color:#e7e9ee;font:14px/1.5 "Microsoft YaHei",sans-serif;}
  #wrap{display:flex;justify-content:center;padding:16px;}
  canvas{image-rendering:pixelated;background:#101720;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="900" height="700"></canvas></div>
<script>
const BASE = './assets/town-shopping/environments_shopping_street_tiles_v1.0/tiles/';
const FILES = {
  asphalt: 'asphalt_plain.png',
  sidewalk: 'sidewalk_plain.png',
  brick: 'brick_paving.png',
  grass: 'grass_plain.png',
  curbU: 'curb_u.png',
  curbV: 'curb_v.png',
  curbCorner: 'curb_outer_corner.png',
  wallPlasterU: 'wall_plaster_u.png',
  wallPlasterV: 'wall_plaster_v.png',
  wallBrickU: 'wall_brick_u.png',
  wallBrickV: 'wall_brick_v.png',
  sfWindowU: 'storefront_window_u.png',
  sfWindowV: 'storefront_window_v.png',
  sfDoorU: 'storefront_glass_door_u.png',
  sfDoorV: 'storefront_glass_door_v.png',
  roofFlat: 'slate_roof_flat.png',
  roofRiseU: 'slate_roof_rise_u.png',
  roofFallU: 'slate_roof_fall_u.png',
  awningU: 'striped_awning_u.png',
  awningV: 'striped_awning_v.png',
  signU: 'blank_shop_sign_u.png',
  signV: 'blank_shop_sign_v.png',
  cornerPost: 'corner_post_brick.png',
  downpipe: 'corner_downpipe.png',
  vent: 'roof_vent.png',
  chimney: 'brick_chimney.png'
};

const img = {};
let loaded = 0;
const total = Object.keys(FILES).length;
const missing = [];
for (const k in FILES) {
  const i = new Image();
  i.onload = () => { if (++loaded === total) draw(); };
  i.onerror = () => { missing.push(k + ' → ' + FILES[k]); };
  i.src = BASE + FILES[k];
  img[k] = i;
}

const c = document.getElementById('c');
const ctx = c.getContext('2d');
ctx.imageSmoothingEnabled = false;

// 先在 1:1 的离屏画布上拼装，再整体缩放贴到显示画布（保持像素硬边）
const off = document.createElement('canvas');
off.width = 1400; off.height = 1000;
const octx = off.getContext('2d');
octx.imageSmoothingEnabled = false;

const ANCHOR_X = 192, ANCHOR_Y = 352;
const SCALE = parseFloat(new URLSearchParams(location.search).get('s') || '0.3');
const OX = 700, OY = 160;      // 网格 (0,0) 的锚点位置（离屏坐标）

function piece(name, u, v, z) {
  const im = img[name];
  if (!im || !im.width) return;
  const sx = OX + 128 * (u - v) - ANCHOR_X;
  const sy = OY + 64 * (u + v) - (z || 0) - ANCHOR_Y;
  octx.drawImage(im, Math.round(sx), Math.round(sy));
}

function draw() {
  octx.clearRect(0, 0, off.width, off.height);
  octx.imageSmoothingEnabled = false;

  // 4x4 地面：沥青 + 草地
  for (let u = 0; u < 4; u++) for (let v = 0; v < 4; v++) piece('asphalt', u, v, 0);
  piece('grass', 3, 0, 0);
  piece('grass', 3, 1, 0);

  // 人行道（抬高 12px）+ 外侧路缘
  for (let u = 1; u < 3; u++) for (let v = 1; v < 3; v++) piece('sidewalk', u, v, 12);
  piece('curbU', 1, 2, 12); piece('curbU', 2, 2, 12);
  piece('curbV', 2, 1, 12); piece('curbV', 2, 2, 12);
  piece('curbCorner', 2, 2, 12);

  // 一间店铺：占 (1,1) 一格
  piece('wallPlasterU', 1, 1, 12);
  piece('wallPlasterV', 1, 1, 12);
  piece('sfWindowU', 1, 1, 12);        // 正面换成橱窗
  piece('sfDoorU', 2, 1, 12);          // 第二格做门（这里仅示意）
  piece('roofFlat', 1, 1, 268);
  piece('awningU', 1, 1, 0);
  piece('signU', 1, 1, 0);
  piece('cornerPost', 1, 1, 12);

  // 第二间：砖墙 + 坡屋顶（rise/fall 成对）
  piece('wallBrickU', 1, 2, 12);
  piece('wallBrickV', 1, 2, 12);
  piece('roofRiseU', 1, 2, 268);
  piece('roofFallU', 2, 2, 268);

  // 屋顶配件
  piece('chimney', 1, 1, 268);
  piece('vent', 2, 1, 268);
  piece('downpipe', 2, 2, 0);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, 0, 0, Math.round(off.width * SCALE), Math.round(off.height * SCALE));
  ctx.fillStyle = '#e7e9ee';
  ctx.font = '13px sans-serif';
  ctx.fillText('iso tile test — ' + loaded + '/' + total + ' loaded  scale=' + SCALE, 20, 24);
  if (missing.length) ctx.fillText('404: ' + missing.join(', '), 20, 44);
}
</script>
</body>
</html>
