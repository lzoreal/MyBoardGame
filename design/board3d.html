<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>大富翁 · 经典桌游（3D 棋盘原型）</title>
<style>
  :root{
    --p1:#ef5b4c; --p2:#3d8ef0; --p3:#57c06a; --p4:#e6a01e;
    --ink:#2b3550; --panel:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(180deg,#87c8f2 0%,#bfe6f7 45%,#d9f0d2 100%);}
  body{display:flex;flex-direction:column}

  .app{flex:1;display:grid;gap:8px;padding:8px;min-height:0}

  /* ========== 手机竖屏 ========== */
  .app.mobile{
    grid-template-rows:auto auto 1fr auto;
    grid-template-areas:"top" "players" "stage" "hud";
  }
  .topbar{grid-area:top;display:flex;align-items:center;gap:8px;
    padding:8px 10px;border-radius:16px;background:rgba(255,255,255,.72);
    box-shadow:0 3px 0 rgba(40,80,140,.12),inset 0 0 0 2px rgba(255,255,255,.9);}
  .topbar .ico{width:30px;height:30px;border:0;border-radius:10px;background:#fff;
    display:grid;place-items:center;font-size:15px;color:#4a6fa5;box-shadow:0 2px 0 #d5e2f2;}
  .topbar .room{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    height:30px;border-radius:10px;background:#3d6fd6;color:#fff;font-weight:800;font-size:13px;
    box-shadow:0 2px 0 #2d55ab,inset 0 1px 0 rgba(255,255,255,.35);}
  .topbar .rnd{padding:0 10px;height:30px;display:grid;place-items:center;border-radius:10px;
    background:#fff;color:#3d6fd6;font-weight:800;font-size:12px;box-shadow:0 2px 0 #d5e2f2;}

  .players{grid-area:players;display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .pcard{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 5px;border-radius:13px;
    color:#fff;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.4);}
  .pcard .av{width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:#fff;
    display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.9)}
  .pcard .nm{font-size:12px;line-height:1.15}
  .pcard .cash{margin-left:auto;font-size:13px;letter-spacing:.3px}

  .stage{grid-area:stage;position:relative;min-height:0;border-radius:22px;overflow:hidden;
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.55),0 6px 18px rgba(30,70,120,.22)}
  .stage canvas{display:block;width:100%;height:100%}

  .hud{grid-area:hud;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;
    gap:8px;align-items:center;padding:8px;border-radius:18px;background:rgba(255,255,255,.78);
    grid-template-areas:"turn roll" "dice dice";
    box-shadow:0 -2px 0 rgba(255,255,255,.6),0 4px 14px rgba(30,70,120,.18)}
  .turnbox{grid-area:turn;display:flex;align-items:center;gap:8px}
  .turnbox .av{width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:#fff;
    display:grid;place-items:center;box-shadow:0 0 0 3px #ffe08a}
  .turnbox b{display:block;font-size:13px;color:#2b3550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .turnbox span{display:block;font-size:11px;color:#7b879e;font-weight:600;white-space:nowrap}
  .turnbox>div{min-width:0}
  .rollBtn{grid-area:roll;height:44px;padding:0 18px;border:0;border-radius:14px;
    background:linear-gradient(180deg,#78b7ff,#3d7ff0);color:#fff;font:800 15px/1 inherit;
    box-shadow:0 4px 0 #2a58b8,inset 0 1px 0 rgba(255,255,255,.5);cursor:pointer}
  .rollBtn:active{transform:translateY(2px);box-shadow:0 2px 0 #2a58b8}
  .diceWrap{grid-area:dice;display:flex;align-items:center;justify-content:center;
    height:100px;border-radius:14px;background:linear-gradient(180deg,#dbe9fb,#bfd6f4);
    box-shadow:inset 0 2px 6px rgba(40,70,120,.18)}
  .diceWrap canvas{width:84px;height:84px}

  /* ========== 电脑横屏 ========== */
  .app.desktop{
    grid-template-columns:248px 1fr;
    grid-template-rows:auto 1fr auto;
    grid-template-areas:"top top" "players stage" "hud hud";
  }
  .app.desktop .players{grid-template-columns:1fr;gap:10px;align-content:start}
  .app.desktop .pcard{padding:10px 12px 10px 8px;border-radius:16px;font-size:14px}
  .app.desktop .pcard .av{width:44px;height:44px;flex:0 0 44px}
  .app.desktop .pcard .nm{font-size:14px}
  .app.desktop .pcard .cash{font-size:16px}
  .app.desktop .hud{grid-template-columns:56px minmax(0,1fr) 120px auto 220px;grid-template-rows:1fr;
    grid-template-areas:"turn turn dice roll loc";padding:10px 14px}
  .app.desktop .turnbox .av{width:50px;height:50px;flex:0 0 50px}
  .app.desktop .turnbox b{font-size:17px}
  .app.desktop .turnbox span{font-size:12px}
  .app.desktop .diceWrap{height:82px;background:transparent;box-shadow:none}
  .app.desktop .rollBtn{height:56px;font-size:18px;border-radius:16px;padding:0 26px}
  .locbox{grid-area:loc;display:none;flex-direction:column;justify-content:center;gap:2px;
    height:74px;padding:0 12px;border-radius:14px;background:#fff;border:2px solid #e6d6b0}
  .app.desktop .locbox{display:flex}
  .locbox b{font-size:13px;color:#2b3550}
  .locbox span{font-size:11px;color:#a58a55;font-weight:700}

  /* 头像（代码画的 Q 版） */
  .av svg{width:100%;height:100%}

  #dbg{position:fixed;left:6px;bottom:6px;max-width:60vw;max-height:40vh;overflow:auto;
    font:11px/1.35 monospace;color:#123;background:rgba(255,255,255,.85);
    border-radius:8px;padding:6px;display:none;white-space:pre-wrap;z-index:9}
</style>
</head>
<body>
<div class="app mobile" id="app">

  <header class="topbar">
    <button class="ico" id="btnHome">⌂</button>
    <div class="room">房间：A12345</div>
    <div class="rnd" id="rnd">回合 1/20</div>
  </header>

  <aside class="players" id="players"></aside>

  <main class="stage" id="stage"></main>

  <footer class="hud">
    <div class="turnbox">
      <div class="av" id="turnAv"></div>
      <div><b id="turnName">玩家A 的回合</b><span>掷骰子，前进吧！</span></div>
    </div>
    <button class="rollBtn" id="btnRoll">掷骰子</button>
    <div class="diceWrap"><canvas id="diceCv" width="192" height="192"></canvas></div>
    <div class="locbox"><b>当前位置：起点 GO</b><span>经过起点，获得 $200</span></div>
  </footer>
</div>
<pre id="dbg"></pre>

<script src="assets/lib/three.min.js"></script>
<script src="assets/lib/GLTFLoader.js"></script>
<script src="../js/data.js"></script>
<script>
(function () {
  const D = window.MonoData;
  const GROUPS = D.GROUPS, TILES = D.TILES;
  const dbgEl = document.getElementById('dbg');
  const LOG = [];
  function log(s) { LOG.push(s); dbgEl.textContent = LOG.join('\n'); }
  window.addEventListener('error', function (e) { log('ERR ' + e.message + ' @' + e.lineno); });

  /* ---------------- 棋盘坐标（与正式页一致：i0 右下起点） ---------------- */
  function cellOf(i) {
    if (i < 11) return { c: 11 - i, r: 11 };
    if (i < 21) return { c: 1, r: 11 - (i - 10) };
    if (i < 31) return { c: 1 + (i - 20), r: 1 };
    return { c: 11, r: 1 + (i - 30) };
  }
  function cellPos(i) { const rc = cellOf(i); return { x: rc.c - 6, z: rc.r - 6 }; }
  function edgeOf(i) {
    if (i < 11) return 'bottom';
    if (i < 21) return 'left';
    if (i < 31) return 'top';
    return 'right';
  }
  const CORNERS = [0, 10, 20, 30];

  /* ---------------- 玩家 mock ---------------- */
  const PLAYERS = [
    { name: '玩家A', color: '#ef5b4c', cash: 1500, pos: 0 },
    { name: '玩家B', color: '#3d8ef0', cash: 1200, pos: 7 },
    { name: '玩家C', color: '#57c06a', cash: 1800, pos: 24 },
    { name: '玩家D', color: '#e6a01e', cash: 900, pos: 33 }
  ];
  let turn = 0;
  let rolling = false;

  /* ---------------- 头像（Q 版，纯 SVG） ---------------- */
  function avatarSVG(color, skin, hair, hat) {
    return '<svg viewBox="0 0 40 40">' +
      '<circle cx="20" cy="20" r="20" fill="#fff"/>' +
      '<circle cx="20" cy="21" r="14" fill="' + skin + '"/>' +
      (hat
        ? '<path d="M6 18c0-8 6-13 14-13s14 5 14 13z" fill="' + hat + '"/>' +
          '<rect x="3" y="17" width="34" height="5" rx="2.5" fill="' + hat + '"/>'
        : '<path d="M6 20c-2-10 7-15 14-15s16 5 14 15c-3-6-7-8-14-8s-11 2-14 8z" fill="' + hair + '"/>') +
      '<circle cx="15" cy="22" r="2.2" fill="#2b3550"/>' +
      '<circle cx="25" cy="22" r="2.2" fill="#2b3550"/>' +
      '<circle cx="11.6" cy="26" r="2.4" fill="#ff9d8f" opacity=".55"/>' +
      '<circle cx="28.4" cy="26" r="2.4" fill="#ff9d8f" opacity=".55"/>' +
      '<path d="M17 28c1.6 1.6 4.4 1.6 6 0" stroke="#2b3550" stroke-width="1.4" fill="none" stroke-linecap="round"/>' +
      '<path d="M8 40c2-7 8-10 12-10s10 3 12 10z" fill="' + color + '"/>' +
      '</svg>';
  }
  const FACES = [
    avatarSVG('#ef5b4c', '#ffe0c2', '#f6d260', '#f6d260'),
    avatarSVG('#3d8ef0', '#ffdcc0', '#3a3226', null),
    avatarSVG('#57c06a', '#ffe4c8', '#7a4a2c', null),
    avatarSVG('#e6a01e', '#ffe0c2', '#4a3a26', null)
  ];

  /* ---------------- 渲染 HUD ---------------- */
  const playersEl = document.getElementById('players');
  function renderPlayers() {
    playersEl.innerHTML = PLAYERS.map(function (p, i) {
      return '<div class="pcard" style="background:linear-gradient(180deg,' + p.color + ',#' + shade(p.color, -0.18) + ');' +
        (i === turn ? 'box-shadow:0 0 0 3px #ffe08a,0 3px 0 rgba(0,0,0,.2)' : '') + '">' +
        '<div class="av">' + FACES[i] + '</div>' +
        '<div class="nm">' + p.name + '</div>' +
        '<div class="cash">$' + p.cash.toLocaleString() + '</div></div>';
    }).join('');
    document.getElementById('turnAv').innerHTML = FACES[turn];
    document.getElementById('turnName').textContent = PLAYERS[turn].name + ' 的回合';
  }
  function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const f = function (v) { return Math.max(0, Math.min(255, Math.round(k < 0 ? v * (1 + k) + 0 : v + (255 - v) * k))); };
    return ((f(r) << 16) | (f(g) << 8) | f(b)).toString(16).padStart(6, '0');
  }

  /* ---------------- three.js 场景 ---------------- */
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const cam = new THREE.OrthographicCamera(-8, 8, 8, -8, 0.1, 200);
  const CAM_DIR = new THREE.Vector3(1, 1.15, 1).normalize();
  const board = new THREE.Group();
  scene.add(board);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x9bc98f, 0.45);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff8ec, 0.62);
  sun.position.set(9, 17, 6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -11; sun.shadow.camera.right = 11;
  sun.shadow.camera.top = 11; sun.shadow.camera.bottom = -11;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 60;
  sun.shadow.bias = -0.0012;
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0xffffff, 0.16);
  fill.position.set(6, 6, 12);
  scene.add(fill);

  /* 地面：草地圆盘 */
  const grassMat = new THREE.MeshLambertMaterial({ color: 0x6ec155 });
  const plateShape = new THREE.Shape();
  const P = 7.4, R = 2.2;
  plateShape.moveTo(-P + R, -P);
  plateShape.lineTo(P - R, -P); plateShape.quadraticCurveTo(P, -P, P, -P + R);
  plateShape.lineTo(P, P - R); plateShape.quadraticCurveTo(P, P, P - R, P);
  plateShape.lineTo(-P + R, P); plateShape.quadraticCurveTo(-P, P, -P, P - R);
  plateShape.lineTo(-P, -P + R); plateShape.quadraticCurveTo(-P, -P, -P + R, -P);
  const plateGeo = new THREE.ExtrudeGeometry(plateShape, { depth: 0.5, bevelEnabled: false });
  const grass = new THREE.Mesh(plateGeo, grassMat);
  grass.rotation.x = Math.PI / 2;
  grass.position.y = -0.24;
  grass.receiveShadow = true;
  board.add(grass);

  const parkMat = new THREE.MeshLambertMaterial({ color: 0x8edc72 });
  const park = new THREE.Mesh(new THREE.BoxGeometry(8.7, 0.22, 8.7), parkMat);
  park.position.y = 0.11;
  park.receiveShadow = true;
  board.add(park);

  const roadMat = new THREE.MeshLambertMaterial({ color: 0xf2ece0 });
  const roadDark = new THREE.MeshLambertMaterial({ color: 0xb9c4cf });
  function flat(w, d, mat, x, z, y) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.12, d), mat);
    m.position.set(x, y === undefined ? 0.2 : y, z);
    m.receiveShadow = true;
    board.add(m);
    return m;
  }
  // 环路：四条边 + 四角
  flat(10.4, 1.05, roadMat, 0, 5.1);
  flat(10.4, 1.05, roadMat, 0, -5.1);
  flat(1.05, 10.4, roadMat, 5.1, 0);
  flat(1.05, 10.4, roadMat, -5.1, 0);
  flat(1.05, 1.05, roadMat, 5.1, 5.1);
  flat(1.05, 1.05, roadMat, -5.1, 5.1);
  flat(1.05, 1.05, roadMat, 5.1, -5.1);
  flat(1.05, 1.05, roadMat, -5.1, -5.1);

  /* 地产色带 */
  const bandGeoX = new THREE.BoxGeometry(0.82, 0.05, 0.56);
  const bandGeoZ = new THREE.BoxGeometry(0.56, 0.05, 0.82);

  TILES.forEach(function (t, i) {
    const p = cellPos(i);
    const edge = edgeOf(i);
    const isProp = t.type === 'prop';
    const col = isProp ? (GROUPS[t.group] ? GROUPS[t.group].color : '#cccccc') : typeColor(t.type);
    const c2 = new THREE.Color(col); c2.offsetHSL(0, 0.38, -0.16);
    const mat = new THREE.MeshLambertMaterial({ color: c2 });
    const band = new THREE.Mesh(edge === 'top' || edge === 'bottom' ? bandGeoX : bandGeoZ, mat);
    const outward = (edge === 'bottom' ? 0.22 : edge === 'top' ? -0.22 : 0);
    const sideways = (edge === 'left' ? -0.22 : edge === 'right' ? 0.22 : 0);
    band.position.set(p.x + sideways, 0.28, p.z + outward);
    band.castShadow = false;
    board.add(band);
  });
  function typeColor(t) {
    return ({
      go: '#57b76e', rail: '#5aa9ff', util: '#3fbfae', chance: '#54b7e8',
      chest: '#9b6ce0', tax: '#ef5b4c', jail: '#5c6f8f', free: '#57b76e',
      gotojail: '#ef5b4c'
    })[t] || '#cfc7b4';
  }

  /* ---------------- 模型加载 ---------------- */
  const loader = new THREE.GLTFLoader();
  const KIT_PATH = {
    commercial: 'assets/models/kit-commercial/',
    roads: 'assets/models/kit-roads/',
    suburban: 'assets/models/kit-suburban/'
  };
  const cache = {};
  function loadModel(kit, name) {
    const key = kit + ':' + name;
    if (cache[key]) return Promise.resolve(cache[key]);
    return new Promise(function (res) {
      loader.load(encodeURI(KIT_PATH[kit] + name + '.glb'), function (g) {
        cache[key] = g.scene;
        res(g.scene);
      }, undefined, function () {
        log('load fail ' + kit + '/' + name);
        res(null);
      });
    });
  }
  window.__placed = 0;
  function place(src, opt) {
    if (!src) return null;
    window.__placed++;
    const tint = new THREE.Color(opt.tint === undefined ? 0xffffff : opt.tint);
    const obj = src.clone(true);
    obj.traverse(function (o) {
      if (o.isMesh) {
        o.castShadow = true;
        o.receiveShadow = true;
        if (o.material) {
          const map = o.material.map || null;
          if (map) map.encoding = THREE.sRGBEncoding;
          o.material = new THREE.MeshLambertMaterial({ map: map, color: tint });
          o.material.emissive = tint.clone().multiplyScalar(0.14);
        }
      }
    });
    const box = new THREE.Box3().setFromObject(obj);
    const size = new THREE.Vector3(); box.getSize(size);
    const target = opt.size || 0.95;
    const s = target / Math.max(size.x, size.z, 0.001);
    obj.scale.setScalar(s);
    obj.position.set(opt.x, opt.y || 0.2, opt.z);
    obj.rotation.y = opt.rot || 0;
    board.add(obj);
    return obj;
  }

  const EXT_MODELS = ['building-a', 'building-c', 'building-e', 'building-g', 'building-i', 'building-k',
    'building-m', 'building-b', 'building-d', 'building-f', 'building-h', 'building-j', 'building-l', 'building-n'];
  const UTC = ['building-type-a', 'building-type-c', 'building-type-e', 'building-type-g', 'building-type-i',
    'building-type-k', 'building-type-m', 'building-type-o', 'building-type-q', 'building-type-s', 'building-type-u'];

  /* ---------------- 棋子 ---------------- */
  const pieces = [];
  const pieceGroup = new THREE.Group();
  board.add(pieceGroup);
  function makePiece(hex) {
    const g = new THREE.Group();
    const col = new THREE.Color(hex);
    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(0.16, 0.19, 0.26, 14),
      new THREE.MeshLambertMaterial({ color: col })
    );
    body.position.y = 0.3; body.castShadow = true;
    g.add(body);
    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.21, 16, 14),
      new THREE.MeshLambertMaterial({ color: 0xffe2c4 })
    );
    head.position.y = 0.62; head.castShadow = true;
    g.add(head);
    const cap = new THREE.Mesh(
      new THREE.SphereGeometry(0.215, 16, 8, 0, Math.PI * 2, 0, Math.PI * 0.55),
      new THREE.MeshLambertMaterial({ color: col })
    );
    cap.position.y = 0.63; cap.castShadow = true;
    g.add(cap);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x2b3550 });
    [-1, 1].forEach(function (d) {
      const e = new THREE.Mesh(new THREE.SphereGeometry(0.032, 8, 8), eyeMat);
      e.position.set(d * 0.075, 0.63, 0.185);
      g.add(e);
    });
    return g;
  }
  function seatPieces() {
    PLAYERS.forEach(function (p, idx) {
      const pos = cellPos(p.pos);
      const edge = edgeOf(p.pos);
      const off = idx * 0.18 - 0.27;
      const pg = makePiece(p.color);
      const dx = (edge === 'top' || edge === 'bottom') ? off : 0;
      const dz = (edge === 'left' || edge === 'right') ? off : 0.02;
      pg.scale.setScalar(1.35);
      pg.position.set(pos.x + dx, 0.2, pos.z + dz);
      pg.userData.player = idx;
      pieceGroup.add(pg);
      pieces.push(pg);
    });
  }

  /* ---------------- 布局 ---------------- */
  function resize() {
    const w = stage.clientWidth || 300, h = stage.clientHeight || 300;
    renderer.setSize(w, h, false);
    const aspect = w / h;
    // 需要容纳的世界尺寸（棋盘对角约 15）
    const world = 14.4;
    let vh, vw;
    if (w >= h) { vw = world; vh = world / aspect; }
    else { vh = world; vw = world * aspect; }
    cam.left = -vw / 2; cam.right = vw / 2; cam.top = vh / 2; cam.bottom = -vh / 2;
    cam.updateProjectionMatrix();
    const dist = 30;
    cam.position.copy(CAM_DIR.clone().multiplyScalar(dist));
    cam.lookAt(0, 0, 0);
    cam.up.set(0, 1, 0);
    renderer.render(scene, cam);
  }
  function applyMode() {
    const q = new URLSearchParams(location.search).get('mode');
    const desktop = q ? q === 'desktop' : window.innerWidth >= 900;
    document.getElementById('app').className = 'app ' + (desktop ? 'desktop' : 'mobile');
    setTimeout(resize, 60);
    setTimeout(resize, 220);
  }

  /* ---------------- 骰子（第二个小画布） ---------------- */
  const dcv = document.getElementById('diceCv');
  const dr = new THREE.WebGLRenderer({ canvas: dcv, antialias: true, alpha: true });
  dr.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  const ds = new THREE.Scene();
  const dc = new THREE.PerspectiveCamera(32, 1, 0.1, 50);
  dc.position.set(0, 1.5, 3.4);
  dc.lookAt(0, 0, 0);
  ds.add(new THREE.HemisphereLight(0xffffff, 0xbcd2ee, 1.0));
  const dl = new THREE.DirectionalLight(0xffffff, 0.85);
  dl.position.set(-2, 3, 3); ds.add(dl);
  const die = new THREE.Group();
  const dieMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const cube = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), dieMat);
  cube.castShadow = true;
  die.add(cube);
  const pipMat = new THREE.MeshBasicMaterial({ color: 0x2b3550 });
  const PIP = {
    1: [[0, 0]], 2: [[-1, -1], [1, 1]], 3: [[-1, -1], [0, 0], [1, 1]],
    4: [[-1, -1], [1, -1], [-1, 1], [1, 1]],
    5: [[-1, -1], [1, -1], [0, 0], [-1, 1], [1, 1]],
    6: [[-1, -1], [0, -1], [1, -1], [-1, 1], [0, 1], [1, 1]]
  };
  const FACE_AXIS = [
    { n: 1, axis: 'z', s: 1 }, { n: 6, axis: 'z', s: -1 },
    { n: 2, axis: 'y', s: 1 }, { n: 5, axis: 'y', s: -1 },
    { n: 3, axis: 'x', s: 1 }, { n: 4, axis: 'x', s: -1 }
  ];
  FACE_AXIS.forEach(function (f) {
    PIP[f.n].forEach(function (p) {
      const pip = new THREE.Mesh(new THREE.SphereGeometry(0.085, 12, 10), pipMat);
      const o = 0.5 + 0.02;
      if (f.axis === 'z') pip.position.set(p[0] * 0.26, p[1] * 0.26, f.s * o);
      if (f.axis === 'y') pip.position.set(p[0] * 0.26, f.s * o, p[1] * 0.26);
      if (f.axis === 'x') pip.position.set(f.s * o, p[0] * 0.26, p[1] * 0.26);
      die.add(pip);
    });
  });
  ds.add(die);
  function setDieFace(n) {
    const base = { 1: [0, 0, 0], 6: [0, Math.PI, 0], 2: [-Math.PI / 2, 0, 0], 5: [Math.PI / 2, 0, 0], 3: [0, 0, -Math.PI / 2], 4: [0, 0, Math.PI / 2] };
    const r = base[n] || [0, 0, 0];
    die.rotation.set(r[0], r[1], r[2]);
  }
  function renderDice() {
    const s = Math.max(60, dcv.clientWidth || 96);
    dr.setSize(s, s, false);
    dr.render(ds, dc);
  }

  /* ---------------- 交互 ---------------- */
  document.getElementById('btnRoll').addEventListener('click', function () {
    if (rolling) return;
    rolling = true;
    const n = 1 + Math.floor(Math.random() * 6);
    let t0 = performance.now();
    const dur = 700, spin = { x: die.rotation.x, z: die.rotation.z };
    function step() {
      const k = Math.min(1, (performance.now() - t0) / dur);
      die.rotation.x = spin.x + k * 8 * Math.PI;
      die.rotation.z = spin.z + k * 6 * Math.PI;
      const s = Math.max(60, dcv.clientWidth || 96);
      dr.setSize(s, s, false);
      dr.render(ds, dc);
      if (k < 1) requestAnimationFrame(step);
      else {
        setDieFace(n);
        renderDice();
        const p = PLAYERS[turn];
        p.pos = (p.pos + n) % 40;
        movePiece(turn, p.pos);
        turn = (turn + 1) % PLAYERS.length;
        document.getElementById('rnd').textContent = '回合 ' + (Math.floor(Date.now() / 1000) % 20 + 1) + '/20';
        renderPlayers();
        rolling = false;
      }
    }
    step();
  });
  function movePiece(idx, cell) {
    const pg = pieces[idx];
    const pos = cellPos(cell), edge = edgeOf(cell);
    const off = idx * 0.18 - 0.27;
    const tx = pos.x + ((edge === 'top' || edge === 'bottom') ? off : 0);
    const tz = pos.z + ((edge === 'left' || edge === 'right') ? off : 0.02);
    animate(pg.position, tx, tz);
  }
  function animate(v, tx, tz) {
    const sx = v.x, sz = v.z, t0 = performance.now(), dur = 380;
    function step() {
      const k = Math.min(1, (performance.now() - t0) / dur);
      const e = 1 - Math.pow(1 - k, 3);
      v.x = sx + (tx - sx) * e;
      v.z = sz + (tz - sz) * e;
      v.y = 0.2 + Math.sin(k * Math.PI) * 0.16;
      renderer.render(scene, cam);
      if (k < 1) requestAnimationFrame(step);
      else v.y = 0.2;
    }
    step();
  }

  /* ---------------- 建盘 ---------------- */
  async function build() {
    renderPlayers();
    setDieFace(3);
    const need = [];
    EXT_MODELS.forEach(function (m) { need.push(['commercial', m]); });
    UTC.forEach(function (m) { need.push(['suburban', m]); });
    need.push(['suburban', 'tree-large']);
    need.push(['suburban', 'tree-small']);
    await Promise.all(need.map(function (p) { return loadModel(p[0], p[1]); }));
    log('models loaded: ' + Object.keys(cache).length);

    // 外侧建筑：每个地产格一栋
    let k = 0;
    TILES.forEach(function (t, i) {
      if (t.type !== 'prop') return;
      const p = cellPos(i), edge = edgeOf(i);
      const dist = 1.12;
      const mods = EXT_MODELS;
      const nm = mods[k % mods.length]; k++;
      const x = p.x + (edge === 'left' ? -dist : edge === 'right' ? dist : 0);
      const z = p.z + (edge === 'bottom' ? dist : edge === 'top' ? -dist : 0);
      const rot = edge === 'bottom' ? Math.PI : edge === 'top' ? 0 : edge === 'left' ? -Math.PI / 2 : Math.PI / 2;
      const gc = GROUPS[t.group] ? GROUPS[t.group].color : '#cccccc';
      const tint = new THREE.Color(gc).lerp(new THREE.Color(0xffffff), 0.34).getHex();
      place(cache['commercial:' + nm], { x: x, z: z, size: 0.84, rot: rot, tint: tint });
    });

    log('ext placed ' + window.__placed);
    // 内侧小房子（代表等级）
    TILES.forEach(function (t, i) {
      if (t.type !== 'prop') return;
      const p = cellPos(i), edge = edgeOf(i);
      const dist = 1.02;
      const x = p.x + (edge === 'left' ? -dist : edge === 'right' ? dist : 0);
      const z = p.z + (edge === 'bottom' ? dist : edge === 'top' ? -dist : 0);
      const rot = edge === 'bottom' ? 0 : edge === 'top' ? Math.PI : edge === 'left' ? Math.PI / 2 : -Math.PI / 2;
      const nm = UTC[i % UTC.length];
      const gc2 = GROUPS[t.group] ? GROUPS[t.group].color : '#cccccc';
      const tint2 = new THREE.Color(gc2).lerp(new THREE.Color(0xffffff), 0.55).getHex();
      place(cache['suburban:' + nm], { x: x, z: z, size: 0.78, rot: rot, tint: tint2 });
    });

    // 公园 + 喷泉
    const stoneMat = new THREE.MeshLambertMaterial({ color: 0xdfe6ee });
    const basin = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 0.26, 22), stoneMat);
    basin.position.set(0, 0.32, 0); basin.castShadow = true; basin.receiveShadow = true;
    board.add(basin);
    const water = new THREE.Mesh(new THREE.CylinderGeometry(0.82, 0.82, 0.07, 22),
      new THREE.MeshLambertMaterial({ color: 0x63c8f0 }));
    water.position.set(0, 0.44, 0);
    board.add(water);
    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.28, 0.62, 12), stoneMat);
    pillar.position.set(0, 0.7, 0); pillar.castShadow = true;
    board.add(pillar);
    const drop = new THREE.Mesh(new THREE.SphereGeometry(0.26, 14, 12),
      new THREE.MeshLambertMaterial({ color: 0x8fe0ff }));
    drop.position.set(0, 1.0, 0);
    board.add(drop);

    // 公园里的树
    const trees = [[-3.1, -3.0], [-1.5, -3.4], [1.2, -3.2], [3.0, -2.6], [3.2, 0.6],
      [2.6, 2.9], [0.5, 3.3], [-2.0, 2.8], [-3.3, 1.1], [-2.9, -1.2], [1.9, 1.4], [-1.6, -1.6]];
    trees.forEach(function (tp, idx) {
      const nm = idx % 3 === 0 ? 'tree-large' : 'tree-small';
      place(cache['suburban:' + nm], { x: tp[0], z: tp[1], size: idx % 3 === 0 ? 0.8 : 0.55, rot: idx * 0.7, y: 0.22 });
    });

    log('total placed ' + window.__placed);
    seatPieces();
    log('built pieces=' + pieces.length);
    resize();
    renderDice();
    setTimeout(resize, 200);
    setTimeout(resize, 500);
  }

  window.addEventListener('resize', function () { applyMode(); renderDice(); });
  window.addEventListener('orientationchange', function () { setTimeout(resize, 200); });
  applyMode();
  const pvW = parseInt(new URLSearchParams(location.search).get('vw') || '0', 10);
  if (pvW) {
    const app = document.getElementById('app');
    app.style.width = pvW + 'px';
    app.style.height = '980px';
    const k = Math.min(window.innerWidth / pvW, window.innerHeight / 980);
    app.style.transformOrigin = '0 0';
    app.style.transform = 'scale(' + k + ')';
    setTimeout(resize, 120);
    setTimeout(resize, 400);
  }
  build().catch(function (e) { log('build err ' + e.message); });

  // 供调试读取
  window.__ready = true;
  setTimeout(function () { dbgEl.style.display = 'block'; }, 1000);
})();
</script>
</body>
</html>
