  /* ---------------- 伤害分配 ---------------- */
  function renderDamageModal(st) {
    const pd = st.pendingDamage;
    if (!pd) {
      if (modalMode === 'damage') closeModal();
      return;
    }
    const owner = playersOf(st)[pd.index];
    const can = canControlOwner(st, pd.index);
    const group = pd.kind === 'general' ? ['might', 'speed', 'known', 'sanity'] : (pd.kind === 'physical' ? ['might', 'speed'] : ['known', 'sanity']);
    const amount = pd.amount;
    const valueAfter = (t, n) => {
      const tr = owner.track && owner.track[t];
      if (tr) return tr.list[Math.max(0, Math.min(tr.list.length - 1, tr.pos - n - 1))];
      return Math.max(owner.min[t], owner.traits[t] - n);
    };
    const initial = Math.floor(amount / group.length);
    const rest = amount - initial * group.length;
    let html = '<h2>' + esc(owner.name) + ' 受到 ' + amount + ' 点' +
      (pd.kind === 'physical' ? '物理' : pd.kind === 'mental' ? '精神' : '通用') + '伤害</h2>' +
      '<p>' + (pd.source ? esc(pd.source) + ' · ' : '') + '伤害会让标记沿轨道下滑；走到骷髅即倒下。</p>' +
      '<div class="dmgPair" style="grid-template-columns:repeat(2,1fr)">';
    group.forEach((t, k) => {
      const v = k === group.length - 1 ? amount - initial * (group.length - 1) : initial;
      html += '<label class="dmgBox" style="display:block"><small>' + traitLabel(t) + '（' + owner.traits[t] + '）</small>' +
        '<input class="dmgNum" data-trait="' + t + '" type="number" min="0" max="' + amount + '" value="' + v + '" style="width:100%;min-height:40px;font-size:18px"></label>';
    });
    html += '</div>';
    if (can) html += '<button class="btn primary" type="button" id="dmgOk" style="width:100%;min-height:48px">确认分配</button>';
    else html += '<p>等待 ' + esc(owner.name) + ' 分配伤害。</p>';
    openModal(html, 'damage');

    const nums = Array.from(document.querySelectorAll('.dmgNum'));
    const sync = () => {
      nums.forEach((n) => {
        const t = n.getAttribute('data-trait');
        const box = n.parentElement.querySelector('small');
        box.textContent = traitLabel(t) + '（' + valueAfter(t, Number(n.value) || 0) + '）';
      });
    };
    nums.forEach((n) => n.addEventListener('input', sync));
    sync();
    const ok = $('dmgOk');
    if (ok) ok.addEventListener('click', () => {
      const parts = {};
      let sum = 0;
      nums.forEach((n) => {
        const v = Math.max(0, Math.floor(Number(n.value) || 0));
        if (v) parts[n.getAttribute('data-trait')] = v;
        sum += v;
      });
      if (sum !== amount) { alert('分配合计必须等于 ' + amount); return; }
      const asPid = window.GameShell.isLocal() ? owner.id : undefined;
      window.GameShell.send({ type: 'allocateDamage', parts: parts }, asPid);
    });
  }

  /* ---------------- 物品 ---------------- */
  function beginTradeOffer(st, me, mi, target, idx) {
    const own = me.items[idx];
    if (!own) return;
    const requestables = (target.items || []).filter((it) => !it.noTrade && !(st.itemActions || {})[it.name]);
    if (!requestables.length) {
      const sent = window.GameShell.send({ type: 'tradeOffer', target: target.id, index: idx, requestIndex: -1 });
      if (sent) closeModal(); else renderInventory(cur, mi);
      return;
    }
    const options = [{ name: '不要对方物品（纯赠送）', gift: true }].concat(requestables.map((it) => ({
      name: '要「' + it.name + '」', item: it
    })));
    chooseTarget('想向 ' + target.name + ' 换什么？', options, (pick) => {
      const requestIndex = pick.gift ? -1 : target.items.indexOf(pick.item);
      const sent = window.GameShell.send({ type: 'tradeOffer', target: target.id, index: idx, requestIndex: requestIndex });
      if (sent) closeModal(); else renderInventory(cur, mi);
    }, '你可以只送出「' + own.name + '」，也可以指定要对方一件物品；对方确认后才会交换。');
  }

  function openTradeBuilder(st, mi, other) {
    const me = playersOf(st)[mi];
    const usable = (it) => !it.noTrade && !(st.itemActions || {})[it.name];
    const box = (side, it, idx) => '<label style="display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid rgba(0,0,0,.08)">' +
      '<input type="checkbox" data-side="' + side + '" data-idx="' + idx + '" style="margin-top:3px">' +
      '<span><b>' + esc(it.name) + '</b><br><small>' + esc((it.text || '').slice(0, 60)) + '</small></span></label>';
    let html = '<h2>与 ' + esc(other.name) + ' 交易</h2><p>勾选你给出的牌和你想从对方拿的牌；对方确认后才交换。</p>' +
      '<h3 style="font-size:14px;margin:10px 0 4px">你给出</h3>';
    const mine = (me.items || []).filter(usable);
    html += mine.length ? mine.map((it) => box('own', it, me.items.indexOf(it))).join('') : '<p>你没有可交易的牌。</p>';
    html += '<h3 style="font-size:14px;margin:10px 0 4px">你要 ' + esc(other.name) + ' 的</h3>';
    const theirs = (other.items || []).filter(usable);
    html += theirs.length ? theirs.map((it) => box('want', it, other.items.indexOf(it))).join('') : '<p>对方没有可交易的牌。</p>';
    html += '<div class="actions" style="margin-top:14px"><button class="btn primary" type="button" id="tradeOk">发出交易</button>' +
      '<button class="btn ghost" type="button" id="tradeCancel">取消</button></div>';
    openModal(html, 'trade');
    $('tradeCancel').addEventListener('click', () => closeModal());
    $('tradeOk').addEventListener('click', () => {
      const give = [], want = [];
      Array.from(document.querySelectorAll('#cModalCard input[type=checkbox]')).forEach((c) => {
        if (!c.checked) return;
        (c.getAttribute('data-side') === 'own' ? give : want).push(Number(c.getAttribute('data-idx')));
      });
      if (!give.length && !want.length) { alert('至少勾一张牌'); return; }
      window.GameShell.send({ type: 'tradeOffer', target: other.id, giveIndexes: give, wantIndexes: want });
      closeModal();
    });
  }

  function renderInventory(st, mi) {
    const me = playersOf(st)[mi];
    const items = me.items || [];
    let html = '<h2>' + esc(me.name) + ' 的物品</h2><p>物品不占携带上限。每件物品每回合只能执行「使用 / 交易 / 丢弃 / 拾取」其中一项；卡面写明不能交易或丢弃的除外。第三版普通攻击不能偷牌，只有剧本写明才能抢。</p>';
    if (!items.length) {
      html += '<div class="emptyNote">还没有物品。探索房间、抽物品卡，或从地上拾取。</div>';
    } else {
      html += '<div class="itemList">';
      items.forEach((it, idx) => {
        const isOmen = it.tag === 'omen' || it.omen;
        const acted = (st.itemActions || {})[it.name] || '';
        html += '<div class="itemRow"><div><div class="nm">' + esc(it.name) + (isOmen ? ' · 预兆' : '') + '</div>' +
          '<div class="ds">' + esc(it.text || '') + (acted ? ' · 本回合已' + (acted === 'use' ? '使用' : acted === 'trade' ? '交易' : acted === 'drop' ? '丢弃' : acted === 'steal' ? '被偷窃' : '拾取') : '') + '</div></div><div class="ops">';
        if (it.use) {
          html += '<button class="btn ghost" type="button" data-use="' + idx + '"' + (acted ? ' disabled' : '') + '>使用</button>';
        }
        if (!it.noDrop) html += '<button class="btn ghost" type="button" data-drop="' + idx + '"' + (acted ? ' disabled' : '') + '>丢弃</button>';
        const others = playersOf(st).filter((p, i) => i !== mi && !p.dead && p.floor === me.floor && p.x === me.x && p.y === me.y);
        if (!it.noTrade && others.length) {
          html += '<button class="btn ghost" type="button" data-trade="' + idx + '"' + (acted || st.traded ? ' disabled' : '') + '>交易</button>';
        }
        html += '</div></div>';
      });
      html += '</div>';
    }
    const partners = playersOf(st).filter((p, i) => i !== mi && !p.dead && p.floor === me.floor && p.x === me.x && p.y === me.y);
    html += '<div class="actions" style="margin-top:14px">';
    if (partners.length && !st.traded) {
      html += '<button class="btn primary" type="button" id="invTrade">发起交易</button>';
    }
    html += '<button class="btn ghost" type="button" id="invClose">收起</button></div>';
    openModal(html, 'inventory');

    const tradeBtn = $('invTrade');
    if (tradeBtn) tradeBtn.addEventListener('click', () => {
      const go = (p) => openTradeBuilder(st, mi, p);
      if (partners.length === 1) go(partners[0]);
      else chooseTarget('和谁交易？', partners.map((p) => ({ name: p.name, p: p })), (o) => go(o.p));
    });
    $('invClose').addEventListener('click', () => closeModal());
    $('cModalCard').querySelectorAll('[data-use]').forEach((b) => b.addEventListener('click', () => {
      const idx = Number(b.dataset.use);
      const item = me.items[idx];
      if (!item) return;
      if (item.use && item.use.type === 'teleportAny') {
        const rooms = st.rooms.filter((r) => r.kind !== 'start');
        chooseTarget('地图传送到哪个房间？', rooms.map((r) => ({ name: r.name, room: r })), (pick) => {
          window.GameShell.send({ type: 'useItem', index: idx, room: pick.room.name });
          renderInventory(cur, mi);
        });
        return;
      }
      if (item.use && item.use.type === 'fate') {
        const nums = [];
        for (let n = 0; n <= 8; n++) nums.push({ name: '判定结果 ' + n, value: n });
        chooseTarget('天使羽毛：选择一个判定结果', nums, (pick) => {
          window.GameShell.send({ type: 'useItem', index: idx, value: pick.value });
          renderInventory(cur, mi);
        });
        return;
      }
      window.GameShell.send({ type: 'useItem', index: idx });
      renderInventory(cur, mi);
    }));
    $('cModalCard').querySelectorAll('[data-drop]').forEach((b) => b.addEventListener('click', () => {
      window.GameShell.send({ type: 'dropItem', index: Number(b.dataset.drop) });
      renderInventory(cur, mi);
    }));
    $('cModalCard').querySelectorAll('[data-trade]').forEach((b) => b.addEventListener('click', () => {
      const idx = Number(b.dataset.trade);
      const others = playersOf(st).filter((p, i) => i !== mi && !p.dead && p.floor === me.floor && p.x === me.x && p.y === me.y);
      if (others.length === 1) {
        beginTradeOffer(st, me, mi, others[0], idx);
        return;
      }
      chooseTarget('把「' + me.items[idx].name + '」交易给谁？', others, (pick) => {
        beginTradeOffer(st, me, mi, pick, idx);
      });
    }));
  }

  /* ---------------- 玩家信息（公开查看） ---------------- */
  function itemRuleSummary(it) {
    const parts = [];
    if (it.use) {
      const u = it.use;
      if (u.type === 'heal') parts.push('使用：' + traitLabel(u.trait) + ' 回复 ' + (u.amount || 1));
      else if (u.type === 'gain') parts.push('使用：' + traitLabel(u.trait) + ' +' + (u.amount || 1));
      else parts.push('可使用');
    }
    if (it.testTrait) parts.push('判定：' + traitLabel(it.testTrait) + ' +' + (it.testBonus || 1));
    if (it.weapon) parts.push('武器：' + traitLabel(it.weapon) + '攻击' + (it.attackBonus ? ' +' + it.attackBonus : ''));
    if (it.delta) parts.push((it.tag === 'omen' || it.omen ? '预兆影响：' : '属性：') + traitLabel(it.delta.trait) + ' ' + (it.delta.amount > 0 ? '+' : '') + it.delta.amount);
    if (it.noTrade) parts.push('不可交易');
    if (it.noDrop) parts.push('不可丢弃');
    if (it.noSteal) parts.push('不可偷窃');
    return parts.join(' · ');
  }

  function renderPlayerInfo(st, idx) {
    const p = playersOf(st)[idx];
    if (!p) { closeModal(); return; }
    playerModalIndex = idx;
    const mine = myIndex(st) === idx;
    const active = st.phase === 'playing' && st.turn === idx;
    const here = roomAt(st, p);
    const h = st.haunt && st.haunt.active ? st.haunt : null;
    const isTraitor = !!(h && h.traitor === idx);
    const items = p.items || [];
    let badges = '<span class="pBadge">' + (active ? '当前回合' : (mine ? '你' : '玩家 ' + (idx + 1))) + '</span>';
    if (p.dead) badges += '<span class="pBadge dead">已死亡</span>';
    if (h) badges += '<span class="pBadge ' + (isTraitor ? 'traitor' : 'hero') + '">' + (isTraitor ? '叛徒' : '英雄') + '</span>';
    else badges += '<span class="pBadge">闹鬼前 · 阵营未定</span>';

    let html = '<div class="playerInfoHead">' +
      '<span class="playerAvatar" style="background:' + seatColor(idx) + '">' + esc(p.art || '?') + '</span>' +
      '<div class="playerInfoName"><h2>' + esc(p.name) + (mine ? ' <small>你</small>' : '') + '</h2>' +
      '<p>' + esc(p.charName || '未选角色') + (p.role ? ' · ' + esc(p.role) : '') +
      (p.age ? ' · ' + p.age + ' 岁' : '') + '</p></div>' +
      '<button class="btn ghost playerClose" type="button" id="playerClose">关闭</button></div>' +
      '<div class="playerBadges">' + badges + '</div>' +
      '<p class="playerPublicNote">线下桌上公开的信息：角色卡、物品、位置和当前状态。</p>' +
      '<div class="playerMeta">位置：<b>' + esc(C.FLOOR_LABEL[p.floor] || '未知') + ' · ' + esc(here ? here.name : '未知房间') + '</b>' +
      (active ? ' · 本回合移动 ' + st.moves : '') +
      (h ? ' · 剧本：' + esc(h.name) : '') + '</div>';

    html += '<div class="playerSectionTitle">角色卡 · 四项属性</div><div class="playerStats">';
    C.TRAITS.forEach((t) => {
      const v = Number(p.traits && p.traits[t.key]) || 0;
      const min = Number(p.min && p.min[t.key]);
      const max = Number(p.max && p.max[t.key]);
      const start = Number(p.start && p.start[t.key]);
      const width = (Number.isFinite(min) && Number.isFinite(max) && max > min) ? Math.max(0, Math.min(100, ((v - min) / (max - min)) * 100)) : 0;
      html += '<div class="playerTrait' + (Number.isFinite(min) && v <= min ? ' low' : '') + '">' +
        '<div class="ptRow"><span>' + esc(t.label) + '</span><b>' + v + '</b><em>' +
        (Number.isFinite(min) && Number.isFinite(max) ? min + '–' + max : '?–?') +
        (Number.isFinite(start) ? ' · 起始 ' + start : '') + '</em></div>' +
        '<i class="ptBar"><span style="width:' + width + '%"></span></i></div>';
    });
    html += '</div>';

    html += '<div class="playerSectionTitle">物品 ' + items.length + '</div>';
    if (!items.length) {
      html += '<div class="emptyNote">没有物品。桌上的物品卡都是公开的；当前玩家可在自己的物品面板中使用或交易。</div>';
    } else {
      html += '<div class="itemList">';
      items.forEach((it) => {
        const isOmen = it.tag === 'omen' || it.omen;
        const rule = itemRuleSummary(it);
        html += '<div class="itemRow"><div><div class="nm">' + esc(it.name) + (isOmen ? ' · 预兆' : '') + '</div>' +
          '<div class="ds">' + esc(it.text || '') + '</div>' +
          (rule ? '<div class="itemRule">' + esc(rule) + '</div>' : '') + '</div></div>';
      });
      html += '</div>';
    }
    html += '<div class="actions" style="margin-top:14px"><button class="btn ghost" type="button" id="playerCloseBottom">收起</button></div>';
    openModal(html, 'player');
    const close = () => closeModal();
    const a = $('playerClose'); if (a) a.addEventListener('click', close);
    const b = $('playerCloseBottom'); if (b) b.addEventListener('click', close);
  }

  function openPlayerInfo(st, idx) {
    if (!st || !playersOf(st)[idx]) return;
    renderPlayerInfo(st, idx);
  }

  /* ---------------- 卡牌 ---------------- */
  function effectSummary(eff) {
    if (!eff) return '';
    const parts = [];
    if (eff.gain) parts.push(traitLabel(eff.gain.trait) + ' +' + eff.gain.amount);
    if (eff.lose) parts.push(traitLabel(eff.lose.trait) + ' -' + eff.lose.amount);
    if (eff.heal) parts.push(traitLabel(eff.heal.trait) + ' 回复 ' + eff.heal.amount);
    if (eff.damage) {
      const d = eff.damage;
      parts.push((d.dice ? '掷 ' + d.dice + ' 颗伤害骰' : '受到 ' + d.amount + ' 点') + (d.type === 'mental' ? '精神伤害' : '物理伤害'));
    }
    return parts.join('；');
  }

  function renderRollPrompt(st) {
    const pr = st.pendingRoll;
    const box = $('cabinCard');
    const label = traitLabel(pr.trait);
    const canRoll = myTurn(st) && pr.index === myIndex(st);
    const who = (playersOf(st)[pr.index] || {}).name || '玩家';
    const owner = playersOf(st)[pr.index] || {};
    const awaiting = !!pr.await && !!pr.result;
    const diceN = awaiting ? pr.result.faces.length : (Number(pr.dice) > 0 ? Number(pr.dice) : Math.max(1, (Number(owner.traits && owner.traits[pr.trait]) || 0) + (C.helpers.itemTestBonus ? C.helpers.itemTestBonus(st, pr.index, pr.trait) : 0)));
    const faces = awaiting ? pr.result.faces : Array(diceN).fill('?');
    const diceFaces = faces.map((x) => '<i>' + x + '</i>').join('');
    const rerollItems = awaiting && canRoll ? (owner.items || []).map((it, k) => ({ it, k })).filter((x) => x.it.reroll && !(st.itemActions || {})[x.it.name]) : [];
    const winText = effectSummary(pr.win);
    const loseText = effectSummary(pr.lose);
    box.className = 'show' + (pr.kind === 'room' ? ' roomPrompt' : '');
    box.innerHTML = '<div class="rollTop"><span class="rollAvatar" style="background:' + seatColor(pr.index) + '">' + esc(owner.art || '?') + '</span>' +
      '<div><div class="k">' + (pr.kind === 'event' ? '事件判定' : '房间判定') + '</div><div class="rollWho">' + esc(who) + ' · ' + esc(label) + '判定</div></div>' +
      '<div class="rollTarget"><small>难度</small><b>' + pr.diff + '</b></div></div>' +
      '<div class="t">' + esc(pr.card || pr.room || '判定') + '</div>' +
      '<div class="d">' + (pr.text ? esc(pr.text) + '<br>' : '') +
      (awaiting ? '掷出 <b>' + pr.result.total + '</b>，' + (pr.result.ok ? '达到' : '未达到') + '难度 ' + pr.diff + '。' + (canRoll ? '可以重掷或确认。' : '等待 ' + esc(who) + ' 确认。') :
        '掷 ' + diceN + ' 颗骰，总点数 ≥ ' + pr.diff + ' 即成功。' + (canRoll ? '点击下方按钮投掷。' : '等待 ' + esc(who) + ' 投掷。')) + '</div>' +
      (winText || loseText ? '<div class="rollStakes">' + (winText ? '<span class="stake good">成功 · ' + esc(winText) + '</span>' : '') +
        (loseText ? '<span class="stake bad">失败 · ' + esc(loseText) + '</span>' : '') + '</div>' : '') +
      (rolling ? '<div class="rollPrompt"><div class="need">骰子滚动中…</div><div class="rollDice">' + Array(diceN).fill('<i>?</i>').join('') + '</div></div>' :
        '<div class="rollPrompt"><div class="need">' + (awaiting ? '结果 <b>' + pr.result.total + '</b> · 目标 <b>' + pr.diff + '</b>' : '掷 <b>' + esc(label) + '</b> 骰 · 目标 <b>' + pr.diff + '</b>') + '</div><div class="rollDice">' + diceFaces + '</div>' +
        (awaiting ?
          (rerollItems.map((x) => '<button class="btn ghost" type="button" data-reroll="' + x.k + '">重掷 · ' + esc(x.it.name) + '</button>').join('') +
           '<button class="btn primary" type="button" id="confirmRollBtn"' + (canRoll ? '' : ' disabled') + '>确认结果</button>')
          : '<button class="btn primary" type="button" id="rollPendingBtn"' + (canRoll ? '' : ' disabled') + '>掷骰</button>') + '</div>');
    clearTimeout(cardTimer);
    if (canRoll && awaiting) {
      const btn = $('confirmRollBtn');
      if (btn) btn.addEventListener('click', () => window.GameShell.send({ type: 'confirmPendingRoll' }));
      box.querySelectorAll('[data-reroll]').forEach((b) => b.addEventListener('click', () => {
        window.GameShell.send({ type: 'rerollPending', index: Number(b.dataset.reroll) });
      }));
    }
    if (canRoll && !rolling && !awaiting) {
      const btn = $('rollPendingBtn');
      if (btn) btn.addEventListener('click', () => {
        if (rolling) return;
        rolling = true;
        haptic(12);
        renderRollPrompt(cur);
        clearInterval(rollTickTimer);
        rollTickTimer = setInterval(() => {
          const dice = box.querySelectorAll('.rollDice i');
          dice.forEach((d) => { d.textContent = String([0, 1, 2][Math.floor(Math.random() * 3)]); });
        }, 85);
        rollFxTimer = setTimeout(() => {
          clearInterval(rollTickTimer);
          rolling = false;
          window.GameShell.send({ type: 'rollPending' });
          haptic([18, 30, 18]);
        }, 680);
      });
    }
  }

  function renderCard(st) {
    const box = $('cabinCard');
    if (st.pendingRoll) { renderRollPrompt(st); return; }
    if (!st.lastCard) { box.className = ''; box.innerHTML = ''; lastCardKey = ''; cardDismissedKey = ''; return; }
    const key = st.lastCard.kind + '|' + st.lastCard.title + '|' + (st.lastCard.text || '') + '|' + (st.lastRoll ? st.lastRoll.total + st.lastRoll.ok : '') + '|' + (st.lastDamageRoll ? st.lastDamageRoll.total : '');
    if (key === lastCardKey || key === cardDismissedKey) return;
    lastCardKey = key;
    const c = st.lastCard;
    const kindName = c.kind === 'omen' ? '预兆' : c.kind === 'item' ? '物品' : c.kind === 'haunt' ? '闹鬼' : c.kind === 'room' ? '房间' : c.kind === 'monster' ? '怪物' : '事件';
    const drawName = c.kind === 'room' ? '房间板块' : kindName + '卡';
    box.className = 'show flipIn' + (c.tone === 'bad' ? ' bad' : '');
    box.innerHTML = '<div class="cardReveal" aria-hidden="true"><div class="crBack"><span class="crKicker">翻卡</span><b class="crMark">?</b><span class="crName">' + esc(drawName) + '</span></div></div>' +
      '<div class="drawTag">翻开一张' + esc(drawName) + '</div>' +
      '<div class="k">' + kindName + '</div><div class="t">' + esc(c.title) + '</div><div class="d">' + esc(c.text) + '</div>';
    haptic(12);
    if (st.lastRoll) {
      const result = document.createElement('div');
      result.className = 'rollResult';
      const rr = st.lastRoll;
      result.textContent = (rr.diff != null ? (rr.ok ? '判定成功' : '判定失败') + ' · ' : '掷骰结果 · ') +
        '总点数 ' + rr.total + (rr.diff != null ? ' / 难度 ' + rr.diff : '');
      box.appendChild(result);
      if (rr.diff != null) {
        const applied = rr.ok ? c.win : c.lose;
        const appliedText = effectSummary(applied);
        if (appliedText) {
          const ae = document.createElement('div');
          ae.className = 'rollApplied ' + (rr.ok ? 'good' : 'bad');
          ae.textContent = '结果 · ' + appliedText;
          box.appendChild(ae);
        }
      }
      const row = document.createElement('div');
      row.className = 'cabinDice';
      (rr.faces || []).forEach((f, idx) => {
        const d = document.createElement('div');
        d.className = 'cabinDie in';
        d.style.animationDelay = (idx * 0.055) + 's';
        d.textContent = f;
        row.appendChild(d);
      });
      const sum = document.createElement('div');
      sum.className = 'cabinDie in';
      sum.style.width = 'auto';
      sum.style.padding = '0 8px';
      sum.style.animationDelay = ((rr.faces || []).length * 0.055) + 's';
      sum.textContent = '= ' + rr.total;
      row.appendChild(sum);
      box.appendChild(row);
      const dr = st.lastDamageRoll;
      if (dr && dr.label !== rr.label) {
        const dh = document.createElement('div');
        dh.className = 'rollResult';
        dh.textContent = dr.label + ' · ' + dr.total + ' 点';
        box.appendChild(dh);
        const drRow = document.createElement('div');
        drRow.className = 'cabinDice';
        (dr.faces || []).forEach((f, idx) => {
          const d = document.createElement('div');
          d.className = 'cabinDie in';
          d.style.animationDelay = (idx * 0.055) + 's';
          d.textContent = f;
          drRow.appendChild(d);
        });
        box.appendChild(drRow);
      }
    }
    const close = document.createElement('button');
    close.className = 'btn ghost cardClose';
    close.type = 'button';
    close.textContent = '收起这张卡';
    close.addEventListener('click', () => {
      cardDismissedKey = key;
      box.className = '';
      box.innerHTML = '';
    });
    box.appendChild(close);
  }

  /* ---------------- 交易确认 ---------------- */
  function renderTradePrompt(st, me, actions) {
    const o = st.tradeOffer;
    if (!o) return false;
    const from = playersOf(st).find((p) => p.id === o.from);
    const to = playersOf(st).find((p) => p.id === o.to);
    const local = window.GameShell.isLocal && window.GameShell.isLocal();
    const isTo = me && me.id === o.to;
    actions.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'tradePrompt';
    const hasRequest = (o.wantNames && o.wantNames.length) || (o.requestIndex !== null && o.requestIndex !== undefined && o.requestIndex >= 0 && o.requestName);
    const give = (o.giveNames && o.giveNames.length ? o.giveNames : [o.itemName]).map((n) => '「<b>' + esc(n) + '</b>」').join('、');
    const want = (o.wantNames && o.wantNames.length ? o.wantNames : (o.requestName ? [o.requestName] : [])).map((n) => '「<b>' + esc(n) + '</b>」').join('、');
    const swap = hasRequest ? '，并要你的 ' + want : '';
    const title = isTo ? (hasRequest
      ? '<b>' + esc(from ? from.name : '对方') + '</b> 想用 ' + give + ' 换你的 ' + want + '。'
      : '<b>' + esc(from ? from.name : '对方') + '</b> 想把 ' + give + ' 交易给你。')
      : local ? '把设备交给 <b>' + esc(to ? to.name : '接收方') + '</b>，由对方决定是否接受 ' + give + swap + '。'
      : '已向 <b>' + esc(to ? to.name : '对方') + '</b> 发起交易：' + give + swap + '，等待对方回应。';
    box.innerHTML = title + '<div class="tradeBtns"></div>';
    const btns = box.querySelector('.tradeBtns');
    const add = (label, cls, fn, disabled) => {
      const b = document.createElement('button');
      b.className = 'btn ' + (cls || 'ghost');
      b.type = 'button';
      b.innerHTML = label;
      if (disabled) b.disabled = true;
      b.addEventListener('click', fn);
      btns.appendChild(b);
    };
    const sendAs = (type, pid) => {
      window.GameShell.send({ type: type }, pid);
      haptic(8);
    };
    if (isTo || local) {
      add('接受', 'primary', () => sendAs('tradeAccept', o.to), false);
      add('拒绝', 'ghost', () => sendAs('tradeReject', o.to), false);
    }
    if (me && me.id === o.from) {
      add('撤回', 'ghost', () => sendAs('tradeCancel', o.from), false);
    }
    actions.appendChild(box);
    return true;
  }

  /* ---------------- 怪物阶段 ---------------- */
  function renderMonsterTurn(st) {
    const mt = st.monsterTurn;
    if (!mt) return;
    const actor = playersOf(st).find((p) => p.id === mt.actor);
    const heroes = playersOf(st).filter((p) => !p.dead && p.side === 'hero');
    let html = '<h2>怪物阶段</h2><p>叛徒 <b>' + esc(actor ? actor.name : '?') + '</b> 指挥怪物行动，剩余 ' + mt.queue.length + ' 只。</p>' +
      '<div class="infoStory">每只怪物可以追向一名英雄：移动最多等于速度，抵达后攻击；也可以跳过。线下怪物卡和目标由叛徒决定。</div>';
    mt.queue.forEach((id) => {
      const m = monstersOf(st).find((x) => x.id === id);
      if (!m) return;
      const room = C.helpers.roomAt(st, m.floor, m.x, m.y);
      html += '<div class="monsterRow"><div class="mh"><b>' + esc(m.name) + '</b><span>' +
        esc(C.FLOOR_LABEL[m.floor] || '') + ' · ' + esc(room ? room.name : '?') +
        ' · 速度 ' + (m.speed || '?') + ' · ' + esc(traitLabel(m.attack || 'might')) + ' ' + (m[m.attack || 'might'] || '?') +
        (m.stunned ? ' · 僵直' : '') + '</span></div><div class="targets">';
      if (!heroes.length) html += '<span class="sub">没有存活英雄。</span>';
      heroes.forEach((p) => {
        const sameFloor = p.floor === m.floor;
        html += '<button class="btn ghost" type="button" data-monster="' + esc(m.id) + '" data-target="' + esc(p.id) + '"' +
          (sameFloor ? '' : ' disabled') + '>追向 ' + esc(p.name) + (sameFloor ? '' : '（不同楼层）') + '</button>';
      });
      html += '<button class="btn ghost" type="button" data-monster-skip="' + esc(m.id) + '">跳过这只</button></div></div>';
    });
    html += '<div class="actions" style="margin-top:14px"><button class="btn primary" type="button" id="monsterDone">结束怪物阶段</button></div>';
    openModal(html, 'monster');
    $('cModalCard').querySelectorAll('[data-target]').forEach((b) => {
      b.addEventListener('click', () => {
        if (b.disabled) return;
        window.GameShell.send({ type: 'monsterMove', monsterId: b.dataset.monster, target: b.dataset.target });
        haptic(10);
      });
    });
    $('cModalCard').querySelectorAll('[data-monster-skip]').forEach((b) => {
      b.addEventListener('click', () => {
        window.GameShell.send({ type: 'monsterSkip', monsterId: b.dataset.monsterSkip });
        haptic(5);
      });
    });
    const done = $('monsterDone');
    if (done) done.addEventListener('click', () => {
      window.GameShell.send({ type: 'monsterEnd' });
      haptic(8);
    });
  }

  /* ---------------- 底栏 ---------------- */
  function renderDock(st) {
    const info = $('dockInfo');
    const actions = $('dockActions');
    if (!info || !actions) return;
    /* 等待开局：底栏由 GameShell 统一渲染人数提示和「开始游戏」，这里不要覆盖 */
    if (!st || st.phase === 'lobby') return;
    const mi = myIndex(st);
    const me = playersOf(st)[mi];
    info.innerHTML = '';
    actions.innerHTML = '';
    if (!me) return;
    if (!me.traits) {
      info.innerHTML = '<div class="ttl">等待开始</div><div class="sub">人齐后由房主点「开始游戏」，届时自动分配角色。</div>';
      return;
    }

    if (st.phase === 'select') {
      const who = playersOf(st)[st.turn];
      info.innerHTML = '<div class="ttl">选角色阶段</div><div class="sub">轮到 ' + esc(who.name) + ' · 还剩 ' + playersOf(st).filter((p) => !p.char).length + ' 人</div>';
      const hint = document.createElement('span');
      hint.className = 'btn ghost';
      hint.style.cssText = 'display:grid;place-items:center';
      hint.textContent = myTurn(st) ? '点角色卡选人' : '等待 ' + who.name;
      actions.appendChild(hint);
      return;
    }

    const here = roomAt(st, me);
    const head = document.createElement('div');
    const statusNote = st.moveLocked ? ' · 本回合已翻房' : (st.attacked ? ' · 本回合已攻击' : '');
    head.innerHTML = '<div class="ttl">' + esc(me.name) + ' · ' + esc(me.charName) + '（' + esc(me.role) + '）</div>' +
      '<div class="traitRow"></div>' +
      '<div class="sub">' + (st.haunt && st.haunt.active ? '闹鬼 · 预兆 ' + st.omens : '探索 · 预兆 ' + st.omens) +
      ' · 移动 ' + st.moves + ' · 物品 ' + (me.items || []).filter((it) => it.tag !== 'omen' && it.tag !== '预兆').length +
      (here ? ' · ' + esc(here.name) : '') + statusNote + '</div>' +
      '<div class="moveMeter" aria-label="剩余移动 ' + st.moves + ' 步"></div>';
    info.appendChild(head);

    const meter = head.querySelector('.moveMeter');
    const speedCap = Math.max(1, Number(me.traits.speed) || 1);
    for (let k = 0; k < speedCap; k++) {
      const pip = document.createElement('i');
      if (k >= st.moves) pip.className = 'off';
      meter.appendChild(pip);
    }
    const meterLabel = document.createElement('span');
    meterLabel.textContent = st.moves + ' 步';
    meter.appendChild(meterLabel);

    const row = head.querySelector('.traitRow');
    C.TRAITS.forEach((t) => {
      const v = me.traits[t.key] || 0;
      const chip = document.createElement('span');
      chip.className = 'traitChip' + (v <= me.min[t.key] ? ' low' : '');
      chip.innerHTML = t.label + ' <b>' + v + '</b><em>' + me.min[t.key] + '–' + me.max[t.key] + '</em>';
      row.appendChild(chip);
    });

    const isMine = myTurn(st);
    const addBtn = (label, cls, fn, disabled, title) => {
      const b = document.createElement('button');
      b.className = 'btn ' + (cls || 'ghost');
      b.type = 'button';
      b.innerHTML = label;
      if (title) b.title = title;
      if (disabled) b.disabled = true;
      b.addEventListener('click', fn);
      actions.appendChild(b);
      return b;
    };

    if (me.dead) {
      actions.innerHTML = '';
      const note = document.createElement('span');
      note.className = 'sub';
      note.style.cssText = 'font-size:12px;color:#e6c8a8;align-self:center;line-height:1.5';
      note.textContent = '你已经倒下，物品与预兆仍放在你的板旁，其他人在这个房间可以搜刮。点结束回合跳过。';
      actions.appendChild(note);
      addBtn('结束回合', 'primary', () => window.GameShell.send({ type: 'end' }));
      return;
    }
    const corpse = playersOf(st).find((p) => p.dead && p !== me && p.floor === me.floor && p.x === me.x && p.y === me.y && (p.items || []).length);
    if (corpse && !st.looted && isMine) {
      addBtn('搜刮 ' + esc(corpse.name) + ' 的牌', 'ghost', () => {
        const menu = (corpse.items || []).map((it, k) => ({ name: it.name, k }));
        chooseTarget('从尸体上拿一张', menu, (o) => window.GameShell.send({ type: 'lootCorpse', target: playersOf(st).indexOf(corpse), index: o.k }));
      });
    }
    if (st.tradeOffer) {
      renderTradePrompt(st, me, actions);
      return;
    }
    if (st.monsterTurn) {
      actions.innerHTML = '';
      const mt = st.monsterTurn;
      const actor = playersOf(st).find((p) => p.id === mt.actor);
      if (!isMine) {
        const span = document.createElement('span');
        span.className = 'btn ghost';
        span.style.cssText = 'display:grid;place-items:center';
        span.textContent = '怪物阶段 · ' + (actor ? actor.name : '叛徒') + ' 指挥中';
        actions.appendChild(span);
        return;
      }
      if (st.pendingDamage) return;
      const lead = document.createElement('span');
      lead.className = 'sub';
      lead.style.cssText = 'font-size:11px;color:#c9b797;align-self:center';
      lead.textContent = '怪物阶段 · ' + mt.queue.length + ' 只待行动';
      actions.appendChild(lead);
      addBtn('指挥怪物', 'primary', () => renderMonsterTurn(st));
      addBtn('跳过全部', 'ghost', () => window.GameShell.send({ type: 'monsterEnd' }));
      return;
    }

    if (st.phase === 'ended') return;

    if (!isMine) {
      const span = document.createElement('span');
      span.className = 'btn ghost';
      span.style.cssText = 'display:grid;place-items:center';
      span.textContent = '等待 ' + playersOf(st)[st.turn].name + ' 行动';
      actions.appendChild(span);
      return;
    }

    if (st.pendingDamage) return;
    if (st.pendingRoll || st.pendingTile) return;

    // 当前房间动作
    addBtn('物品 ' + ((me.items || []).length), 'ghost', () => renderInventory(st, mi));
    if (st.haunt && st.haunt.active) {
      addBtn('剧本目标', 'ghost', () => openScenarioCard(st));
    }
    if (here && (here.kind === 'stairs' || here.kind === 'grandStair' || here.kind === 'landing' || here.special === 'basementStairs' || here.name === '门厅')) {
      addBtn('走楼梯', 'ghost', () => window.GameShell.send({ type: 'stair' }), st.moves <= 0 || st.moveLocked || !!st.pendingTile);
    }
    if (st.itemPiles && st.itemPiles[me.floor + '|' + me.x + '|' + me.y] && st.itemPiles[me.floor + '|' + me.x + '|' + me.y].length) {
      addBtn('拾取物品', 'ghost', () => window.GameShell.send({ type: 'pickup' }), !!st.picked);
    }

    if (st.haunt && st.haunt.active && me.side !== 'traitor') {
      const goal = st.haunt.heroGoal;
      if ((goal.type === 'ritual' || goal.type === 'wolves') && (!goal.room || (here && here.name === goal.room))) {
        addBtn('执行目标 · ' + traitLabel(goal.trait || 'known'), 'primary', () => window.GameShell.send({ type: 'check' }), !!st.taskRolled);
      }
    }

    if (st.haunt && st.haunt.active) {
      const foes = [];
      st.players.forEach((p, i) => {
        if (i !== mi && !p.dead && p.floor === me.floor && p.x === me.x && p.y === me.y &&
            (p.side !== me.side || (st.haunt && st.haunt.pvp))) {
          foes.push({ id: p.id, name: p.name, items: (p.items || []).filter((it) => !it.noSteal && !it.noTrade).length });
        }
      });
      (st.monsters || []).forEach((m) => {
        if (m.floor === me.floor && m.x === me.x && m.y === me.y) foes.push({ id: m.id, name: m.name + (m.stunned ? '（僵直）' : '') });
      });
      if (foes.length) {
        addBtn('攻击', 'primary', () => {
          const go = (f) => sendAttackWithWeapon(st, mi, f.id, 'might', false);
          if (foes.length === 1) go(foes[0]);
          else chooseTarget('攻击谁？', foes, go);
        }, !!st.attacked);
      }
      const ranged = [];
      if (C.helpers.hasDistanceWeapon(st, mi, 'might')) {
        st.players.forEach((p, i) => {
          if (i === mi || p.dead || p.side === me.side || p.floor !== me.floor) return;
          if (p.x === me.x && p.y === me.y) return;
          if (C.helpers.inLineOfSight(st, me, p)) ranged.push({ id: p.id, name: p.name });
        });
        (st.monsters || []).forEach((m) => {
          if (m.floor !== me.floor || (m.x === me.x && m.y === me.y)) return;
          if (C.helpers.inLineOfSight(st, me, m)) ranged.push({ id: m.id, name: m.name + (m.stunned ? '（僵直）' : '') });
        });
      }
      if (ranged.length) {
        addBtn('远程攻击', 'ghost', () => {
          chooseTarget('远程攻击谁？', ranged, (f) => sendAttackWithWeapon(st, mi, f.id, 'might', true));
        }, !!st.attacked);
      }
    }

    if (st.haunt && st.haunt.active && isMine) {
      const h = st.haunt;
      const gameUsed = h.gameUsed || {};
      const turnUsed = h.turnUsed || h.used || {};
      (h.actions || []).forEach((a) => {
        if (a.side && a.side !== me.side) return;
        const used = a.once === 'game' ? !!gameUsed[me.id + '|' + a.key] : !!turnUsed[me.id + '|' + a.key];
        const okWhere = !a.where || a.where === 'any' ||
          (a.where === 'room' && here && here.name === a.room) ||
          (a.where === 'symbol' && here && here.symbol === (a.symbol || 'event')) ||
          (a.where === 'floors' && (!a.floors || a.floors.indexOf(me.floor) >= 0));
        addBtn('⚄ ' + esc(a.name), 'primary',
          () => window.GameShell.send({ type: 'hauntAction', key: a.key }),
          used || !okWhere,
          used ? '本回合已经做过' : (!okWhere ? (a.where === 'room' ? '必须在「' + a.room + '」里做' : '房间条件不满足') : '按属性掷骰后结算'));
      });
      if (h.flipRooms && me.side === 'traitor') {
        addBtn('吞噬当前房间', 'ghost', () => window.GameShell.send({ type: 'flipTile' }),
          !!(here && here.flipped), here && here.flipped ? '这个房间已经被吞噬' : '翻面：四边都算门，失去符号与文字');
      }
    }

    addBtn('结束回合', 'ghost', () => window.GameShell.send({ type: 'end' }), !!st.pendingTile || !!st.pendingRoll, st.pendingRoll ? '先掷骰' : st.pendingTile ? '先放置房间' : '');

    if (st.moves <= 0 && !st.moveLocked) {
      const tip = document.createElement('span');
      tip.className = 'sub';
      tip.style.cssText = 'font-size:11px;color:#c9b797;align-self:center';
      tip.textContent = '移动点已用完';
      actions.appendChild(tip);
    }
  }

  /* ---------------- 棋盘点击 ---------------- */
  /* 点击相邻的已有房间直接走进去；非相邻/非自己回合才弹房间详情 */
  function tryWalkToRoom(st, room) {
    if (!st || st.phase !== 'playing' || !myTurn(st)) return false;
    if (st.pendingTile || st.pendingDamage || st.pendingRoll || st.moveLocked) return false;
    if (st.moves <= 0) return false;
    const me = playersOf(st)[st.turn];
    if (!me || me.dead) return false;
    const here = C.helpers.roomAt(st, me.floor, me.x, me.y);
    if (here && here.link === room.name) {
      return !!window.GameShell.send({ type: 'moveRoom', room: room.name });
    }
    if (me.floor !== room.floor) return false;
    const dx = room.x - me.x;
    const dy = room.y - me.y;
    if (Math.abs(dx) + Math.abs(dy) !== 1) return false;
    const dir = dx === 1 ? 'E' : dx === -1 ? 'W' : dy === 1 ? 'S' : 'N';
    if (me.wallMove && here && !(here.doors || '').includes(dir)) {
      return !!window.GameShell.send({ type: 'wallMove', x: room.x, y: room.y });
    }
    return !!window.GameShell.send({ type: 'move', dir: dir });
  }

  function onTap(ev) {
    const st = cur;
    if (!st || st.phase !== 'playing') return;
    if (ev.target && ev.target.closest && ev.target.closest('[data-room]')) return;
    if (!myTurn(st)) { window.GameShell.toast('还没轮到你', true); return; }
    if (st.pendingTile || st.pendingDamage || st.pendingRoll) return;
    if (st.moveLocked) { window.GameShell.toast('本回合已经翻过房间', true); return; }
    if (st.moves <= 0) { window.GameShell.toast('移动点用完了', true); return; }
    const me = playersOf(st)[st.turn];
    if (me.floor !== viewFloor && !isMerged(st)) { window.GameShell.toast('先切到 ' + C.FLOOR_LABEL[me.floor], true); return; }

    const rect = svg.getBoundingClientRect();
    const merged = isMerged(st);
    const bands = merged ? C.FLOORS.slice().reverse() : [viewFloor];
    const GAP = merged ? 64 : 0;
    const totalH = bands.length * H * CELL + (bands.length - 1) * GAP;
    const vx = (ev.clientX - rect.left) / rect.width * (W * CELL);
    let vy = (ev.clientY - rect.top) / rect.height * totalH;
    let floor = viewFloor;
    if (merged) {
      const stride = H * CELL + GAP;
      const k = Math.max(0, Math.min(bands.length - 1, Math.floor(vy / stride)));
      floor = bands[k];
      vy -= k * stride;
    }
    if (floor !== me.floor) { window.GameShell.toast('只能在' + C.FLOOR_LABEL[me.floor] + '上移动', true); return; }
    const tx = Math.floor(vx / CELL), ty = Math.floor(vy / CELL);
    const dx = tx - me.x, dy = ty - me.y;
    if (Math.abs(dx) + Math.abs(dy) !== 1) { window.GameShell.toast('只能走到上下左右相邻格', true); return; }
    const dir = dx === 1 ? 'E' : dx === -1 ? 'W' : dy === 1 ? 'S' : 'N';
    const sent = window.GameShell.send({ type: 'move', dir: dir });
    if (sent) {
      haptic(8);
      board.classList.remove('punch');
      void board.offsetWidth;
      board.classList.add('punch');
    }
  }

  /* ---------------- 总渲染 ---------------- */
  function render(st) {
    cur = st;
    if (!st) return;
    narrow = window.innerWidth <= 720;
    const selecting = st.phase === 'select';
    const hasBoard = Array.isArray(st.rooms) && st.rooms.length > 0;
    $('floorTabs').style.display = (selecting || !hasBoard) ? 'none' : '';
    renderPick(st);
    if (!selecting) {
      const me = playersOf(st)[myIndex(st)];
      if (me && !me.dead && me.floor !== viewFloor && st.phase === 'playing') viewFloor = me.floor;
    }
    if (hasBoard) {
      renderFloorTabs(st);
      renderBoard(st);
    } else if (svg) {
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      lastRoomKeys = null;
    }
    renderScenario(st);
    renderSituation(st);
    announceSituation(st);
    renderDock(st);
    renderCard(st);
    if (st.pendingTile) renderTileModal(st);
    else if (st.pendingDamage) renderDamageModal(st);
    else if (st.pendingRoll && modalMode) closeModal();
    else if (modalMode === 'tile' || modalMode === 'damage') closeModal();
    else if (st.monsterTurn && st.phase === 'playing' && myTurn(st) && (modalMode === '' || modalMode === 'monster')) renderMonsterTurn(st);
    else if (modalMode === 'monster') closeModal();
    else if (modalMode === 'player' && playerModalIndex >= 0) renderPlayerInfo(st, playerModalIndex);
  }

  /* ---------------- 启动 ---------------- */
  buildBoard();
  $('btnInfo').addEventListener('click', () => { if (cur) openInfo(cur); });
  $('cModal').addEventListener('click', (e) => {
    if (e.target === $('cModal')) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalMode) closeModal();
  });

  window.GameShell.boot({
    game: 'cabin',
    title: '林中小屋',
    blurb: '官方第三版（3E）核心机制：探索 46 间房、抽事件/物品/预兆；预兆数就是闹鬼骰数，总点数 ≥5 触发，最后一张预兆抽出即自动闹鬼；按剧本卡 + 预兆查 50 个剧本，叛徒与英雄按各自目标对抗。',
    rules: [
      { h: '探索', items: [
        '所有探险者从<b>入口大厅</b>开始。每回合移动点等于当前<b>速度</b>，不掷速度骰。',
        '每移动一步消耗 1 点。进入未探索的门时停下，从房间牌堆顶抽牌，选择合法方向放好并接门。',
        '进入新房间后按符号抽 <b>事件 / 物品 / 预兆</b>，抽卡即结束本回合移动。楼梯可上下楼。'
      ] },
      { h: '属性与伤害', items: [
        '四项属性：<b>速度、力量</b>（物理）与<b>知识、神智</b>（精神），各有最低、起始、最高轨道。',
        '闹鬼前属性不会低于最低值、不会死亡；闹鬼后降到骷髅线即死亡。',
        '受到物理伤害时在力量/速度间分配，精神伤害在知识/神智间分配；护甲先减物理伤害。'
      ] },
      { h: '闹鬼', items: [
        '每抽到一张预兆，回合结束时按<b>全场预兆数</b>掷骰（几张预兆就掷几颗）；总点数 <b>≥5</b> 时闹鬼。',
        '预兆牌堆的最后一张被抽出时，不再掷骰，回合结束直接闹鬼。',
        '用<b>触发房间 + 预兆</b>查 ' + C.SCENARIOS.length + ' 个剧本之一，剧本决定叛徒，叛徒不一定是抽预兆的人。',
        '闹鬼后同一房间的敌对角色移动额外消耗 1 点；每回合可攻击一次，双方掷同一属性，差值造成伤害。'
      ] },
      { h: '物品与交易', items: [
        '物品卡在桌上公开；每件物品每回合只能执行<b>使用 / 交易 / 丢弃 / 拾取</b>其中一项。第三版普通攻击不能偷牌。',
        '判定或攻击中用到物品，也会把该物品标记为本回合已使用，不能再用它交易或丢弃。',
        '交易必须先向同房间玩家发起请求，<b>由接收方确认</b>后才转移。一次可以交换任意多张，也可以纯赠送；对方拒绝或发起方撤回则双方物品都不动。',
        '角色死亡时，棋子留在死亡房间，物品与预兆仍放在人物板旁；其他玩家进入同一房间后每回合可以从尸体上拿一张。',
        '丢在地上的物品形成公开物品堆，同房间玩家可逐件拾取，也可以一次拿全部；地上物品不会消失。',
        '第三版删除了普通偷窃：只有闹鬼剧本明确写出「可以抢牌」时，才按剧本行动处理。'
      ] },
      { h: '怪物与剧本', items: [
        '怪物默认不能被杀死；英雄击中怪物使其僵直并跳过下一个怪物阶段。',
        '叛徒结束回合后进入<b>怪物阶段</b>：叛徒逐只指定怪物追向哪位英雄（最多移动速度格，抵达后攻击）、跳过这只或直接结束阶段。',
        '怪物攻击由叛徒决定目标，受害者按物理/精神伤害规则分配；叛徒不能替英雄分配伤害。',
        '英雄按剧本执行仪式、逃跑、击退狼群或撑过轮数；叛徒完成反制目标。'
      ] }
    ],
    min: 3,
    max: 6,
    engine: window.CabinEngine,
    seatColor: (p, i) => SEAT[i % SEAT.length],
    seatTag: (p) => (cur && cur.haunt && cur.haunt.active && !cur.haunt.hidden && cur.players.indexOf(p) === cur.haunt.traitor ? '叛徒' : p.charName),
    onSeatClick: (p, i, st) => openPlayerInfo(st, i),
    turnPill: (st) => {
      if (!st) return '等待开始';
      if (st.phase === 'lobby') return '等待开始';
      if (st.phase === 'select') return '选角色 · ' + (playersOf(st)[st.turn] ? playersOf(st)[st.turn].name : '');
      if (st.phase === 'ended') return '已结束';
      const p = playersOf(st)[st.turn];
      if (st.pendingRoll) return '等待掷骰 · ' + (p ? p.name : '');
      return (st.haunt && st.haunt.active ? '闹鬼 · ' : '探索 · ') + (p ? p.name : '') + ' · 移动 ' + st.moves;
    },
    winnerTitle: (st) => (st.winner ? (st.winner.side === 'traitor' ? '叛徒获胜' : '英雄获胜') : '对局结束'),
    winnerSub: (st) => (st.winner ? st.winner.text : ''),
    onState: (st) => render(st),
    onMount: () => { viewFloor = 'ground'; }
  });

})();
</script>
</body>
</html>
