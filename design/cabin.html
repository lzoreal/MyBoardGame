<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c2119">
<title>林中小屋 · 萌趣街区</title>
<link rel="stylesheet" href="games/games.css?v=5">
<style>
  :root {
    --c-ink: #efe3cb;
    --c-muted: #b9a98b;
    --c-wine: #7b2e3b;
    --c-gold: #d8a94f;
    --c-paper: #f3e7d0;
    --c-dark: #241a14;
  }
  body.cabinBody { background: radial-gradient(1200px 700px at 50% -10%, #4a3424 0%, #1d1510 60%, #120d0a 100%); color: var(--c-ink); }
  .topbar .pill { background: rgba(243,231,208,.14); color: var(--c-ink); border-color: rgba(243,231,208,.28); }
  #roomPill, #turnPill { background: #f3e7d0 !important; color: #2a1e14 !important; font-weight: 800; }
  .topbar .pill.round { background: #f3e7d0; color: #2a1e14; }
  .topbar .icon-btn { background: #f3e7d0; color: #2a1e14; border: 1px solid #d8c3a1; }
  .cabinBoard { aspect-ratio: 9 / 7; width: min(100%, calc((100vh - 300px) * 9 / 7)); }
  .cabinBoard svg { filter: drop-shadow(0 18px 32px rgba(0,0,0,.55)); }
  .cabinSeats .seat { background: rgba(243,231,208,.94); border-color: #f8eeda; }
  .cabinSeats .seat .tag { background: #4b6a52; }
  .cabinSeats .seat.active { background: #f6dcaa; border-color: #d8a94f; box-shadow: 0 3px 0 #a2762e; }
  .cabinSeats .seat.seatClickable { cursor: pointer; }
  .cabinSeats .seat.seatClickable:active { transform: translateY(1px) scale(.99); }
  .cabinSeats .seat.seatClickable:focus-visible { outline: 3px solid #ffd68a; outline-offset: 3px; }
  .cabinSeats .seatClickable .openHint { color: #9b6a2f; font-size: 14px; font-weight: 900; line-height: 1; }
  .playerInfoHead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .playerAvatar { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 27px; font-weight: 900; box-shadow: 0 0 0 3px #fff8e9, 0 0 0 5px #d8c3a1; flex: 0 0 auto; }
  .playerInfoName { min-width: 0; }
  .playerInfoName h2 { margin: 0; font-size: 21px; }
  .playerInfoName h2 small { font-size: 11px; color: #8d7457; font-weight: 700; }
  .playerInfoName p { margin: 3px 0 0; font-size: 12px; }
  .playerClose { margin-left: auto; min-height: 38px; padding: 0 12px; }
  .playerBadges { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 8px; }
  .pBadge { padding: 3px 9px; border-radius: 999px; background: #e8d7bd; color: #5b432e; font-size: 11px; font-weight: 800; }
  .pBadge.dead { background: #ead0cb; color: #91382f; }
  .pBadge.traitor { background: #5a2630; color: #ffe0c2; }
  .pBadge.hero { background: #dce7cf; color: #46602f; }
  .playerPublicNote { margin: 0 0 7px !important; color: #8a7359 !important; font-size: 11px !important; }
  .playerMeta { padding: 9px 11px; border-radius: 12px; background: #fffaf0; border: 1px solid #dfcbaa; font-size: 12px; color: #5c4631; }
  .playerSectionTitle { margin: 15px 0 7px; font-size: 14px; font-weight: 900; color: #4a3424; }
  .playerStats { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .playerTrait { padding: 8px 10px; border-radius: 12px; background: #fffaf0; border: 1px solid #dfcbaa; }
  .playerTrait .ptRow { display: flex; align-items: baseline; gap: 5px; }
  .playerTrait .ptRow span { font-size: 12px; color: #756046; }
  .playerTrait .ptRow b { font-size: 21px; color: #7b2e3b; line-height: 1; }
  .playerTrait .ptRow em { margin-left: auto; font-style: normal; font-size: 10px; color: #9b8768; white-space: nowrap; }
  .playerTrait .ptBar { display: block; height: 5px; margin-top: 6px; border-radius: 999px; background: #e8d7bd; overflow: hidden; }
  .playerTrait .ptBar span { display: block; height: 100%; border-radius: inherit; background: #c68b2c; }
  .playerTrait.low .ptRow b { color: #a33a2c; }
  .playerTrait.low .ptBar span { background: #b65545; }
  .itemRule { margin-top: 3px; font-size: 11px; color: #2f6fa3; font-weight: 700; }
  .floorTabs { justify-content: center; }
  .floorTab { background: #3a2c21; color: #f3e7d0; border: 2px solid #6b4e32; min-height: 40px; }
  .floorTab[aria-pressed="true"] { background: var(--c-paper); color: #3a2a1c; border-color: var(--c-paper); }
  .scenarioBar { background: #4b2930; color: #fbe9d7; border-color: #9b615f; }
  .scenarioBar b { color: #ffd68a; }
  .cabinDock .dockInfo { background: rgba(243,231,208,.96); color: #2f241a; border-color: #f6ead4; }
  .cabinDock .dockInfo .sub { color: #6d5b47; }
  .cabinDock .dockActions { flex-wrap: wrap; }
  #cabinCard {
    background: #2b2018;
    color: #f4e7d1;
    box-shadow: 0 18px 40px rgba(0,0,0,.5), inset 0 0 0 2px #6b4e32;
  }
  #cabinCard .k { color: #d8a94f; }
  #cabinCard .t { color: #fff4dd; }
  #cabinCard .d { color: #e8d6ba; }
  #cabinCard.bad { box-shadow: 0 18px 40px rgba(90,30,40,.6), inset 0 0 0 2px #b56c72; }
  #cabinCard .cabinDie { background: #f7ead2; color: #3a2819; box-shadow: inset 0 0 0 1.5px #a98a63; }
  #cabinCard .rollResult { margin-top: 8px; font-size: 12px; font-weight: 800; color: #ffd68a; }
  #cabinCard .rollApplied { margin-top: 4px; font-size: 12px; font-weight: 700; }
  #cabinCard .rollApplied.good { color: #c8e8b6; }
  #cabinCard .rollApplied.bad { color: #ffc1b6; }
  #cabinCard .rollTop { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
  #cabinCard .rollAvatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 20px; font-weight: 900; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #8e6a43; flex: 0 0 auto; }
  #cabinCard .rollWho { font-size: 13px; font-weight: 800; color: #f4e7d1; margin-top: 1px; }
  #cabinCard .rollTarget { margin-left: auto; min-width: 58px; text-align: center; border-radius: 12px; background: #4b3823; border: 1px solid #a98a63; padding: 4px 8px; }
  #cabinCard .rollTarget small { display: block; font-size: 9px; font-weight: 700; color: #c7b28e; letter-spacing: .08em; }
  #cabinCard .rollTarget b { display: block; font-size: 23px; line-height: 1.1; color: #ffd68a; }
  #cabinCard .rollStakes { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
  #cabinCard .stake { font-size: 11px; font-weight: 700; border-radius: 8px; padding: 4px 7px; }
  #cabinCard .stake.good { color: #d9f1c4; background: rgba(78,120,52,.32); border: 1px solid rgba(180,218,144,.25); }
  #cabinCard .stake.bad { color: #ffc9c2; background: rgba(130,48,48,.3); border: 1px solid rgba(232,151,143,.25); }
  #cabinCard.roomPrompt .t { color: #ffe2a8; }
  #cabinCard .rollPrompt { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: #3a2c21; border: 1px solid #8e6a43; }
  #cabinCard .rollPrompt .need { font-size: 12px; color: #e8d6ba; }
  #cabinCard .rollPrompt .need b { color: #ffd68a; }
  #cabinCard .rollPrompt .rollDice { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  #cabinCard .rollPrompt .rollDice i { width: 30px; height: 30px; border-radius: 7px; background: #f7ead2; border: 1.5px solid #a98a63; display: grid; place-items: center; color: #a98a63; font-size: 17px; font-weight: 900; animation: cabinShake .55s ease-in-out infinite; }
  #cabinCard .rollPrompt .rollDice i:nth-child(2) { animation-delay: .06s; }
  #cabinCard .rollPrompt .rollDice i:nth-child(3) { animation-delay: .12s; }
  #cabinCard .rollPrompt .rollDice i:nth-child(4) { animation-delay: .18s; }
  #cabinCard .rollPrompt .btn.primary { animation: rollReady 1.5s ease-in-out infinite; }
  @keyframes rollReady { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  #cabinCard .cabinDie.in { animation: cabinDieIn .42s cubic-bezier(.2,.9,.25,1.2) both; }
  @keyframes cabinDieIn { 0% { transform: translateY(-14px) scale(.7) rotate(-8deg); opacity: 0; } 60% { transform: translateY(2px) scale(1.05) rotate(2deg); opacity: 1; } 100% { transform: translateY(0) scale(1) rotate(0); } }
  @keyframes cabinShake { 0%,100% { transform: rotate(-6deg) translateY(0); } 50% { transform: rotate(7deg) translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) {
    #cabinCard .cabinDie.in, #cabinCard .rollPrompt .rollDice i { animation: none; }
  }

  .situationBar {
    width: min(100%, 980px);
    margin: 0 auto 5px;
    min-height: 34px;
    padding: 7px 14px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(35, 26, 19, .74);
    border: 1px solid rgba(216, 169, 79, .32);
    color: #f5e7cf;
    font-size: 12px;
    font-weight: 700;
    transition: background .2s ease, border-color .2s ease, transform .2s ease;
  }
  .situationBar .sDot { width: 9px; height: 9px; border-radius: 50%; background: #d8a94f; box-shadow: 0 0 0 4px rgba(216,169,79,.14); flex: 0 0 auto; }
  .situationBar .sText { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .situationBar .sAction { margin-left: auto; color: #ffd68a; font-weight: 800; white-space: nowrap; }
  .situationBar.hot { background: rgba(75, 54, 24, .9); border-color: #d8a94f; box-shadow: 0 0 0 1px rgba(216,169,79,.12); }
  .situationBar.warn { background: rgba(88, 37, 43, .9); border-color: #c7777a; }
  .situationBar.cool { background: rgba(28, 40, 48, .86); border-color: #7e9ba6; }
  .turnBanner {
    position: fixed;
    left: 50%;
    bottom: calc(128px + var(--sa-bottom));
    z-index: 45;
    min-width: 210px;
    max-width: calc(100vw - 36px);
    padding: 10px 18px 11px;
    border-radius: 18px;
    background: #fff3d9;
    color: #332416;
    box-shadow: 0 16px 36px rgba(0,0,0,.42), inset 0 0 0 2px #fff9eb;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transform: translateX(-50%) translateY(14px) scale(.92);
    transition: opacity .22s ease, transform .3s cubic-bezier(.2,.9,.25,1.2);
  }
  .turnBanner.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  .turnBanner .bTitle { font-size: 18px; font-weight: 900; color: #352315; }
  .turnBanner .bSub { margin-top: 2px; font-size: 12px; font-weight: 700; color: #7a6041; }
  .turnBanner.haunt { background: #5a2430; color: #ffe8d2; box-shadow: 0 16px 36px rgba(60,10,20,.55), inset 0 0 0 2px #b56c72; }
  .turnBanner.haunt .bTitle { color: #ffd68a; }
  .turnBanner.haunt .bSub { color: #f0c7b4; }

  .hotCell { animation: hotPulse 1.8s ease-in-out infinite; }
  @keyframes hotPulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  .roomNew { animation: roomNew 900ms ease-out both; }
  @keyframes roomNew { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }
  .cabinDock .moveMeter { display: flex; align-items: center; gap: 4px; margin-top: 3px; }
  .cabinDock .moveMeter i { width: 8px; height: 8px; border-radius: 50%; background: #d8a94f; box-shadow: 0 1px 0 #9b6a2f; }
  .cabinDock .moveMeter i.off { background: #d8cbb8; box-shadow: none; opacity: .55; }
  .cabinDock .moveMeter span { margin-left: 3px; font-size: 11px; color: #6d5b47; font-weight: 700; }
  @keyframes tokenPulse { 0%,100% { opacity: .35; transform: scale(.92); } 50% { opacity: .9; transform: scale(1.08); } }
  .tokenCurrent { animation: tokenPulse 1.9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @media (prefers-reduced-motion: reduce) {
    .situationBar, .turnBanner, .hotCell, .tokenCurrent, .roomNew { animation: none !important; transition: none !important; }
  }
  .cabinDock .btn { min-height: 44px; }
  .traitRow { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
  .traitChip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: #fff8e9; border: 1px solid #e5d3b4; color: #3a2c20; font-size: 12px; font-weight: 700; }
  .traitChip b { font-size: 15px; color: #7b2e3b; }
  .traitChip.low b { color: #a33a2c; }
  .pickPanel { background: rgba(24,17,12,.9); backdrop-filter: blur(8px); }
  .pickHead { color: var(--c-ink); }
  .pickCard { background: #f4e9d5; border-color: #d8c3a1; color: #2f241a; }
  .pickCard .art { color: #fff; }
  .pickCard .role { color: #756046; }
  .pickCard .tr span { background: #fff9ec; color: #4b3a27; }
  .pickCard .tr b { color: #7b2e3b; }
  .cabinBody .pickPanel { overscroll-behavior: contain; }
  .cabinBody .pickCard .tr { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; }
  .cabinBody .pickCard .tr span { display: flex; align-items: baseline; gap: 3px; white-space: nowrap; }
  .cabinBody .pickCard .tr em { font-style: normal; color: #9b8768; font-size: 10px; }
  @media (max-width: 720px) {
    .cabinBody .pickPanel { top: 56px; padding-bottom: calc(28px + var(--sa-bottom)); }
    .cabinBody .pickCard { padding: 8px 10px; border-radius: 15px; }
    .cabinBody .pickCard .tr { gap: 3px 6px; font-size: 11px; }
  }
  .cModal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 18px; background: rgba(10,7,5,.72); backdrop-filter: blur(6px); }
  .cModal.hidden { display: none; }
  .cModalCard { width: min(760px, 100%); max-height: 86vh; overflow: auto; border-radius: 22px; padding: 18px; background: #f4e9d5; color: #2f241a; box-shadow: 0 30px 80px rgba(0,0,0,.55); border: 3px solid #fff4df; }
  .cModalCard h2 { margin: 0 0 4px; font-size: 20px; color: #3a2819; }
  .cModalCard p { margin: 0 0 12px; color: #6d5b47; font-size: 13px; line-height: 1.6; }
  .rotGrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .rotOpt { border: 2px solid #d8c3a1; background: #fffaf0; border-radius: 16px; padding: 8px; cursor: pointer; }
  .rotOpt:disabled { opacity: .38; cursor: not-allowed; }
  .rotOpt:hover:not(:disabled) { border-color: #9b6a2f; }
  .rotOpt .mini { display: grid; place-items: center; height: 92px; background: #efe1c7; border-radius: 10px; position: relative; }
  .rotOpt svg { width: 86px; height: 72px; }
  .rotOpt span { display: block; text-align: center; font-size: 12px; font-weight: 800; margin-top: 6px; }
  .dmgTrack { display: grid; gap: 8px; margin: 14px 0; }
  .dmgPair { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .dmgBox { padding: 10px; border-radius: 12px; background: #fffaf0; border: 2px solid #d8c3a1; text-align: center; font-weight: 800; }
  .dmgBox small { display: block; font-weight: 600; color: #7a6550; font-size: 11px; }
  input[type=range] { width: 100%; accent-color: #7b2e3b; min-height: 36px; }
  .itemList { display: grid; gap: 10px; }
  .itemRow { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 10px; border: 2px solid #dfcbaa; border-radius: 14px; background: #fffaf0; }
  .itemRow .nm { font-weight: 800; }
  .itemRow .ds { font-size: 12px; color: #756046; }
  .itemRow .ops { display: flex; gap: 6px; flex-wrap: wrap; }
  .itemRow .btn { min-height: 38px; padding: 0 10px; font-size: 12px; }
  .emptyNote { padding: 18px; text-align: center; color: #7a6550; background: #fffaf0; border-radius: 14px; border: 2px dashed #d8c3a1; }
  .cabinCard .k { color: #d8a94f; }
  .cabinCard .d { color: #f0dfc7; }
  .cabinCard { color: #efe3cb; }
  .cabinCard.bad { box-shadow: 0 18px 40px rgba(90,30,40,.4), inset 0 0 0 2px #b56c72; }
  @media (max-width: 720px) {
    .cabinBoard { width: max(100%, 560px); max-height: none; }
    .boardWrap { place-items: start; padding: 0 0 4px; overflow: auto; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; scrollbar-width: none; }
    .boardWrap::-webkit-scrollbar { width: 0; height: 0; }
    .cabinDock .dockInfo { width: 100%; }
    .cabinDock .dockActions { width: 100%; justify-content: center; }
    .cabinDock .dockActions .btn { flex: 1 1 42%; min-width: 0; font-size: 13px; }
    .situationBar { font-size: 11px; padding: 6px 10px; min-height: 30px; margin-bottom: 4px; }
    .situationBar .sAction { font-size: 10px; }
    .turnBanner { bottom: calc(210px + var(--sa-bottom)); min-width: 190px; padding: 8px 14px 9px; }
    .turnBanner .bTitle { font-size: 16px; }
    .turnBanner .bSub { font-size: 11px; }
    .rotGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pickGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pickCard .tr { gap: 3px; }
    .cModalCard { padding: 14px; }
    .itemRow { align-items: flex-start; flex-direction: column; }
    .itemRow .ops { width: 100%; }
    .itemRow .ops .btn { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body class="cabinBody">
<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="btnHome" type="button" aria-label="返回大厅">←</button>
    <div class="pill" id="roomPill">房间：—</div>
    <div class="pill round" id="turnPill">未开局</div>
    <button class="icon-btn" id="btnLog" type="button" aria-label="查看本局动态">≡</button>
  </header>

  <section class="seats cabinSeats" id="seatStrip" aria-label="座位"></section>

  <div class="floorTabs" id="floorTabs" aria-label="楼层切换"></div>
  <div class="scenarioBar" id="scenarioBar"></div>
  <div class="situationBar" id="situationBar" role="status" aria-live="polite"></div>

  <main class="boardWrap">
    <div class="boardInner cabinBoard" id="boardInner" aria-label="林中小屋地图"></div>
  </main>

  <section class="pickPanel hidden" id="pickPanel" aria-label="选角色"></section>

  <footer class="dock cabinDock">
    <div class="dockInfo" id="dockInfo"></div>
    <div class="dockActions" id="dockActions"></div>
  </footer>

  <div id="cabinCard" role="status" aria-live="polite"></div>
  <div id="turnBanner" class="turnBanner" role="status" aria-live="polite"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <div class="sheet hidden" id="logSheet">
    <div class="sheetCard">
      <h2>本局动态</h2>
      <p class="sub">移动、翻房、抽卡、闹鬼、战斗与剧本进度都会记在这里</p>
      <ul class="logList"></ul>
      <div class="actions"><button class="btn ghost" id="logClose" type="button">收起</button></div>
    </div>
  </div>

  <div class="sheet hidden" id="startPanel"></div>
  <div class="winner hidden" id="winnerLayer"></div>
  <div class="cModal hidden" id="cModal" role="dialog" aria-modal="true"><div class="cModalCard" id="cModalCard"></div></div>
</div>

<script src="../js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/net.js"></script>
<script src="../js/games/cabin-packs.js"></script>
<script src="../js/games/cabin.js"></script>
<script src="games/shell.js?v=10"></script>
<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const C = window.CabinEngine;
  const W = C.W, H = C.H, CELL = 150;
  const board = document.getElementById('boardInner');
  const SEAT = ['#d95545', '#3d72b8', '#4d8b58', '#c68b2c', '#7d5bb0', '#c46182'];
  const SYMBOL = {
    event: { label: '事件', color: '#b96b2c' },
    item: { label: '物品', color: '#2f6fa3' },
    omen: { label: '预兆', color: '#6d4a9c' }
  };
  const FLOOR_TONE = {
    ground: { fill: '#f6ecd8', stroke: '#d6bf99' },
    upper: { fill: '#e9eef0', stroke: '#b8c9cc' },
    basement: { fill: '#e7e4d2', stroke: '#b8b596' }
  };

  let cur = null;
  let svg = null;
  let viewFloor = 'ground';
  let lastCardKey = '';
  let cardTimer = 0;
  let rolling = false;
  let rollFxTimer = 0;
  let rollTickTimer = 0;
  let lastTokenPos = {};
  let lastAutoView = '';
  let lastRoomKeys = null;
  let lastTurnKey = '';
  let lastPromptKey = '';
  let lastHauntActive = false;
  let bannerMoves = -1;
  let bannerTimer = 0;
  let narrow = false;
  let modalMode = '';
  let playerModalIndex = -1;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };
  const txt = (parent, x, y, content, attrs) => {
    const t = el('text', Object.assign({ x: x, y: y, 'text-anchor': 'middle' }, attrs || {}), parent);
    t.textContent = content;
    return t;
  };
  function seatColor(i) { return SEAT[i % SEAT.length]; }
  function myIndex(st) {
    if (!st) return -1;
    if (window.GameShell.isLocal && window.GameShell.isLocal()) return st.turn;
    return st.players.findIndex((p) => p.id === window.Net.identity.id);
  }
  function myTurn(st) {
    if (!st) return false;
    const p = st.players[st.turn];
    if (!p || p.dead) return false;
    if (st.phase === 'select') return window.GameShell.isLocal() ? true : p.id === window.Net.identity.id;
    if (st.phase !== 'playing') return false;
    return window.GameShell.isLocal() ? true : p.id === window.Net.identity.id;
  }
  function canControlOwner(st, idx) {
    if (!st || idx < 0) return false;
    if (window.GameShell.isLocal()) return true;
    return st.players[idx] && st.players[idx].id === window.Net.identity.id;
  }
  function roomAt(st, p) {
    return st.rooms.find((r) => r.floor === p.floor && r.x === p.x && r.y === p.y);
  }
  function traitLabel(key) {
    const t = C.TRAITS.find((x) => x.key === key);
    return t ? t.label : key;
  }
  const OPP = { N: 'S', S: 'N', E: 'W', W: 'E' };
  const DIR_ARROW = { N: '↑', S: '↓', E: '→', W: '←' };
  function hasDoor(doors, dir) { return String(doors || '').indexOf(dir) >= 0; }
  function openExits(st, me) {
    if (!st || !me) return 0;
    const here = roomAt(st, me);
    if (!here) return 0;
    let n = 0;
    [['N', 0, -1], ['S', 0, 1], ['W', -1, 0], ['E', 1, 0]].forEach((d) => {
      const dir = d[0], nx = me.x + d[1], ny = me.y + d[2];
      if (nx < 0 || ny < 0 || nx >= W || ny >= H || !hasDoor(here.doors, dir)) return;
      const target = st.rooms.find((r) => r.floor === me.floor && r.x === nx && r.y === ny);
      if (!target || hasDoor(target.doors, OPP[dir])) n += 1;
    });
    return n;
  }
  function haptic(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
  }

  /* ---------------- 通用弹层 ---------------- */
  function openModal(html, mode) {
    modalMode = mode || '';
    clearTimeout(bannerTimer);
    const banner = $('turnBanner');
    if (banner) banner.classList.remove('show');
    const card = $('cModalCard');
    card.innerHTML = html;
    $('cModal').classList.remove('hidden');
  }
  function closeModal() {
    modalMode = '';
    playerModalIndex = -1;
    $('cModal').classList.add('hidden');
    $('cModalCard').innerHTML = '';
  }
  function chooseTarget(title, options, onPick) {
    let html = '<h2>' + esc(title) + '</h2><p>选择一个目标。</p><div class="itemList">';
    options.forEach((o, k) => {
      html += '<button class="btn ghost" type="button" data-pick="' + k + '" style="min-height:48px">' + esc(o.name) + '</button>';
    });
    html += '</div>';
    openModal(html, 'choose');
    $('cModalCard').querySelectorAll('[data-pick]').forEach((b) => {
      b.addEventListener('click', () => onPick(options[Number(b.dataset.pick)]));
    });
  }

  /* ---------------- 棋盘 ---------------- */
  function buildBoard() {
    board.innerHTML = '';
    svg = el('svg', { viewBox: '0 0 ' + (W * CELL) + ' ' + (H * CELL), role: 'img', 'aria-label': '林中小屋地图' });
    board.appendChild(svg);
    svg.addEventListener('pointerdown', onTap);
  }

  function drawDoors(g, room, x0, y0, w, h) {
    const dirs = {
      N: [x0 + w / 2 - 18, y0 - 7, 36, 13],
      S: [x0 + w / 2 - 18, y0 + h - 6, 36, 13],
      W: [x0 - 7, y0 + h / 2 - 18, 13, 36],
      E: [x0 + w - 6, y0 + h / 2 - 18, 13, 36]
    };
    (room.doors || '').split('').forEach((d) => {
      const r = dirs[d];
      if (!r) return;
      el('rect', { x: r[0], y: r[1], width: r[2], height: r[3], rx: 6, fill: '#fff8e8', stroke: '#b99a6a', 'stroke-width': 1.5 }, g);
    });
  }

  function drawRoom(g, room, st, isHere, hotDir) {
    const px = room.x * CELL, py = room.y * CELL;
    const x0 = px + 11, y0 = py + 9, w = CELL - 22, h = CELL - 24;
    const tone = FLOOR_TONE[room.floor] || FLOOR_TONE.ground;
    el('rect', { x: x0, y: y0 + 5, width: w, height: h, rx: 18, fill: 'rgba(20,12,8,.32)' }, g);
    el('rect', {
      x: x0, y: y0, width: w, height: h, rx: 18,
      fill: room.special === 'goal' ? '#f0d8a2' : tone.fill,
      stroke: isHere ? '#b13b32' : tone.stroke,
      'stroke-width': isHere ? 5 : 2.5
    }, g);
    if (hotDir) {
      el('rect', { x: x0 - 5, y: y0 - 5, width: w + 10, height: h + 10, rx: 22, fill: 'none', stroke: '#f0c85c', 'stroke-width': 4, 'stroke-dasharray': '9 5', class: 'hotCell' }, g);
      el('rect', { x: x0 + 8, y: y0 + 8, width: 34, height: 26, rx: 13, fill: '#f0c85c' }, g);
      txt(g, x0 + 25, y0 + 26, DIR_ARROW[hotDir] || '·', { 'font-size': 18, 'font-weight': 900, fill: '#3a2c1b' });
    }
    drawDoors(g, room, x0, y0, w, h);

    if (room.special === 'goal') {
      el('circle', { cx: x0 + w / 2, cy: y0 + 17, r: 6, fill: '#a52f2f' }, g);
    }
    const size = room.name.length >= 5 ? 22 : room.name.length >= 4 ? 24 : 27;
    txt(g, x0 + w / 2, y0 + h * 0.36, room.name, {
      'font-size': size, 'font-weight': 800, fill: '#3b2c1c',
      'font-family': 'system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'
    });

    if (room.kind === 'stairs' || room.kind === 'landing') {
      const label = room.to === 'upper' ? '↑ 上层' : room.to === 'basement' ? '↓ 地下室' : '楼梯';
      txt(g, x0 + w / 2, y0 + h * 0.6, label, { 'font-size': 16, 'font-weight': 800, fill: '#8b6534' });
    } else if (room.symbol && !room.resolved) {
      const s = SYMBOL[room.symbol];
      const cx = x0 + w / 2, cy = y0 + h * 0.61;
      el('circle', { cx: cx - 26, cy: cy - 5, r: 9, fill: s.color }, g);
      txt(g, cx + 8, cy, s.label, { 'font-size': 16, 'font-weight': 800, fill: s.color });
    } else if (room.kind === 'start') {
      txt(g, x0 + w / 2, y0 + h * 0.6, '起点', { 'font-size': 16, 'font-weight': 800, fill: '#8b6534' });
    }

    const here = st.players.filter((p) => !p.dead && p.floor === room.floor && p.x === room.x && p.y === room.y);
    const monsters = (st.monsters || []).filter((m) => m.floor === room.floor && m.x === room.x && m.y === room.y);
    const all = here.map((p) => ({ kind: 'player', p: p, i: st.players.indexOf(p) }))
      .concat(monsters.map((m) => ({ kind: 'monster', p: m })));
    const n = Math.min(all.length, 5);
    const R = narrow ? 19 : 16;
    const GAP = narrow ? 40 : 35;
    const AF = narrow ? 17 : 14;
    all.slice(0, 5).forEach((o, k) => {
      const tx = x0 + w / 2 - (n - 1) * GAP / 2 + k * GAP;
      const ty = y0 + h - (narrow ? 24 : 21);
      const tg = el('g', {}, g);
      tg.style.transformOrigin = 'center';
      const prev = lastTokenPos[o.p.id];
      const moved = prev && prev.floor === room.floor && (prev.x !== room.x || prev.y !== room.y);
      if (moved) {
        const fx = tx + (prev.x - room.x) * CELL;
        const fy = ty + (prev.y - room.y) * CELL;
        tg.style.transform = 'translate(' + fx + 'px,' + fy + 'px)';
        tg.style.transition = 'none';
        requestAnimationFrame(() => {
          tg.style.transition = 'transform .34s cubic-bezier(.2,.85,.25,1.15)';
          tg.style.transform = 'translate(' + tx + 'px,' + ty + 'px)';
        });
      } else {
        tg.style.transform = 'translate(' + tx + 'px,' + ty + 'px)';
      }
      if (o.kind === 'player') {
        const isTraitor = st.haunt && st.haunt.active && st.haunt.traitor === o.i;
        if (st.turn === o.i && st.phase === 'playing' && !o.p.dead) {
          el('circle', { cx: 0, cy: 0, r: R + 6, fill: 'none', stroke: seatColor(o.i), 'stroke-width': 2.5, 'stroke-opacity': .55, class: 'tokenCurrent' }, tg);
        }
        el('circle', {
          cx: 0, cy: 0, r: R,
          fill: seatColor(o.i), stroke: isTraitor ? '#3d1d24' : '#fff',
          'stroke-width': isTraitor ? 4 : 2.5
        }, tg);
        txt(tg, 0, narrow ? 6 : 5, o.p.art || '?', { 'font-size': AF, 'font-weight': 800, fill: '#fff' });
      } else {
        el('circle', { cx: 0, cy: 0, r: R, fill: '#5d2430', stroke: '#f0cba0', 'stroke-width': 2.5 }, tg);
        txt(tg, 0, narrow ? 6 : 5, '怪', { 'font-size': AF, 'font-weight': 800, fill: '#ffe7cb' });
      }
      lastTokenPos[o.p.id] = { floor: room.floor, x: room.x, y: room.y };
    });
  }

  function drawEmpty(g, x, y, hotDir) {
    const px = x * CELL + 20, py = y * CELL + 18;
    el('rect', {
      x: px, y: py, width: CELL - 40, height: CELL - 40, rx: 16,
      fill: hotDir ? 'rgba(216,169,79,.22)' : 'rgba(255,255,255,.05)',
      stroke: hotDir ? '#d8a94f' : 'rgba(230,215,190,.18)',
      'stroke-width': hotDir ? 3 : 1.5, 'stroke-dasharray': hotDir ? '0' : '7 7',
      class: hotDir ? 'hotCell' : ''
    }, g);
    if (hotDir) {
      el('circle', { cx: px + (CELL - 40) / 2, cy: py + (CELL - 40) / 2 - 12, r: 18, fill: 'rgba(216,169,79,.16)', stroke: '#f0c85c', 'stroke-width': 2 }, g);
      txt(g, px + (CELL - 40) / 2, py + (CELL - 40) / 2 - 5, DIR_ARROW[hotDir] || '·', { 'font-size': 27, 'font-weight': 900, fill: '#ffe3a5' });
      txt(g, px + (CELL - 40) / 2, py + (CELL - 40) / 2 + 24, '推门', { 'font-size': narrow ? 22 : 18, 'font-weight': 800, fill: '#efd8a0' });
    }
  }

  function renderBoard(st) {
    if (!svg) buildBoard();
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    el('rect', { x: 0, y: 0, width: W * CELL, height: H * CELL, rx: 24, fill: '#2b2119' }, svg);
    el('rect', { x: 9, y: 9, width: W * CELL - 18, height: H * CELL - 18, rx: 20, fill: '#3a2c21' }, svg);
    for (let y = 0; y <= H; y++) el('line', { x1: 0, y1: y * CELL, x2: W * CELL, y2: y * CELL, stroke: 'rgba(216,169,79,.12)', 'stroke-width': 1.5 }, svg);
    for (let x = 0; x <= W; x++) el('line', { x1: x * CELL, y1: 0, x2: x * CELL, y2: H * CELL, stroke: 'rgba(216,169,79,.12)', 'stroke-width': 1.5 }, svg);

    const me = st.players[myIndex(st)];
    const here = me ? (st.rooms.find((r) => r.floor === me.floor && r.x === me.x && r.y === me.y)) : null;
    const canMove = st.phase === 'playing' && myTurn(st) && me && !me.dead && st.moves > 0 && !st.moveLocked && !st.pendingTile && !st.pendingDamage && !st.pendingRoll;
    const hotEmpty = {};
    const hotRooms = {};
    if (canMove && me.floor === viewFloor) {
      [['N', 0, -1], ['S', 0, 1], ['W', -1, 0], ['E', 1, 0]].forEach((d) => {
        const dir = d[0], nx = me.x + d[1], ny = me.y + d[2];
        if (nx < 0 || ny < 0 || nx >= W || ny >= H || !here || !hasDoor(here.doors, dir)) return;
        const key = nx + ',' + ny;
        const target = st.rooms.find((r) => r.floor === me.floor && r.x === nx && r.y === ny);
        if (!target) hotEmpty[key] = dir;
        else if (hasDoor(target.doors, OPP[dir])) hotRooms[key] = dir;
      });
    }

    const gEmpty = el('g', {}, svg);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        if (!st.rooms.some((r) => r.floor === viewFloor && r.x === x && r.y === y)) drawEmpty(gEmpty, x, y, hotEmpty[x + ',' + y]);
      }
    }

    const gRooms = el('g', {}, svg);
    const sorted = st.rooms.filter((r) => r.floor === viewFloor).sort((a, b) => (a.y - b.y) || (a.x - b.x));
    const roomKey = (r) => r.floor + '|' + r.x + '|' + r.y;
    const newKeys = new Set();
    if (lastRoomKeys) st.rooms.forEach((r) => { if (!lastRoomKeys.has(roomKey(r))) newKeys.add(roomKey(r)); });
    lastRoomKeys = new Set(st.rooms.map(roomKey));
    sorted.forEach((room) => {
      drawRoom(gRooms, room, st, here && room.x === here.x && room.y === here.y, hotRooms[room.x + ',' + room.y]);
      if (newKeys.has(roomKey(room))) {
        el('rect', {
          x: room.x * CELL + 5, y: room.y * CELL + 5, width: CELL - 10, height: CELL - 10, rx: 18,
          fill: 'none', stroke: '#ffd76a', 'stroke-width': 5, class: 'roomNew', 'pointer-events': 'none'
        }, gRooms);
      }
    });
    keepPlayerInView(st);

    if (st.pendingTile && st.pendingTile.tile && st.pendingTile.floor === viewFloor) {
      el('rect', { x: st.pendingTile.x * CELL + 14, y: st.pendingTile.y * CELL + 14, width: CELL - 28, height: CELL - 28, rx: 16, fill: 'none', stroke: '#f0c85c', 'stroke-width': 4, 'stroke-dasharray': '8 6' }, el('g', {}, svg));
    }
  }

  function keepPlayerInView(st) {
    if (!narrow || !board) return;
    const me = st.players[myIndex(st)];
    if (!me || me.floor !== viewFloor) return;
    const wrap = board.parentElement;
    if (!wrap) return;
    const key = me.floor + '|' + me.x + '|' + me.y;
    if (key === lastAutoView) return;
    lastAutoView = key;
    requestAnimationFrame(() => {
      const targetX = (me.x + .5) / W * board.offsetWidth - wrap.clientWidth / 2;
      const targetY = (me.y + .5) / H * board.offsetHeight - wrap.clientHeight / 2;
      wrap.scrollTo({ left: Math.max(0, targetX), top: Math.max(0, targetY), behavior: 'smooth' });
    });
  }

  /* ---------------- 楼层 / 剧本 ---------------- */
  function renderFloorTabs(st) {
    const bar = $('floorTabs');
    bar.innerHTML = '';
    C.FLOORS.slice().reverse().forEach((f) => {
      const b = document.createElement('button');
      b.className = 'floorTab';
      b.type = 'button';
      b.textContent = C.FLOOR_LABEL[f] + ' ' + st.rooms.filter((r) => r.floor === f).length;
      b.setAttribute('aria-pressed', f === viewFloor ? 'true' : 'false');
      b.addEventListener('click', () => { viewFloor = f; lastAutoView = ''; renderBoard(cur); renderFloorTabs(cur); });
      bar.appendChild(b);
    });
  }

  function renderScenario(st) {
    const bar = $('scenarioBar');
    if (!st.haunt || !st.haunt.active) { bar.classList.remove('show'); bar.innerHTML = ''; return; }
    const h = st.haunt;
    bar.classList.add('show');
    const traitor = st.players[h.traitor];
    const prog = h.heroGoal.type === 'hunt' ? (h.monsterBanish || 0) : (h.progress || 0);
    bar.innerHTML = '<b>' + esc(h.name) + '</b> · 叛徒 ' + esc(traitor ? traitor.name : '?') +
      ' · 英雄：' + esc(h.heroGoalText) + '（' + prog + '/' + (h.heroGoal.need || 0) + '）' +
      ' · 第 ' + (h.round || 0) + ' 轮';
  }

  function showBanner(title, sub, tone) {
    const b = $('turnBanner');
    if (!b) return;
    clearTimeout(bannerTimer);
    b.className = 'turnBanner' + (tone ? ' ' + tone : '');
    b.innerHTML = '<div class="bTitle">' + esc(title) + '</div>' + (sub ? '<div class="bSub">' + esc(sub) + '</div>' : '');
    void b.offsetWidth;
    b.classList.add('show');
    bannerTimer = setTimeout(() => { b.classList.remove('show'); }, 2450);
  }

  function announceSituation(st) {
    if (!st || st.phase === 'lobby') return;
    if (st.phase === 'ended') return;
    if (st.phase === 'select') {
      const p = st.players[st.turn];
      const key = 'select|' + st.turn + '|' + p.name;
      if (key !== lastTurnKey) lastTurnKey = key;
      const b = $('turnBanner');
      if (b) b.classList.remove('show');
      lastHauntActive = false;
      return;
    }
    const p = st.players[st.turn];
    const turnKey = 'play|' + st.turn + '|' + st.round;
    if (turnKey !== lastTurnKey) {
      lastTurnKey = turnKey;
      bannerMoves = st.moves;
      const isMine = myTurn(st);
      const exits = openExits(st, p);
      showBanner(isMine ? '你的回合' : '轮到 ' + p.name,
        exits ? '移动 ' + st.moves + ' 步 · 点击发光格探索' : '当前房间没有可走的门 · 点结束回合');
      haptic(18);
    } else if (!st.pendingRoll && bannerMoves !== st.moves) {
      const b = $('turnBanner');
      if (b) b.classList.remove('show');
    }
    if (st.haunt && st.haunt.active && !lastHauntActive) {
      lastHauntActive = true;
      const traitor = st.players[st.haunt.traitor];
      showBanner('闹鬼开始', '叛徒是 ' + (traitor ? traitor.name : '?') + ' · ' + (st.haunt.name || ''), 'haunt');
      haptic([30, 40, 30]);
    }
    if (st.pendingRoll) {
      const pr = st.pendingRoll;
      const key = 'roll|' + (pr.card || pr.room) + '|' + pr.diff + '|' + pr.index;
      if (key !== lastPromptKey) {
        lastPromptKey = key;
        showBanner('需要掷骰', (st.players[pr.index] || {}).name + ' · ' + traitLabel(pr.trait) + '判定 · 难度 ' + pr.diff);
      }
    } else lastPromptKey = '';
    if (!st.haunt || !st.haunt.active) lastHauntActive = false;
    if (!st.pendingRoll && (st.moveLocked || st.moves <= 0 || st.pendingTile || st.pendingDamage)) {
      const b = $('turnBanner');
      if (b) b.classList.remove('show');
    }
  }

  function renderSituation(st) {
    const bar = $('situationBar');
    if (!bar) return;
    let cls = '';
    let text = '';
    let action = '';
    if (st.phase === 'select') {
      text = '选角色阶段 · 轮到 ' + (st.players[st.turn] || {}).name;
      action = '点角色卡选人';
    } else if (st.phase === 'ended') {
      text = '本局已结束';
    } else if (st.pendingDamage) {
      cls = 'warn';
      text = (st.players[st.pendingDamage.index] || {}).name + ' 受到伤害，需要分配';
      action = '在弹窗里确认';
    } else if (st.pendingTile) {
      cls = 'hot';
      text = '推门成功：' + (st.pendingTile.tile ? st.pendingTile.tile.name : '新房间');
      action = '选择方向放置';
    } else if (st.pendingRoll) {
      cls = 'hot';
      text = (st.players[st.pendingRoll.index] || {}).name + ' 需要 ' + traitLabel(st.pendingRoll.trait) + '判定';
      action = myTurn(st) ? '点掷骰' : '等待对方';
    } else if (!myTurn(st)) {
      cls = 'cool';
      text = '等待 ' + (st.players[st.turn] || {}).name + ' 行动';
    } else if (st.moveLocked) {
      cls = 'cool';
      text = '本回合已经翻房 / 抽卡，移动结束';
      action = '结束回合';
    } else if (st.moves <= 0) {
      cls = 'cool';
      text = '移动点已用完';
      action = '结束回合';
    } else if (st.haunt && st.haunt.active) {
      cls = 'warn';
      text = '闹鬼中 · 英雄目标：' + (st.haunt.heroGoalText || '完成剧本目标');
      action = '移动 ' + st.moves + ' 步';
    } else {
      const me = st.players[myIndex(st)];
      const here = me ? roomAt(st, me) : null;
      if (!me || !openExits(st, me)) {
        cls = 'cool';
        text = '当前房间没有可走的门';
        action = '结束回合';
      } else {
        cls = 'hot';
        text = '你的回合 · 当前在「' + (here ? here.name : '未知房间') + '」';
        action = '可走 ' + openExits(st, me) + ' 个方向 · 移动 ' + st.moves + ' 步';
      }
    }
    bar.className = 'situationBar' + (cls ? ' ' + cls : '');
    bar.innerHTML = '<span class="sDot"></span><span class="sText">' + esc(text) + '</span>' +
      (action ? '<span class="sAction">' + esc(action) + '</span>' : '');
  }


  /* ---------------- 选角色 ---------------- */
  function renderPick(st) {
    const panel = $('pickPanel');
    if (!st || st.phase !== 'select') { panel.classList.add('hidden'); panel.innerHTML = ''; return; }
    panel.classList.remove('hidden');
    const current = st.players[st.turn];
    const left = st.players.filter((p) => !p.char).length;
    const mine = myTurn(st);

    panel.innerHTML = '';
    const head = document.createElement('div');
    head.className = 'pickHead';
    head.innerHTML = '<div style="font-size:19px;font-weight:800">轮到 ' + esc(current.name) + ' 选角色</div>' +
      '<div style="font-size:12px;color:#c9b797;margin-top:4px">还剩 ' + left + ' 人没选 · ' + C.CHARS.length + ' 名探险者 · 属性轨道</div>';
    panel.appendChild(head);

    const grid = document.createElement('div');
    grid.className = 'pickGrid';
    panel.appendChild(grid);

    C.CHARS.forEach((ch, idx) => {
      const ownerIdx = st.charTaken && st.charTaken[ch.key] !== undefined ? st.charTaken[ch.key] : -1;
      const owner = ownerIdx >= 0 ? st.players[ownerIdx] : null;
      const b = document.createElement('button');
      b.className = 'pickCard';
      b.type = 'button';
      b.disabled = !!owner || !mine;
      const tr = C.TRAITS.map((t) => {
        const v = ch.traits[t.key];
        return '<span>' + t.label + ' <b>' + v.start + '</b><em>' + v.min + '–' + v.max + '</em></span>';
      }).join('');
      b.innerHTML =
        '<div class="top"><span class="art" style="background:' + SEAT[idx % SEAT.length] + '">' + ch.art + '</span>' +
        '<span><div class="nm">' + ch.name + '</div><div class="role">' + ch.role + '</div></span></div>' +
        '<div class="tr">' + tr + '</div>' +
        (owner ? '<div class="who">已被 ' + esc(owner.name) + ' 选走</div>' : '');
      b.addEventListener('click', () => {
        if (owner) return;
        window.GameShell.send({ type: 'pick', char: ch.key });
      });
      grid.appendChild(b);
    });
  }

  /* ---------------- 翻房旋转 ---------------- */
  function miniRoomSvg(room, rot) {
    const doors = C.helpers.rotateDoors(room.doors, rot);
    const cell = 40, ox = 30, oy = 10, w = 46, h = 46;
    let s = '<svg viewBox="0 0 106 66" aria-hidden="true">';
    s += '<rect x="' + ox + '" y="' + oy + '" width="' + w + '" height="' + h + '" rx="7" fill="#f8efdc" stroke="#8c6a3e" stroke-width="2"/>';
    const pos = {
      N: [ox + w / 2 - 8, oy - 4, 16, 8],
      S: [ox + w / 2 - 8, oy + h - 4, 16, 8],
      W: [ox - 4, oy + h / 2 - 8, 8, 16],
      E: [ox + w - 4, oy + h / 2 - 8, 8, 16]
    };
    doors.split('').forEach((d) => {
      const r = pos[d];
      if (r) s += '<rect x="' + r[0] + '" y="' + r[1] + '" width="' + r[2] + '" height="' + r[3] + '" rx="2" fill="#5d3f22"/>';
    });
    s += '<text x="' + (ox + w / 2) + '" y="' + (oy + h / 2 + 5) + '" text-anchor="middle" font-size="11" font-weight="700" fill="#4b3420">' + esc(room.name) + '</text>';
    s += '</svg>';
    return s;
  }

  function renderTileModal(st) {
    if (!st.pendingTile) {
      if (modalMode === 'tile') closeModal();
      return;
    }
    const p = st.pendingTile;
    const tile = p.tile;
    const mine = myTurn(st);
    const legal = p.legalRots || [];
    const rotName = ['原方向', '转 90°', '转 180°', '转 270°'];
    let html = '<h2>推门：' + esc(tile.name) + '</h2>' +
      '<p>' + esc(C.FLOOR_LABEL[p.floor]) + ' · 门必须接上当前房间的门口。选择放置方向。</p>' +
      '<div class="rotGrid">';
    for (let r = 0; r < 4; r++) {
      const ok = legal.indexOf(r) >= 0;
      html += '<button class="rotOpt" type="button" data-rot="' + r + '"' + (ok && mine ? '' : ' disabled') + '>' +
        '<div class="mini">' + miniRoomSvg(tile, r) + '</div><span>' + rotName[r] + '</span></button>';
    }
    html += '</div>';
    if (!mine) html += '<p style="margin-top:12px">等待 ' + esc(st.players[st.turn].name) + ' 选择。</p>';
    openModal(html, 'tile');
    $('cModalCard').querySelectorAll('.rotOpt').forEach((b) => {
      b.addEventListener('click', () => {

  /* ---------------- 伤害分配 ---------------- */
  function renderDamageModal(st) {
    const pd = st.pendingDamage;
    if (!pd) {
      if (modalMode === 'damage') closeModal();
      return;
    }
    const owner = st.players[pd.index];
    const can = canControlOwner(st, pd.index);
    const pair = pd.kind === 'physical' ? ['might', 'speed'] : ['known', 'sanity'];
    const a = pair[0], b = pair[1];
    const va = owner.traits[a], vb = owner.traits[b];
    const amount = pd.amount;
    let html = '<h2>' + esc(owner.name) + ' 受到 ' + amount + ' 点' + (pd.kind === 'physical' ? '物理' : '精神') + '伤害</h2>' +
      '<p>' + (pd.source ? esc(pd.source) + ' · ' : '') + '在「' + traitLabel(a) + '」和「' + traitLabel(b) + '」之间分配。闹鬼后属性归零即死亡。</p>' +
      '<div class="dmgTrack">' +
      '<input id="dmgRange" type="range" min="0" max="' + amount + '" value="' + Math.ceil(amount / 2) + '" aria-label="第一属性分配点数">' +
      '<div class="dmgPair">' +
      '<div class="dmgBox" id="dmgA"><small>' + traitLabel(a) + '</small><span id="dmgAv">' + (va - Math.ceil(amount / 2)) + '</span></div>' +
      '<b>← 分配 →</b>' +
      '<div class="dmgBox" id="dmgB"><small>' + traitLabel(b) + '</small><span id="dmgBv">' + (vb - (amount - Math.ceil(amount / 2))) + '</span></div>' +
      '</div></div>';
    if (can) html += '<button class="btn primary" type="button" id="dmgOk" style="width:100%;min-height:48px">确认分配</button>';
    else html += '<p>等待 ' + esc(owner.name) + ' 分配伤害。</p>';
    openModal(html, 'damage');

    const range = $('dmgRange');
    const update = () => {
      const first = Number(range.value);
      const second = amount - first;
      const hauntOn = st.haunt && st.haunt.active;
      const nextA = hauntOn ? (va - first) : Math.max(va - first, owner.min[a]);
      const nextB = hauntOn ? (vb - second) : Math.max(vb - second, owner.min[b]);
      $('dmgAv').textContent = nextA + (hauntOn && nextA < owner.min[a] ? '（骷髅）' : (!hauntOn && nextA <= owner.min[a] ? '（最低）' : ''));
      $('dmgBv').textContent = nextB + (hauntOn && nextB < owner.min[b] ? '（骷髅）' : (!hauntOn && nextB <= owner.min[b] ? '（最低）' : ''));
    };
    if (range) {
      range.addEventListener('input', update);
      update();
    }
    const ok = $('dmgOk');
    if (ok) ok.addEventListener('click', () => {
      const first = Number($('dmgRange').value);
      window.GameShell.send({ type: 'allocateDamage', first: a, second: amount - first });
    });
  }

  /* ---------------- 物品 ---------------- */
  function renderInventory(st, mi) {
    const me = st.players[mi];
    const items = me.items || [];
    let html = '<h2>' + esc(me.name) + ' 的物品</h2><p>物品不占携带上限。每件物品每回合只能执行「使用 / 交易 / 丢弃 / 偷窃 / 拾取」其中一项；卡面写明不能交易或丢弃的除外。</p>';
    if (!items.length) {
      html += '<div class="emptyNote">还没有物品。探索房间、抽物品卡，或从地上拾取。</div>';
    } else {
      html += '<div class="itemList">';
      items.forEach((it, idx) => {
        const isOmen = it.tag === 'omen' || it.omen;
        const acted = (st.itemActions || {})[it.name] || '';
        html += '<div class="itemRow"><div><div class="nm">' + esc(it.name) + (isOmen ? ' · 预兆' : '') + '</div>' +
          '<div class="ds">' + esc(it.text || '') + (acted ? ' · 本回合已' + (acted === 'use' ? '使用' : acted === 'trade' ? '交易' : acted === 'drop' ? '丢弃' : acted === 'steal' ? '被偷窃' : '拾取') : '') + '</div></div><div class="ops">';
        if (it.use) {
          html += '<button class="btn ghost" type="button" data-use="' + idx + '"' + (acted ? ' disabled' : '') + '>使用</button>';
        }
        if (!it.noDrop) html += '<button class="btn ghost" type="button" data-drop="' + idx + '"' + (acted ? ' disabled' : '') + '>丢弃</button>';
        const others = st.players.filter((p, i) => i !== mi && !p.dead && p.floor === me.floor && p.x === me.x && p.y === me.y);
        if (!it.noTrade && others.length) {
          html += '<button class="btn ghost" type="button" data-trade="' + idx + '"' + (acted || st.traded ? ' disabled' : '') + '>交易</button>';
        }
        html += '</div></div>';
      });
      html += '</div>';
    }
    html += '<div class="actions" style="margin-top:14px"><button class="btn ghost" type="button" id="invClose">收起</button></div>';
    openModal(html, 'inventory');

    $('invClose').addEventListener('click', () => closeModal());
    $('cModalCard').querySelectorAll('[data-use]').forEach((b) => b.addEventListener('click', () => {
      window.GameShell.send({ type: 'useItem', index: Number(b.dataset.use) });
      renderInventory(cur, mi);
    }));
    $('cModalCard').querySelectorAll('[data-drop]').forEach((b) => b.addEventListener('click', () => {
      window.GameShell.send({ type: 'dropItem', index: Number(b.dataset.drop) });
      renderInventory(cur, mi);
    }));
    $('cModalCard').querySelectorAll('[data-trade]').forEach((b) => b.addEventListener('click', () => {
      const idx = Number(b.dataset.trade);
      const others = st.players.filter((p, i) => i !== mi && !p.dead && p.floor === me.floor && p.x === me.x && p.y === me.y);
      if (others.length === 1) {
        window.GameShell.send({ type: 'trade', target: others[0].id, index: idx });
        renderInventory(cur, mi);
        return;
      }
      chooseTarget('把「' + me.items[idx].name + '」交易给谁？', others, (pick) => {
        window.GameShell.send({ type: 'trade', target: pick.id, index: idx });
        renderInventory(cur, mi);
      });
    }));
  }

  /* ---------------- 玩家信息（公开查看） ---------------- */
  function itemRuleSummary(it) {
    const parts = [];
    if (it.use) {
      const u = it.use;
      if (u.type === 'heal') parts.push('使用：' + traitLabel(u.trait) + ' 回复 ' + (u.amount || 1));
      else if (u.type === 'gain') parts.push('使用：' + traitLabel(u.trait) + ' +' + (u.amount || 1));
      else parts.push('可使用');
    }
    if (it.testTrait) parts.push('判定：' + traitLabel(it.testTrait) + ' +' + (it.testBonus || 1));
    if (it.weapon) parts.push('武器：' + traitLabel(it.weapon) + '攻击' + (it.attackBonus ? ' +' + it.attackBonus : ''));
    if (it.delta) parts.push((it.tag === 'omen' || it.omen ? '预兆影响：' : '属性：') + traitLabel(it.delta.trait) + ' ' + (it.delta.amount > 0 ? '+' : '') + it.delta.amount);
    if (it.noTrade) parts.push('不可交易');
    if (it.noDrop) parts.push('不可丢弃');
    if (it.noSteal) parts.push('不可偷窃');
    return parts.join(' · ');
  }

  function renderPlayerInfo(st, idx) {
    const p = st.players[idx];
    if (!p) { closeModal(); return; }
    playerModalIndex = idx;
    const mine = myIndex(st) === idx;
    const active = st.phase === 'playing' && st.turn === idx;
    const here = roomAt(st, p);
    const h = st.haunt && st.haunt.active ? st.haunt : null;
    const isTraitor = !!(h && h.traitor === idx);
    const items = p.items || [];
    let badges = '<span class="pBadge">' + (active ? '当前回合' : (mine ? '你' : '玩家 ' + (idx + 1))) + '</span>';
    if (p.dead) badges += '<span class="pBadge dead">已死亡</span>';
    if (h) badges += '<span class="pBadge ' + (isTraitor ? 'traitor' : 'hero') + '">' + (isTraitor ? '叛徒' : '英雄') + '</span>';
    else badges += '<span class="pBadge">闹鬼前 · 阵营未定</span>';

    let html = '<div class="playerInfoHead">' +
      '<span class="playerAvatar" style="background:' + seatColor(idx) + '">' + esc(p.art || '?') + '</span>' +
      '<div class="playerInfoName"><h2>' + esc(p.name) + (mine ? ' <small>你</small>' : '') + '</h2>' +
      '<p>' + esc(p.charName || '未选角色') + (p.role ? ' · ' + esc(p.role) : '') + '</p></div>' +
      '<button class="btn ghost playerClose" type="button" id="playerClose">关闭</button></div>' +
      '<div class="playerBadges">' + badges + '</div>' +
      '<p class="playerPublicNote">线下桌上公开的信息：角色卡、物品、位置和当前状态。</p>' +
      '<div class="playerMeta">位置：<b>' + esc(C.FLOOR_LABEL[p.floor] || '未知') + ' · ' + esc(here ? here.name : '未知房间') + '</b>' +
      (active ? ' · 本回合移动 ' + st.moves : '') +
      (h ? ' · 剧本：' + esc(h.name) : '') + '</div>';

    html += '<div class="playerSectionTitle">角色卡 · 四项属性</div><div class="playerStats">';
    C.TRAITS.forEach((t) => {
      const v = Number(p.traits && p.traits[t.key]) || 0;
      const min = Number(p.min && p.min[t.key]);
      const max = Number(p.max && p.max[t.key]);
      const start = Number(p.start && p.start[t.key]);
      const width = (Number.isFinite(min) && Number.isFinite(max) && max > min) ? Math.max(0, Math.min(100, ((v - min) / (max - min)) * 100)) : 0;
      html += '<div class="playerTrait' + (Number.isFinite(min) && v <= min ? ' low' : '') + '">' +
        '<div class="ptRow"><span>' + esc(t.label) + '</span><b>' + v + '</b><em>' +
        (Number.isFinite(min) && Number.isFinite(max) ? min + '–' + max : '?–?') +
        (Number.isFinite(start) ? ' · 起始 ' + start : '') + '</em></div>' +
        '<i class="ptBar"><span style="width:' + width + '%"></span></i></div>';
    });
    html += '</div>';

    html += '<div class="playerSectionTitle">物品 ' + items.length + '</div>';
    if (!items.length) {
      html += '<div class="emptyNote">没有物品。桌上的物品卡都是公开的；当前玩家可在自己的物品面板中使用或交易。</div>';
    } else {
      html += '<div class="itemList">';
      items.forEach((it) => {
        const isOmen = it.tag === 'omen' || it.omen;
        const rule = itemRuleSummary(it);
        html += '<div class="itemRow"><div><div class="nm">' + esc(it.name) + (isOmen ? ' · 预兆' : '') + '</div>' +
          '<div class="ds">' + esc(it.text || '') + '</div>' +
          (rule ? '<div class="itemRule">' + esc(rule) + '</div>' : '') + '</div></div>';
      });
      html += '</div>';
    }
    html += '<div class="actions" style="margin-top:14px"><button class="btn ghost" type="button" id="playerCloseBottom">收起</button></div>';
    openModal(html, 'player');
    const close = () => closeModal();
    const a = $('playerClose'); if (a) a.addEventListener('click', close);
    const b = $('playerCloseBottom'); if (b) b.addEventListener('click', close);
  }

  function openPlayerInfo(st, idx) {
    if (!st || !st.players[idx]) return;
    renderPlayerInfo(st, idx);
  }

  /* ---------------- 卡牌 ---------------- */
  function effectSummary(eff) {
    if (!eff) return '';
    const parts = [];
    if (eff.gain) parts.push(traitLabel(eff.gain.trait) + ' +' + eff.gain.amount);
    if (eff.lose) parts.push(traitLabel(eff.lose.trait) + ' -' + eff.lose.amount);
    if (eff.heal) parts.push(traitLabel(eff.heal.trait) + ' 回复 ' + eff.heal.amount);
    if (eff.damage) {
      const d = eff.damage;
      parts.push((d.dice ? '掷 ' + d.dice + ' 颗伤害骰' : '受到 ' + d.amount + ' 点') + (d.type === 'mental' ? '精神伤害' : '物理伤害'));
    }
    return parts.join('；');
  }

  function renderRollPrompt(st) {
    const pr = st.pendingRoll;
    const box = $('cabinCard');
    const label = traitLabel(pr.trait);
    const canRoll = myTurn(st) && pr.index === myIndex(st);
    const who = (st.players[pr.index] || {}).name || '玩家';
    const owner = st.players[pr.index] || {};
    const diceN = Math.max(1, (Number(owner.traits && owner.traits[pr.trait]) || 0) + (C.helpers.itemTestBonus ? C.helpers.itemTestBonus(st, pr.index, pr.trait) : 0));
    const diceFaces = Array(diceN).fill('?').map((x) => '<i>' + x + '</i>').join('');
    const winText = effectSummary(pr.win);
    const loseText = effectSummary(pr.lose);
    box.className = 'show' + (pr.kind === 'room' ? ' roomPrompt' : '');
    box.innerHTML = '<div class="rollTop"><span class="rollAvatar" style="background:' + seatColor(pr.index) + '">' + esc(owner.art || '?') + '</span>' +
      '<div><div class="k">' + (pr.kind === 'event' ? '事件判定' : '房间判定') + '</div><div class="rollWho">' + esc(who) + ' · ' + esc(label) + '判定</div></div>' +
      '<div class="rollTarget"><small>难度</small><b>' + pr.diff + '</b></div></div>' +
      '<div class="t">' + esc(pr.card || pr.room || '判定') + '</div>' +
      '<div class="d">' + (pr.text ? esc(pr.text) + '<br>' : '') +
      '掷 ' + diceN + ' 颗骰，总点数 ≥ ' + pr.diff + ' 即成功。' + (canRoll ? '点击下方按钮投掷。' : '等待 ' + esc(who) + ' 投掷。') + '</div>' +
      (winText || loseText ? '<div class="rollStakes">' + (winText ? '<span class="stake good">成功 · ' + esc(winText) + '</span>' : '') +
        (loseText ? '<span class="stake bad">失败 · ' + esc(loseText) + '</span>' : '') + '</div>' : '') +
      (rolling ? '<div class="rollPrompt"><div class="need">骰子滚动中…</div><div class="rollDice">' + Array(diceN).fill('<i>?</i>').join('') + '</div></div>' :
        '<div class="rollPrompt"><div class="need">掷 <b>' + esc(label) + '</b> 骰 · 目标 <b>' + pr.diff + '</b></div><div class="rollDice">' + diceFaces + '</div>' +
        '<button class="btn primary" type="button" id="rollPendingBtn"' + (canRoll ? '' : ' disabled') + '>掷骰</button></div>');
    clearTimeout(cardTimer);
    if (canRoll && !rolling) {
      const btn = $('rollPendingBtn');
      if (btn) btn.addEventListener('click', () => {
        if (rolling) return;
        rolling = true;
        haptic(12);
        renderRollPrompt(cur);
        clearInterval(rollTickTimer);
        rollTickTimer = setInterval(() => {
          const dice = box.querySelectorAll('.rollDice i');
          dice.forEach((d) => { d.textContent = String([0, 1, 2][Math.floor(Math.random() * 3)]); });
        }, 85);
        rollFxTimer = setTimeout(() => {
          clearInterval(rollTickTimer);
          rolling = false;
          window.GameShell.send({ type: 'rollPending' });
          haptic([18, 30, 18]);
        }, 680);
      });
    }
  }

  function renderCard(st) {
    const box = $('cabinCard');
    if (st.pendingRoll) { renderRollPrompt(st); return; }
    if (!st.lastCard) { box.className = ''; box.innerHTML = ''; lastCardKey = ''; return; }
    const key = st.lastCard.kind + '|' + st.lastCard.title + '|' + (st.logs || []).length + '|' + (st.lastRoll ? st.lastRoll.total + st.lastRoll.ok : '') + '|' + (st.lastDamageRoll ? st.lastDamageRoll.total : '');
    if (key === lastCardKey) return;
    lastCardKey = key;
    const c = st.lastCard;
    box.className = 'show' + (c.tone === 'bad' ? ' bad' : '');
    box.innerHTML = '<div class="k">' + (c.kind === 'omen' ? '预兆' : c.kind === 'item' ? '物品' : c.kind === 'haunt' ? '闹鬼' : c.kind === 'room' ? '房间' : '事件') +
      '</div><div class="t">' + esc(c.title) + '</div><div class="d">' + esc(c.text) + '</div>';
    if (st.lastRoll) {
      const result = document.createElement('div');
      result.className = 'rollResult';
      const rr = st.lastRoll;
      result.textContent = (rr.diff != null ? (rr.ok ? '判定成功' : '判定失败') + ' · ' : '掷骰结果 · ') +
        '总点数 ' + rr.total + (rr.diff != null ? ' / 难度 ' + rr.diff : '');
      box.appendChild(result);
      if (rr.diff != null) {
        const applied = rr.ok ? c.win : c.lose;
        const appliedText = effectSummary(applied);
        if (appliedText) {
          const ae = document.createElement('div');
          ae.className = 'rollApplied ' + (rr.ok ? 'good' : 'bad');
          ae.textContent = '结果 · ' + appliedText;
          box.appendChild(ae);
        }
      }
      const row = document.createElement('div');
      row.className = 'cabinDice';
      (rr.faces || []).forEach((f, idx) => {
        const d = document.createElement('div');
        d.className = 'cabinDie in';
        d.style.animationDelay = (idx * 0.055) + 's';
        d.textContent = f;
        row.appendChild(d);
      });
      const sum = document.createElement('div');
      sum.className = 'cabinDie in';
      sum.style.width = 'auto';
      sum.style.padding = '0 8px';
      sum.style.animationDelay = ((rr.faces || []).length * 0.055) + 's';
      sum.textContent = '= ' + rr.total;
      row.appendChild(sum);
      box.appendChild(row);
      const dr = st.lastDamageRoll;
      if (dr && dr.label !== rr.label) {
        const dh = document.createElement('div');
        dh.className = 'rollResult';
        dh.textContent = dr.label + ' · ' + dr.total + ' 点';
        box.appendChild(dh);
        const drRow = document.createElement('div');
        drRow.className = 'cabinDice';
        (dr.faces || []).forEach((f, idx) => {
          const d = document.createElement('div');
          d.className = 'cabinDie in';
          d.style.animationDelay = (idx * 0.055) + 's';
          d.textContent = f;
          drRow.appendChild(d);
        });
        box.appendChild(drRow);
      }
    }
    clearTimeout(cardTimer);
    cardTimer = setTimeout(() => { box.className = ''; }, 8000);
  }

  /* ---------------- 底栏 ---------------- */
  function renderDock(st) {
    const info = $('dockInfo');
    const actions = $('dockActions');
    if (!info || !actions) return;
    const mi = myIndex(st);
    const me = st.players[mi];
    info.innerHTML = '';
    actions.innerHTML = '';
    if (!me) return;

    if (st.phase === 'select') {
      const who = st.players[st.turn];
      info.innerHTML = '<div class="ttl">选角色阶段</div><div class="sub">轮到 ' + esc(who.name) + ' · 还剩 ' + st.players.filter((p) => !p.char).length + ' 人</div>';
      const hint = document.createElement('span');
      hint.className = 'btn ghost';
      hint.style.cssText = 'display:grid;place-items:center';
      hint.textContent = myTurn(st) ? '点角色卡选人' : '等待 ' + who.name;
      actions.appendChild(hint);
      return;
    }

    const here = roomAt(st, me);
    const head = document.createElement('div');
    const statusNote = st.moveLocked ? ' · 本回合已翻房' : (st.attacked ? ' · 本回合已攻击' : '');
    head.innerHTML = '<div class="ttl">' + esc(me.name) + ' · ' + esc(me.charName) + '（' + esc(me.role) + '）</div>' +
      '<div class="traitRow"></div>' +
      '<div class="sub">' + (st.haunt && st.haunt.active ? '闹鬼 · 预兆 ' + st.omens : '探索 · 预兆 ' + st.omens) +
      ' · 移动 ' + st.moves + ' · 物品 ' + (me.items || []).filter((it) => it.tag !== 'omen' && it.tag !== '预兆').length +
      (here ? ' · ' + esc(here.name) : '') + statusNote + '</div>' +
      '<div class="moveMeter" aria-label="剩余移动 ' + st.moves + ' 步"></div>';
    info.appendChild(head);

    const meter = head.querySelector('.moveMeter');
    const speedCap = Math.max(1, Number(me.traits.speed) || 1);
    for (let k = 0; k < speedCap; k++) {
      const pip = document.createElement('i');
      if (k >= st.moves) pip.className = 'off';
      meter.appendChild(pip);
    }
    const meterLabel = document.createElement('span');
    meterLabel.textContent = st.moves + ' 步';
    meter.appendChild(meterLabel);

    const row = head.querySelector('.traitRow');
    C.TRAITS.forEach((t) => {
      const v = me.traits[t.key] || 0;
      const chip = document.createElement('span');
      chip.className = 'traitChip' + (v <= me.min[t.key] ? ' low' : '');
      chip.innerHTML = t.label + ' <b>' + v + '</b><em>' + me.min[t.key] + '–' + me.max[t.key] + '</em>';
      row.appendChild(chip);
    });

    const isMine = myTurn(st);
    const addBtn = (label, cls, fn, disabled, title) => {
      const b = document.createElement('button');
      b.className = 'btn ' + (cls || 'ghost');
      b.type = 'button';
      b.innerHTML = label;
      if (title) b.title = title;
      if (disabled) b.disabled = true;
      b.addEventListener('click', fn);
      actions.appendChild(b);
      return b;
    };

    if (st.phase === 'ended') return;

    if (!isMine) {
      const span = document.createElement('span');
      span.className = 'btn ghost';
      span.style.cssText = 'display:grid;place-items:center';
      span.textContent = '等待 ' + st.players[st.turn].name + ' 行动';
      actions.appendChild(span);
      return;
    }

    if (st.pendingDamage) return;
    if (st.pendingRoll || st.pendingTile) return;

    // 当前房间动作
    addBtn('物品 ' + ((me.items || []).length), 'ghost', () => renderInventory(st, mi));
    if (here && (here.kind === 'stairs' || here.kind === 'grandStair' || here.kind === 'landing' || here.special === 'basementStairs' || here.name === '门厅')) {
      addBtn('走楼梯', 'ghost', () => window.GameShell.send({ type: 'stair' }), st.moves <= 0 || st.moveLocked || !!st.pendingTile);
    }
    if (st.itemPiles && st.itemPiles[me.floor + '|' + me.x + '|' + me.y] && st.itemPiles[me.floor + '|' + me.x + '|' + me.y].length) {
      addBtn('拾取物品', 'ghost', () => window.GameShell.send({ type: 'pickup' }), !!st.picked);
    }

    if (st.haunt && st.haunt.active && me.side !== 'traitor') {
      const goal = st.haunt.heroGoal;
      if ((goal.type === 'ritual' || goal.type === 'wolves') && (!goal.room || (here && here.name === goal.room))) {
        addBtn('执行目标 · ' + traitLabel(goal.trait || 'known'), 'primary', () => window.GameShell.send({ type: 'check' }), !!st.taskRolled);
      }
    }

    if (st.haunt && st.haunt.active) {
      const foes = [];
      st.players.forEach((p, i) => {
        if (i !== mi && !p.dead && p.floor === me.floor && p.x === me.x && p.y === me.y && p.side !== me.side) {
          foes.push({ id: p.id, name: p.name, items: (p.items || []).filter((it) => !it.noSteal && !it.noTrade).length });
        }
      });
      (st.monsters || []).forEach((m) => {
        if (m.floor === me.floor && m.x === me.x && m.y === me.y) foes.push({ id: m.id, name: m.name + (m.stunned ? '（僵直）' : '') });
      });
      if (foes.length) {
        addBtn('攻击', 'primary', () => {
          if (foes.length === 1) {
            window.GameShell.send({ type: 'attack', target: foes[0].id, trait: 'might' });
            return;
          }
          chooseTarget('攻击谁？', foes, (f) => {
            window.GameShell.send({ type: 'attack', target: f.id, trait: 'might' });
          });
        }, !!st.attacked);
        const stealFoes = foes.filter((f) => f.items);
        if (stealFoes.length) {
          addBtn('偷窃', 'ghost', () => {
            chooseTarget('从谁身上偷物品？', stealFoes, (f) => {
              window.GameShell.send({ type: 'attack', target: f.id, trait: 'might', steal: true });
            });
          }, !!st.attacked);
        }
      }
      const ranged = [];
      if (C.helpers.hasDistanceWeapon(st, mi, 'might')) {
        st.players.forEach((p, i) => {
          if (i === mi || p.dead || p.side === me.side || p.floor !== me.floor) return;
          if (p.x === me.x && p.y === me.y) return;
          if (C.helpers.inLineOfSight(st, me, p)) ranged.push({ id: p.id, name: p.name });
        });
        (st.monsters || []).forEach((m) => {
          if (m.floor !== me.floor || (m.x === me.x && m.y === me.y)) return;
          if (C.helpers.inLineOfSight(st, me, m)) ranged.push({ id: m.id, name: m.name + (m.stunned ? '（僵直）' : '') });
        });
      }
      if (ranged.length) {
        addBtn('远程攻击', 'ghost', () => {
          chooseTarget('远程攻击谁？', ranged, (f) => {
            window.GameShell.send({ type: 'attack', target: f.id, trait: 'might', distance: true });
          });
        }, !!st.attacked);
      }
    }

    addBtn('结束回合', 'ghost', () => window.GameShell.send({ type: 'end' }), !!st.pendingTile || !!st.pendingRoll, st.pendingRoll ? '先掷骰' : st.pendingTile ? '先放置房间' : '');

    if (st.moves <= 0 && !st.moveLocked) {
      const tip = document.createElement('span');
      tip.className = 'sub';
      tip.style.cssText = 'font-size:11px;color:#c9b797;align-self:center';
      tip.textContent = '移动点已用完';
      actions.appendChild(tip);
    }
  }

  /* ---------------- 棋盘点击 ---------------- */
  function onTap(ev) {
    const st = cur;
    if (!st || st.phase !== 'playing') return;
    if (!myTurn(st)) { window.GameShell.toast('还没轮到你', true); return; }
    if (st.pendingTile || st.pendingDamage || st.pendingRoll) return;
    if (st.moveLocked) { window.GameShell.toast('本回合已经翻过房间', true); return; }
    if (st.moves <= 0) { window.GameShell.toast('移动点用完了', true); return; }
    const me = st.players[st.turn];
    if (me.floor !== viewFloor) { window.GameShell.toast('先切到 ' + C.FLOOR_LABEL[me.floor], true); return; }

    const rect = svg.getBoundingClientRect();
    const vx = (ev.clientX - rect.left) / rect.width * (W * CELL);
    const vy = (ev.clientY - rect.top) / rect.height * (H * CELL);
    const tx = Math.floor(vx / CELL), ty = Math.floor(vy / CELL);
    const dx = tx - me.x, dy = ty - me.y;
    if (Math.abs(dx) + Math.abs(dy) !== 1) { window.GameShell.toast('只能走到上下左右相邻格', true); return; }
    const dir = dx === 1 ? 'E' : dx === -1 ? 'W' : dy === 1 ? 'S' : 'N';
    const sent = window.GameShell.send({ type: 'move', dir: dir });
    if (sent) {
      haptic(8);
      board.classList.remove('punch');
      void board.offsetWidth;
      board.classList.add('punch');
    }
  }

  /* ---------------- 总渲染 ---------------- */
  function render(st) {
    cur = st;
    if (!st) return;
    narrow = window.innerWidth <= 720;
    const selecting = st.phase === 'select';
    $('floorTabs').style.display = selecting ? 'none' : '';
    renderPick(st);
    if (!selecting) {
      const me = st.players[myIndex(st)];
      if (me && !me.dead && me.floor !== viewFloor && st.phase === 'playing') viewFloor = me.floor;
    }
    renderFloorTabs(st);
    renderBoard(st);
    renderScenario(st);
    renderSituation(st);
    announceSituation(st);
    renderDock(st);
    renderCard(st);
    if (st.pendingTile) renderTileModal(st);
    else if (st.pendingDamage) renderDamageModal(st);
    else if (st.pendingRoll && modalMode) closeModal();
    else if (modalMode === 'tile' || modalMode === 'damage') closeModal();
    else if (modalMode === 'player' && playerModalIndex >= 0) renderPlayerInfo(st, playerModalIndex);
  }

  /* ---------------- 启动 ---------------- */
  buildBoard();
  $('cModal').addEventListener('click', (e) => {
    if (e.target === $('cModal')) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalMode) closeModal();
  });

  window.GameShell.boot({
    game: 'cabin',
    title: '林中小屋',
    blurb: '官方 Second Edition 核心机制：探索 44 间房、抽事件/物品/预兆，预兆累积后掷 6 骰触发闹鬼；按房间与预兆查剧本，叛徒与英雄按各自目标对抗。',
    rules: [
      { h: '探索', items: [
        '所有探险者从<b>入口大厅</b>开始。每回合移动点等于当前<b>速度</b>，不掷速度骰。',
        '每移动一步消耗 1 点。进入未探索的门时停下，从房间牌堆顶抽牌，选择合法方向放好并接门。',
        '进入新房间后按符号抽 <b>事件 / 物品 / 预兆</b>，抽卡即结束本回合移动。楼梯可上下楼。'
      ] },
      { h: '属性与伤害', items: [
        '四项属性：<b>速度、力量</b>（物理）与<b>知识、神智</b>（精神），各有最低、起始、最高轨道。',
        '闹鬼前属性不会低于最低值、不会死亡；闹鬼后降到骷髅线即死亡。',
        '受到物理伤害时在力量/速度间分配，精神伤害在知识/神智间分配；护甲先减物理伤害。'
      ] },
      { h: '闹鬼', items: [
        '每抽到一张预兆，回合结束时掷 6 颗骰；总点数<b>小于</b>全场预兆总数时闹鬼。',
        '用<b>触发房间 + 预兆</b>查 ' + C.SCENARIOS.length + ' 个剧本之一，剧本决定叛徒，叛徒不一定是抽预兆的人。',
        '闹鬼后同一房间的敌对角色移动额外消耗 1 点；每回合可攻击一次，双方掷同一属性，差值造成伤害。'
      ] },
      { h: '怪物与剧本', items: [
        '怪物默认不能被杀死；英雄击中怪物使其僵直并跳过下一个怪物阶段。',
        '叛徒回合结束后统一控制怪物移动与攻击；怪物按速度寻路。',
        '英雄按剧本执行仪式、逃跑、击退狼群或撑过轮数；叛徒完成反制目标。'
      ] }
    ],
    min: 3,
    max: 6,
    engine: window.CabinEngine,
    seatColor: (p, i) => SEAT[i % SEAT.length],
    seatTag: (p) => (cur && cur.haunt && cur.haunt.active && cur.players.indexOf(p) === cur.haunt.traitor ? '叛徒' : p.charName),
    onSeatClick: (p, i, st) => openPlayerInfo(st, i),
    turnPill: (st) => {
      if (!st) return '等待开始';
      if (st.phase === 'lobby') return '等待开始';
      if (st.phase === 'select') return '选角色 · ' + (st.players[st.turn] ? st.players[st.turn].name : '');
      if (st.phase === 'ended') return '已结束';
      const p = st.players[st.turn];
      if (st.pendingRoll) return '等待掷骰 · ' + (p ? p.name : '');
      return (st.haunt && st.haunt.active ? '闹鬼 · ' : '探索 · ') + (p ? p.name : '') + ' · 移动 ' + st.moves;
    },
    winnerTitle: (st) => (st.winner ? (st.winner.side === 'traitor' ? '叛徒获胜' : '英雄获胜') : '对局结束'),
    winnerSub: (st) => (st.winner ? st.winner.text : ''),
    onState: (st) => render(st),
    onMount: () => { viewFloor = 'ground'; }
  });

})();
</script>
</body>
</html>
