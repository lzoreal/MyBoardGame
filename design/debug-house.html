<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>3D 单格调试</title>
<style>
  body{margin:0;background:#eef3f4;padding:28px;font-family:sans-serif}
  .board{position:relative;width:420px;height:420px;background:#fff;padding:8px;border-radius:14px;
         display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px}
  .tile{position:relative;background:#fff;border:1px solid #e7edf0;border-radius:9px;
        display:flex;flex-direction:column;align-items:center}
  .tile .body{padding:8px 4px 0;text-align:center}
  .tile .nm{font-size:13px;font-weight:600;color:#182430}
  .tile .pr{font-size:11px;color:#9aa8b3;margin-top:2px}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
</style>
</head>
<body>
<div class="board" id="b1">
  <canvas id="fx"></canvas>
  <div class="tile" data-i="1" style="grid-area:1/1/4/4">
    <div class="body"><div class="nm">老街</div><div class="pr">$60</div></div>
  </div>
</div>
<div id="info" style="margin-top:14px;font-size:12px;color:#556"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="../js/data.js"></script>
<script src="./scene-proto.js"></script>
<script>
  const D = window.MonoData;
  const params = new URLSearchParams(location.search);
  const mode = params.get('m') || 'house';

  const state = {
    props: {},
    players: []
  };
  if (mode === 'house') {
    state.props[1] = { owner: 'a', houses: 2, mortgaged: false };
  } else if (mode === 'hotel') {
    state.props[1] = { owner: 'a', houses: 5, mortgaged: false };
  } else {
    state.players = [
      { id: 'a', color: D.COLORS[0], pos: 1, bankrupt: false },
      { id: 'b', color: D.COLORS[1], pos: 1, bankrupt: false }
    ];
  }

  const boardEl = document.getElementById('b1');
  document.getElementById('info').textContent = 'mode=' + mode + ' / tile ' + Math.round(boardEl.querySelector('.tile').clientWidth) + 'px';

  window.MonoScene.mount(document.getElementById('fx'), boardEl);
  window.MonoScene.update(state);
</script>
</body>
</html>
