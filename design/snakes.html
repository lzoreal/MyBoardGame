<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7fd0ea">
<title>蛇梯棋 · 萌趣街区</title>
<link rel="stylesheet" href="games/games.css?v=1">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="btnHome" type="button" aria-label="返回大厅">←</button>
    <div class="pill" id="roomPill">房间：—</div>
    <div class="pill round" id="turnPill">未开局</div>
    <button class="icon-btn" id="btnLog" type="button" aria-label="查看本局动态">≡</button>
  </header>

  <section class="seats" id="seatStrip" aria-label="座位"></section>

  <main class="boardWrap">
    <div class="boardInner" id="boardInner" aria-label="蛇梯棋棋盘"></div>
  </main>

  <footer class="dock">
    <div class="dockInfo" id="dockInfo"></div>
    <div class="dockActions" id="dockActions"></div>
  </footer>

  <div id="toast" role="status" aria-live="polite"></div>

  <div class="sheet hidden" id="logSheet">
    <div class="sheetCard">
      <h2>本局动态</h2>
      <p class="sub">每一次前进、爬梯、遇蛇都会记在这里</p>
      <ul class="logList"></ul>
      <div class="actions"><button class="btn ghost" id="logClose" type="button">收起</button></div>
    </div>
  </div>

  <div class="sheet hidden" id="startPanel"></div>

  <div class="winner hidden" id="winnerLayer"></div>
</div>

<script src="../js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/net.js"></script>
<script src="../js/games/snakes.js"></script>
<script src="games/shell.js"></script>
<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const E = window.SnakesEngine;
  const board = document.getElementById('boardInner');

  const M = 38;
  const CELL = 74;
  const START_Y = 812;

  let svg = null;
  let tokenLayer = null;
  let jumpLayer = null;
  let tokens = {};
  let rolling = false;
  let lastKey = '';

  function el(tag, attrs, parent) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }

  function cellCenter(n) {
    const row = Math.floor((n - 1) / 10);
    let col = (n - 1) % 10;
    if (row % 2 === 1) col = 9 - col;
    return {
      x: M + col * CELL + CELL / 2,
      y: M + (9 - row) * CELL + CELL / 2
    };
  }

  function cellRect(n) {
    const row = Math.floor((n - 1) / 10);
    let col = (n - 1) % 10;
    if (row % 2 === 1) col = 9 - col;
    return { x: M + col * CELL, y: M + (9 - row) * CELL };
  }

  /* ---------------- 棋盘 ---------------- */
  function buildBoard() {
    board.innerHTML = '';
    svg = el('svg', { viewBox: '0 0 900 900', role: 'img', 'aria-label': '蛇梯棋棋盘' });
    board.appendChild(svg);

    const defs = el('defs', {}, svg);
    const grad = el('linearGradient', { id: 'frameGrad', x1: '0', y1: '0', x2: '0', y2: '1' }, defs);
    el('stop', { offset: '0', 'stop-color': '#2e94ab' }, grad);
    el('stop', { offset: '1', 'stop-color': '#237a8e' }, grad);

    el('rect', { x: 16, y: 16, width: 868, height: 868, rx: 44, fill: 'url(#frameGrad)' }, svg);
    el('rect', { x: 26, y: 26, width: 848, height: 848, rx: 36, fill: '#fff6df' }, svg);

    for (let n = 1; n <= E.LAST; n++) {
      const r = cellRect(n);
      const row = Math.floor((n - 1) / 10);
      const alt = row % 2 === 0;
      el('rect', {
        x: r.x + 3, y: r.y + 3, width: CELL - 6, height: CELL - 6, rx: 12,
        fill: alt ? '#e9f7d6' : '#fff1cf', stroke: '#ffffff', 'stroke-width': 2.5
      }, svg);
      const label = el('text', {
        x: r.x + 12, y: r.y + 24, 'font-size': 15, 'font-weight': 700,
        fill: '#8a7a52', opacity: '.8'
      }, svg);
      label.textContent = n;
    }

    /* 梯子 */
    Object.keys(E.LADDERS).forEach((from) => {
      const a = cellCenter(Number(from));
      const b = cellCenter(Number(E.LADDERS[from]));
      el('line', {
        x1: a.x, y1: a.y, x2: b.x, y2: b.y,
        stroke: '#e0a63c', 'stroke-width': 9, opacity: '.85',
        'stroke-linecap': 'round'
      }, svg);
      const dist = Math.hypot(b.x - a.x, b.y - a.y);
      const steps = Math.max(2, Math.round(dist / 34));
      const nx = -(b.y - a.y) / dist, ny = (b.x - a.x) / dist;
      for (let i = 1; i < steps; i++) {
        const t = i / steps;
        const px2 = a.x + (b.x - a.x) * t;
        const py2 = a.y + (b.y - a.y) * t;
        el('line', {
          x1: px2 - nx * 16, y1: py2 - ny * 16,
          x2: px2 + nx * 16, y2: py2 + ny * 16,
          stroke: '#f6d79a', 'stroke-width': 4.5, opacity: '.95'
        }, svg);
      }
    });

    /* 蛇 */
    Object.keys(E.SNAKES).forEach((from, i) => {
      const a = cellCenter(Number(from));
      const b = cellCenter(Number(E.SNAKES[from]));
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      const perp = { x: -(b.y - a.y), y: b.x - a.x };
      const len = Math.hypot(perp.x, perp.y) || 1;
      const wave = (i % 2 ? 1 : -1) * Math.min(70, len * 0.22);
      const c1 = { x: mid.x + perp.x / len * wave, y: mid.y + perp.y / len * wave };
      el('path', {
        d: 'M' + a.x + ',' + a.y + ' Q' + c1.x + ',' + c1.y + ' ' + b.x + ',' + b.y,
        stroke: i % 2 ? '#8b6ad9' : '#5bb86a', 'stroke-width': 13,
        opacity: '.82', 'fill': 'none', 'stroke-linecap': 'round'
      }, svg);
      el('circle', { cx: a.x, cy: a.y, r: 15, fill: i % 2 ? '#8b6ad9' : '#5bb86a', opacity: '.9' }, svg);
      el('circle', { cx: a.x - 5, cy: a.y - 4, r: 4.5, fill: '#fff6df' }, svg);
      el('circle', { cx: a.x + 5, cy: a.y - 4, r: 4.5, fill: '#fff6df' }, svg);
    });

    /* 起点车道 */
    el('rect', {
      x: 26, y: 786, width: 300, height: 42, rx: 20, fill: 'rgba(255,255,255,.92)'
    }, svg);
    const startLabel = el('text', {
      x: 42, y: 812, 'font-size': 15, 'font-weight': 800, fill: '#5b6b87'
    }, svg);
    startLabel.textContent = '起点 · 0';

    jumpLayer = el('g', {}, svg);
    tokenLayer = el('g', {}, svg);
  }

  /* ---------------- 棋子 ---------------- */
  function ensureToken(i, player) {
    if (!tokens[i]) {
      const g = el('g', {}, tokenLayer);
      g.style.transition = 'transform .4s cubic-bezier(.2,.8,.3,1)';
      el('circle', { cx: 0, cy: 2, r: 15, fill: 'rgba(58,74,99,.22)' }, g);
      const body = el('circle', {
        cx: 0, cy: 0, r: 14, fill: E.COLORS[i] || '#3f7fe0',
        stroke: '#ffffff', 'stroke-width': 3.5
      }, g);
      el('circle', { cx: -4, cy: -4, r: 4, fill: '#ffffff', opacity: '.75' }, g);
      tokens[i] = { g: g, body: body };
    }
    const t = tokens[i];
    t.body.setAttribute('fill', player.color || E.COLORS[i] || '#3f7fe0');
    return t.g;
  }

  function tokenPoint(state, i) {
    const p = state.players[i];
    if (!p || p.pos <= 0) {
      return { x: 60 + i * 46, y: START_Y };
    }
    const c = cellCenter(Math.min(E.LAST, p.pos));
    const off = [{ x: -16, y: -16 }, { x: 16, y: -16 }, { x: 16, y: 16 }, { x: -16, y: 16 }][i] || { x: 0, y: 0 };
    return { x: c.x + off.x, y: c.y + off.y };
  }

  function renderTokens(state) {
    state.players.forEach((p, i) => {
      const g = ensureToken(i, p);
      const at = tokenPoint(state, i);
      g.style.transform = 'translate(' + at.x + 'px,' + at.y + 'px)';
    });
    for (let i = state.players.length; i < 4; i++) {
      if (tokens[i]) tokens[i].g.style.opacity = '0';
    }
  }

  /* ---------------- 骰子 ---------------- */
  const PIP = {
    1: [[1, 1]], 2: [[0, 0], [2, 2]], 3: [[0, 0], [1, 1], [2, 2]],
    4: [[0, 0], [2, 0], [0, 2], [2, 2]],
    5: [[0, 0], [2, 0], [1, 1], [0, 2], [2, 2]],
    6: [[0, 0], [2, 0], [0, 1], [2, 1], [0, 2], [2, 2]]
  };

  function diceSvg(n) {
    const pips = PIP[n] || [];
    let out = '<svg viewBox="0 0 60 60" width="40" height="40" aria-hidden="true">';
    pips.forEach((p) => {
      out += '<circle cx="' + (15 + p[0] * 15) + '" cy="' + (15 + p[1] * 15) + '" r="5.4" fill="#3a4a63"/>';
    });
    return out + '</svg>';
  }

  function setDiceFace(n) {
    const face = document.getElementById('diceFace');
    const box = document.getElementById('diceBox');
    if (!face) return;
    face.innerHTML = n ? diceSvg(n) : '<span style="color:#b6c2d3;font-weight:800">–</span>';
    if (box) {
      box.classList.remove('landed');
      void box.offsetWidth;
      box.classList.add('landed');
    }
  }

  /* ---------------- 底部栏 ---------------- */
  function renderDock(state, ctx) {
    const info = document.getElementById('dockInfo');
    const actions = document.getElementById('dockActions');
    if (!info || !actions) return;

    const cur = state.players[state.turn];
    let ttl;
    let sub;
    if (state.phase === 'ended') {
      const w = state.players.find((p) => p.id === state.winner);
      ttl = (w ? w.name : '') + ' 到达第 100 格';
      sub = '点「再来一局」重新开始';
    } else {
      ttl = (cur ? cur.name : '') + ' 的回合';
      sub = ctx.isTurn
        ? '掷骰子前进 · 梯子上、蛇下来 · 正好到 100 才赢'
        : '等对方掷骰子…';
      if (ctx.local) sub = '本机热座：轮流操作 · ' + sub;
      if (cur && cur.pos > 0) sub = '现在在 ' + cur.pos + ' 格 · ' + sub;
    }

    info.innerHTML =
      '<div class="diceBox" id="diceBox"><span class="diceFace" id="diceFace"></span></div>' +
      '<div><div class="ttl">' + ttl + '</div><div class="sub">' + sub + '</div></div>';
    setDiceFace(state.dice || null);

    actions.innerHTML = '';
    const btn = document.createElement('button');
    btn.className = 'btn primary';
    btn.type = 'button';
    btn.textContent = '掷骰子';
    btn.disabled = !(state.phase === 'playing' && ctx.isTurn);
    btn.addEventListener('click', () => rollDice(state, ctx));
    actions.appendChild(btn);
  }

  function rollDice(state, ctx) {
    if (!ctx.isTurn) { ctx.toast(ctx.local ? '本机热座：轮到下一位玩家' : '还没轮到你', true); return; }
    if (rolling) return;
    rolling = true;
    const box = document.getElementById('diceBox');
    let t = 0;
    const iv = setInterval(() => {
      setDiceFace(1 + Math.floor(Math.random() * 6));
      if (box) box.classList.add('spin');
      if (++t > 5) {
        clearInterval(iv);
        if (box) box.classList.remove('spin');
        const v = 1 + Math.floor(Math.random() * 6);
        setDiceFace(v);
        rolling = false;
        ctx.send({ type: 'roll', dice: v });
      }
    }, 80);
  }

  /* ---------------- 跳格提示 ---------------- */
  function flashJump(state) {
    if (!state.lastMove || !jumpLayer) return;
    const key = state.players.map((p) => p.pos).join(',') + '|' + (state.dice || '');
    if (key === lastKey) return;
    lastKey = key;
    const lm = state.lastMove;
    if (lm.to === lm.from) return;
    const from = cellCenter(Math.min(E.LAST, Math.max(1, lm.from)));
    const to = cellCenter(lm.to);
    const isSnake = E.SNAKES[lm.to] || E.SNAKES[lm.from];
    if (!isSnake && !E.LADDERS[lm.from]) {
      const ring = el('circle', { cx: to.x, cy: to.y, r: 20, fill: 'none', stroke: '#ffffff', 'stroke-width': 5, opacity: '.9' }, jumpLayer);
      ring.setAttribute('class', 'jumpPop');
      setTimeout(() => ring.remove(), 700);
      return;
    }
    el('circle', {
      cx: from.x, cy: from.y, r: 16, fill: 'none',
      stroke: E.LADDERS[lm.from] ? '#e0a63c' : '#8b6ad9', 'stroke-width': 5, opacity: '.95'
    }, jumpLayer).setAttribute('class', 'jumpPop');
    const ring2 = el('circle', { cx: to.x, cy: to.y, r: 20, fill: 'none', stroke: '#ffffff', 'stroke-width': 5 }, jumpLayer);
    ring2.setAttribute('class', 'jumpPop');
    setTimeout(() => { jumpLayer.innerHTML = ''; }, 900);
  }

  function injectStyle() {
    if (document.getElementById('snakeStyle')) return;
    const css = document.createElement('style');
    css.id = 'snakeStyle';
    css.textContent =
      '@keyframes jumpPopK{0%{transform:scale(.4);opacity:.95}100%{transform:scale(2.2);opacity:0}}' +
      '.jumpPop{animation:jumpPopK .7s ease-out forwards}';
    document.head.appendChild(css);
  }

  /* ---------------- 启动 ---------------- */
  injectStyle();
  buildBoard();

  window.GameShell.boot({
    game: 'snakes',
    title: '蛇梯棋',
    blurb: '2-4 人从第 0 格出发，掷骰前进：踩到梯子就向上爬，碰到蛇头会被带回蛇尾，正好走到第 100 格才算赢。',
    min: 2,
    max: 4,
    engine: E,
    turnPill: (s) => '第 ' + (s.round || 1) + ' 轮',
    seatTag: (p) => (typeof p.pos === 'number' ? (p.pos >= E.LAST ? '到达' : p.pos + ' 格') : ''),
    winnerTitle: (s) => {
      const w = s.players.find((p) => p.id === s.winner);
      return (w ? w.name : '玩家') + ' 到达终点';
    },
    winnerSub: (s) => '共 ' + (s.round || 1) + ' 轮 · 可以再来一局',
    onState: function (state, ctx) {
      renderTokens(state);
      if (state.phase === 'lobby') return;
      renderDock(state, ctx);
      flashJump(state);
    }
  });
})();
</script>
</body>
</html>
