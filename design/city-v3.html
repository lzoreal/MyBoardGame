<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Q版大富翁 · 原型 v4</title>
<style>
  :root{
    --ink:#4a4234; --dim:#8a7a5c; --cream:#fdf6e3; --creamLine:#ecd9b0;
    --panel:#3d4356; --panel2:#33384a; --gold:#ffc23c; --red:#ef5b4c; --blue:#5aa9ff; --green:#57b76e;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    overflow:hidden;color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:
      radial-gradient(circle at 18% 12%,rgba(255,255,255,.5) 0 2px,transparent 3px),
      radial-gradient(circle at 72% 8%,rgba(255,255,255,.5) 0 2px,transparent 3px),
      radial-gradient(circle at 88% 62%,rgba(255,255,255,.45) 0 2px,transparent 3px),
      radial-gradient(circle at 30% 88%,rgba(255,255,255,.45) 0 2px,transparent 3px),
      radial-gradient(1200px 900px at 50% 30%,#cdea9f 0%,#b6e08c 42%,#9ed177 100%);
  }

  .app{height:100%;display:grid;padding:10px;gap:8px;}
  .app.mobile{grid-template-rows:44px 1fr 94px;grid-template-columns:1fr;
    grid-template-areas:"top" "stage" "foot";}
  .app.desktop{grid-template-columns:1fr 300px;grid-template-rows:44px 1fr;
    grid-template-areas:"top top" "stage side";}

  .top{grid-area:top;display:flex;align-items:center;gap:10px;}
  .ico{width:34px;height:34px;border:0;border-radius:50%;cursor:pointer;
    background:linear-gradient(180deg,#fff,#efe6cf);box-shadow:0 3px 0 #d8c9a8,0 4px 10px rgba(90,80,50,.18);
    font:800 13px/1 inherit;color:#8a7a5c;display:grid;place-items:center;}
  .title{flex:1;text-align:center;font:800 15px/1 inherit;color:#5c6b45;text-shadow:0 1px 0 rgba(255,255,255,.6);}
  .roomChip{background:rgba(255,255,255,.75);border-radius:999px;padding:5px 12px;font-size:11px;font-weight:700;color:#6b7a55;}

  .stage{grid-area:stage;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .boardBox{position:relative;overflow:hidden;}
  #board{position:absolute;left:0;top:0;width:100%;height:100%;display:block;}

  /* 中央面板组 */
  .cpanel{position:absolute;left:9.7%;top:9.7%;width:80.6%;height:80.6%;
    display:flex;flex-direction:column;gap:10px;z-index:5;justify-content:stretch;}
  .pbox{flex:1.15;display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,#4a5064,#3a3f52);border-radius:16px;padding:9px;
    box-shadow:0 6px 0 rgba(30,34,46,.45),0 10px 18px rgba(50,60,40,.28),inset 0 1px 0 rgba(255,255,255,.14);}
  .prow{flex:1;display:flex;align-items:center;gap:9px;border-radius:12px;padding:4px 10px;margin-bottom:0;
    background:linear-gradient(180deg,#e8564a,#cf4136);position:relative;overflow:hidden;}
  .prow:last-child{margin-bottom:0;}
  .prow.on{box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 0 6px rgba(0,0,0,.18);}
  .prow .trail{position:absolute;right:0;top:0;bottom:0;width:26px;
    background:linear-gradient(90deg,transparent,rgba(0,0,0,.22));}
  .prow .ava{width:26px;height:26px;border-radius:50%;background:#ffe0c4;display:grid;place-items:center;
    font-size:12px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);}
  .prow .nm{font:800 14px/1 inherit;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.2);}
  .prow .cash{margin-left:auto;font:800 17px/1 inherit;color:#fff;}

  .cardbox{flex:1;background:linear-gradient(180deg,#4a5064,#3a3f52);border-radius:16px;padding:9px;
    display:flex;gap:8px;align-items:center;justify-content:center;
    box-shadow:0 6px 0 rgba(30,34,46,.45),inset 0 1px 0 rgba(255,255,255,.14);}
  .tcard{flex:1;height:100%;border-radius:10px;display:grid;place-items:center;position:relative;
    box-shadow:0 3px 0 rgba(0,0,0,.18);}
  .tcard.a{background:linear-gradient(180deg,#ffffff,#e9e2d2);}
  .tcard.a .q{font:900 34px/1 inherit;color:#7b5bd6;}
  .tcard.b{background:linear-gradient(180deg,#f2705f,#d84a3b);}
  .tcard.b .q{font:900 30px/1 inherit;color:#fff4d8;}
  .cardsub{position:absolute;bottom:4px;font:700 8px/1 inherit;letter-spacing:1px;color:rgba(0,0,0,.42);}
  .tcard.b .cardsub{color:rgba(255,255,255,.7);}

  .dicebox{flex:0.85;background:linear-gradient(180deg,#4a5064,#3a3f52);border-radius:16px;padding:10px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    box-shadow:0 6px 0 rgba(30,34,46,.45),inset 0 1px 0 rgba(255,255,255,.14);}
  .turnWho{font:800 13px/1.4 inherit;color:#fff;text-align:center;}
  .turnWho small{display:block;font:600 10px/1.6 inherit;color:#b9c0d4;letter-spacing:1px;}
  .diceHint{font:700 10px/1 inherit;color:#8e97ad;letter-spacing:1px;}
  .diceFace{width:58px;height:58px;border-radius:12px;background:linear-gradient(160deg,#fff,#e6e0d0);
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px;gap:2px;
    box-shadow:0 4px 0 #c9c1ad,0 7px 12px rgba(0,0,0,.28);cursor:pointer;}
  .diceFace i{display:block;border-radius:50%;}
  .diceFace i.on{background:#d8452f;}

  /* 行动按钮 */
  .actions{display:flex;flex-direction:column;gap:8px;flex:1;}
  .app.mobile .actions{flex-direction:row;align-items:stretch;max-width:none;}
  .app.mobile .actions .btnMain{flex:3;max-width:none;width:auto;}
  .app.mobile .actions .btnRow{flex:2;}
  .btnMain{border:0;cursor:pointer;border-radius:999px;padding:13px 0;
    font:800 16px/1 inherit;color:#fff;background:linear-gradient(180deg,#6cc0ff,#3d8ef0);
    box-shadow:0 5px 0 #2c6fc0,0 9px 16px rgba(61,142,240,.35);}
  .btnMain:active{transform:translateY(3px);box-shadow:0 2px 0 #2c6fc0;}
  .btnRow{display:flex;gap:8px;}
  .btnS{flex:1;border:0;cursor:pointer;border-radius:999px;padding:10px 0;
    font:800 13px/1 inherit;color:#7a6c4e;background:linear-gradient(180deg,#fff,#efe6cf);
    box-shadow:0 4px 0 #d8c9a8;}

  .foot{grid-area:foot;display:flex;gap:8px;align-items:center;}
  .side{grid-area:side;display:none;flex-direction:column;gap:10px;justify-content:flex-start;padding-top:4px;}
  .app.desktop .side{display:flex;}
  .app.desktop .foot{display:none;}
  .app.desktop .cpanel{position:static;margin-top:0;}
  .app.mobile .side{display:none;}

  .log{background:rgba(255,255,255,.8);border-radius:14px;padding:8px 10px;font-size:11px;color:#7b8a63;line-height:1.7;
    box-shadow:0 3px 0 rgba(160,175,130,.35);overflow:auto;flex:1;}
  .log b{color:#4a4234;font-weight:700;}
</style>
</head>
<body>

<div class="app mobile" id="app">
  <header class="top">
    <button class="ico" title="暂停">❚❚</button>
    <div class="title" id="roundTitle">第 3 回合</div>
    <span class="roomChip">Q7M2Q</span>
    <button class="ico" id="btnLayout" title="电脑版另行设计" style="display:none">▭</button>
  </header>

  <main class="stage" id="stage">
    <div class="boardBox" id="box"><canvas id="board"></canvas></div>
  </main>

  <footer class="foot" id="foot"></footer>
  <aside class="side" id="side"></aside>
</div>

<!-- 中央面板组：手机版叠在棋盘中央，电脑版进右侧栏 -->
<div class="cpanel" id="cpanel" style="display:none">
  <div class="pbox" id="pbox"></div>
  <div class="cardbox">
    <div class="tcard a"><span class="q">?</span><span class="cardsub">机会</span></div>
    <div class="tcard b"><span class="q">奖</span><span class="cardsub">命运</span></div>
  </div>
  <div class="dicebox">
    <div class="turnWho" id="turnWho">阿婆<small>轮到你了</small></div>
    <div class="diceFace" id="dice"></div>
    <div class="diceHint">点击掷骰子</div>
  </div>
</div>

<div class="actions" id="actions" style="display:none">
  <button class="btnMain" id="roll">掷骰子</button>
  <div class="btnRow"><button class="btnS">我的地产</button><button class="btnS">交易</button></div>
</div>

<script>window.__err=[];window.addEventListener("error",function(e){window.__err.push((e.message||"")+" @"+(e.filename||"")+":"+e.lineno);});</script>
<script src="../js/data.js"></script>
<script>
(function () {
  const D = window.MonoData, TILES = D.TILES, GROUPS = D.GROUPS;

  const COL = {
    cream:'#fdf6e3', creamLine:'#e8d4a8', cream2:'#fbf0d6', name:'#8a7a5c',
    ink:'#4a4234', panel:'#3d4356'
  };
  const TYPEC = { go:'#57b76e', rail:'#5aa9ff', chance:'#54b7e8', chest:'#9b6ce0',
    tax:'#ef5b4c', jail:'#4b6ea8', free:'#57b76e', gotojail:'#ef5b4c', util:'#3fbfae' };

  const cvs = document.getElementById('board');
  const ctx = cvs.getContext('2d');
  const stage = document.getElementById('stage');
  let S = 480, CELL = 44, OX = 0, OY = 0, DPR = 1, MODE = 'mobile';

  /* ---------- 矩形工具 ---------- */
  function rr(x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function hex2rgb(h) {
    const n = parseInt(h.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function mix(h, k) {
    const [r, g, b] = hex2rgb(h);
    return 'rgb(' + Math.round(r + (255 - r) * k) + ',' + Math.round(g + (255 - g) * k) + ',' + Math.round(b + (255 - b) * k) + ')';
  }
  function dark(h, k) {
    const [r, g, b] = hex2rgb(h);
    return 'rgb(' + Math.round(r * (1 - k)) + ',' + Math.round(g * (1 - k)) + ',' + Math.round(b * (1 - k)) + ')';
  }

  /* ---------- 状态 ---------- */
  let _state = null;
  function mock() {
    const players = [
      { name:'阿婆', color:'#ef5b4c', cash:1500, pos:0,  avatar:'🐣' },
      { name:'老王', color:'#e6a01e', cash:2000, pos:16, avatar:'🐻' },
      { name:'小李', color:'#3d8ef0', cash:2300, pos:27, avatar:'🐱' }
    ];
    const props = {};
    const hs = { 1:2, 3:1, 6:3, 8:2, 9:5, 12:1, 14:2, 16:1, 21:2, 24:3, 27:1, 29:2, 32:4, 34:1, 37:3, 39:2 };
    Object.keys(hs).forEach(function (k, idx) { props[k] = { houses:hs[k], owner:idx % 3 }; });
    return { players, props, turn:0, round:3 };
  }

  /* ---------- 格子坐标 ---------- */
  function cellOf(i) {
    if (i <= 10) return { r:11, c:11 - i };
    if (i <= 20) return { r:11 - (i - 10), c:1 };
    if (i <= 30) return { r:1, c:i - 19 };
    return { r:1 + (i - 30), c:11 };
  }

  /* ---------- 建筑 ---------- */
  function house(cx, by, w, lvl, col) {
    const bh = w * 0.62, rw = w * 0.94;
    ctx.fillStyle = 'rgba(120,110,80,.22)';
    ctx.beginPath(); ctx.ellipse(cx, by - 1, w * 0.4, w * 0.1, 0, 0, 6.2832); ctx.fill();

    const bodyW = w * 0.74, bodyTop = by - bh;
    rr(cx - bodyW / 2, bodyTop, bodyW, bh, Math.max(2, w * 0.08));
    const gd = ctx.createLinearGradient(0, bodyTop, 0, by);
    gd.addColorStop(0, mix(col, .55)); gd.addColorStop(1, mix(col, .3));
    ctx.fillStyle = gd; ctx.fill();

    if (lvl >= 3) {
      const upW = bodyW * 0.76, upH = bh * 0.52;
      rr(cx - upW / 2, bodyTop - upH * 0.8, upW, upH, Math.max(2, w * 0.06));
      ctx.fillStyle = mix(col, .66); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      const ww = upW * 0.2, wh = upH * 0.3;
      for (let k = -1; k <= 1; k++) { rr(cx + k * upW * 0.3 - ww / 2, bodyTop - upH * 0.62, ww, wh, 1.5); ctx.fill(); }
    }

    // 屋顶
    const roofH = w * 0.3, roofY = bodyTop - (lvl >= 3 ? bh * 0.55 : 0);
    const rg = ctx.createLinearGradient(0, roofY - roofH, 0, roofY);
    rg.addColorStop(0, dark(col, .1)); rg.addColorStop(1, dark(col, .34));
    ctx.beginPath();
    ctx.moveTo(cx - rw / 2, roofY);
    ctx.quadraticCurveTo(cx, roofY - roofH, cx + rw / 2, roofY);
    ctx.closePath();
    ctx.fillStyle = rg; ctx.fill();

    // 门
    const dw = bodyW * 0.26, dh = bh * 0.44;
    rr(cx - dw / 2, by - dh, dw, dh, Math.max(1.5, dw * 0.25));
    ctx.fillStyle = '#a0743f'; ctx.fill();
    if (lvl >= 2) {
      ctx.fillStyle = 'rgba(255,255,255,.8)';
      const ww2 = bodyW * 0.18, wh2 = bh * 0.24;
      rr(cx - bodyW * 0.32 - ww2 / 2, by - bh * 0.8, ww2, wh2, 1.5); ctx.fill();
      rr(cx + bodyW * 0.32 - ww2 / 2, by - bh * 0.8, ww2, wh2, 1.5); ctx.fill();
    }
    if (lvl >= 5) {
      ctx.strokeStyle = '#ffd15c'; ctx.lineWidth = Math.max(1, w * 0.05);
      ctx.beginPath(); ctx.moveTo(cx, roofY - roofH * 0.9); ctx.lineTo(cx, roofY - roofH * 1.9); ctx.stroke();
      ctx.fillStyle = '#ef5b4c';
      ctx.beginPath();
      ctx.moveTo(cx, roofY - roofH * 1.9);
      ctx.lineTo(cx + w * 0.2, roofY - roofH * 1.6);
      ctx.lineTo(cx, roofY - roofH * 1.3);
      ctx.closePath(); ctx.fill();
    }
  }

  function treeIcon(cx, by, w) {
    ctx.fillStyle = 'rgba(120,110,80,.2)';
    ctx.beginPath(); ctx.ellipse(cx, by - 1, w * 0.26, w * 0.07, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#a5764a';
    ctx.fillRect(cx - w * 0.05, by - w * 0.28, w * 0.1, w * 0.28);
    const cy = by - w * 0.44;
    const g = ctx.createRadialGradient(cx - w * .1, cy - w * .1, 1, cx, cy, w * .4);
    g.addColorStop(0, '#a9e79b'); g.addColorStop(1, '#5fbf68');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, w * 0.34, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(cx - w * 0.2, cy + w * 0.03, w * 0.2, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + w * 0.2, cy + w * 0.04, w * 0.18, 0, 6.2832); ctx.fill();
  }

  /* ---------- Q版小人棋子 ---------- */
  function person(cx, by, w, col, face) {
    ctx.fillStyle = 'rgba(90,80,60,.22)';
    ctx.beginPath(); ctx.ellipse(cx, by - 1, w * 0.34, w * 0.1, 0, 0, 6.2832); ctx.fill();

    // 身体
    const bw = w * 0.52, bh = w * 0.4;
    rr(cx - bw / 2, by - bh, bw, bh, w * 0.16);
    ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = Math.max(1, w * 0.035); ctx.stroke();

    // 头
    const hr = w * 0.3, hy = by - bh - hr * 0.86;
    ctx.beginPath(); ctx.arc(cx, hy, hr, 0, 6.2832);
    ctx.fillStyle = '#ffe2c4'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = Math.max(1, w * 0.04); ctx.stroke();

    // 头发/帽子
    ctx.beginPath();
    ctx.arc(cx, hy + hr * 0.1, hr * 1.02, Math.PI * 1.05, Math.PI * 1.95);
    ctx.closePath();
    ctx.fillStyle = dark(col, .05); ctx.fill();

    // 眼睛
    ctx.fillStyle = '#3a3226';
    const ew = Math.max(1, hr * 0.16);
    ctx.beginPath(); ctx.arc(cx - hr * 0.36, hy + hr * 0.06, ew, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + hr * 0.36, hy + hr * 0.06, ew, 0, 6.2832); ctx.fill();

    // 腮红
    ctx.fillStyle = 'rgba(255,140,120,.45)';
    ctx.beginPath(); ctx.arc(cx - hr * 0.56, hy + hr * 0.38, ew * 1.4, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + hr * 0.56, hy + hr * 0.38, ew * 1.4, 0, 6.2832); ctx.fill();
  }

  /* ---------- 格子 ---------- */
  function drawTile(i) {
    const t = TILES[i], rc = cellOf(i);
    const gx = OX + (rc.c - 1) * CELL, gy = OY + (rc.r - 1) * CELL;
    const pad = Math.max(2, CELL * 0.055);
    const x = gx + pad, y = gy + pad, w = CELL - pad * 2, h = CELL - pad * 2;
    const cx = x + w / 2;
    const isProp = t.type === 'prop';
    const base = isProp ? COL.cream : (TYPEC[t.type] || COL.cream);

    // 卡片
    ctx.save();
    ctx.shadowColor = 'rgba(80,70,40,.28)';
    ctx.shadowBlur = CELL * 0.12;
    ctx.shadowOffsetY = CELL * 0.05;
    rr(x, y, w, h, CELL * 0.16);
    if (isProp) {
      const g = ctx.createLinearGradient(0, y, 0, y + h);
      g.addColorStop(0, '#fffdf4'); g.addColorStop(1, COL.cream2);
      ctx.fillStyle = g;
    } else {
      const g = ctx.createLinearGradient(0, y, 0, y + h);
      g.addColorStop(0, mix(base, .35)); g.addColorStop(1, mix(base, .1));
      ctx.fillStyle = g;
    }
    ctx.fill();
    ctx.restore();
    const own = isProp && _state.props[i] && _state.props[i].owner != null
      ? _state.players[_state.props[i].owner].color : null;
    rr(x, y, w, h, CELL * 0.16);
    ctx.strokeStyle = own || (isProp ? COL.creamLine : 'rgba(255,255,255,.55)');
    ctx.lineWidth = Math.max(1, CELL * (own ? 0.055 : 0.035));
    ctx.stroke();

    const len = t.name.length;
    const twoLine = len >= 4;
    const labelH = twoLine ? h * 0.36 : h * 0.22;
    const contentBottom = y + h - labelH;

    if (isProp) {
      // 组色条
      const gc = (GROUPS[t.group] || {}).color || '#cfe0f5';
      rr(x + w * 0.12, y + h * 0.07, w * 0.76, h * 0.065, h * 0.03);
      ctx.fillStyle = gc; ctx.fill();

      const p = _state.props[i];
      const lvl = p ? p.houses : 0;
      const baseY = contentBottom + labelH * 0.1;
      const hw = Math.min(w * 0.8, (contentBottom - y) * 1.15);
      if (lvl === 0) {
        treeIcon(cx, baseY, Math.min(w * 0.58, (contentBottom - y) * 0.9));
      } else {
        house(cx, baseY, hw, lvl, gc);
      }
    } else {
      const avail = contentBottom - y - h * 0.08;
      iconBadge(t, cx, y + h * 0.08 + avail * 0.55, Math.min(w * 0.38, avail * 0.46));
    }

    // 名字：4 字拆两行，字号才能做大
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (twoLine) {
      const fs2 = Math.max(8, Math.round(CELL * 0.17));
      ctx.font = '800 ' + fs2 + 'px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = isProp ? COL.name : '#fff';
      if (!isProp) { ctx.shadowColor = 'rgba(0,0,0,.22)'; ctx.shadowBlur = 3; }
      const ly = y + h - labelH * 0.66;
      ctx.fillText(t.name.slice(0, 2), cx, ly);
      ctx.fillText(t.name.slice(2, 4), cx, ly + fs2 * 1.02);
      ctx.shadowBlur = 0;
      return;
    }
    const fs = Math.max(8, Math.round(CELL * (len === 3 ? 0.155 : 0.175)));
    ctx.font = '800 ' + fs + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    if (isProp) {
      ctx.fillStyle = COL.name;
      ctx.fillText(t.name, cx, y + h - labelH * 0.52);
    } else {
      ctx.fillStyle = '#fff';
      ctx.shadowColor = 'rgba(0,0,0,.22)'; ctx.shadowBlur = 3;
      ctx.fillText(t.name, cx, y + h - labelH * 0.52);
      ctx.shadowBlur = 0;
    }
  }

  function iconBadge(t, cx, cy, s) {
    const w = s * 2;
    ctx.save();
    rr(cx - s, cy - s * 0.86, s * 2, s * 1.72, s * 0.42);
    ctx.fillStyle = 'rgba(255,255,255,.94)';
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = TYPEC[t.type] || '#888';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    let ch = '?';
    if (t.type === 'go') ch = 'GO';
    else if (t.type === 'rail') ch = '🚂';
    else if (t.type === 'chance') ch = '?';
    else if (t.type === 'chest') ch = '★';
    else if (t.type === 'tax') ch = '$';
    else if (t.type === 'jail') ch = '🚔';
    else if (t.type === 'free') ch = 'P';
    else if (t.type === 'gotojail') ch = '→';
    else if (t.type === 'util') ch = '💡';
    ctx.font = '800 ' + Math.round(s * (ch.length > 1 ? 0.72 : 1.1)) + 'px "PingFang SC","Apple Color Emoji",sans-serif';
    ctx.fillText(ch, cx, cy + s * 0.02);
  }

  /* ---------- 主绘制 ---------- */
  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, S, S);

    for (let i = 0; i < 40; i++) drawTile(i);

    // 棋子
    _state.players.forEach((p, idx) => {
      const rc = cellOf(p.pos);
      const gx = OX + (rc.c - 1) * CELL, gy = OY + (rc.r - 1) * CELL;
      const off = (idx - (_state.players.length - 1) / 2) * CELL * 0.28;
      person(gx + CELL / 2 + off, gy + CELL * 0.92, CELL * 0.76, p.color, p.avatar);
    });
  }

  /* ---------- 布局 ---------- */
  /* 固定绘制分辨率：画布始终 1100×1100，由 CSS 等比缩放到容器，避免任何缩放错位 */
   const VW = 1100;
  let DRAWN = false;

  function layout() {
    try { return doLayout(); } catch (e) {
      document.getElementById('roundTitle').textContent = 'ERR ' + (e && e.message);
      var st = document.getElementById('stage');
      if (st) st.style.outline = '3px solid red';
    }
  }
  function doLayout() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const isDesk = MODE === 'desktop';
    const availW = isDesk ? vw - 300 - 34 : vw - 20;
    const availH = isDesk ? vh - 44 - 34 : vh - 44 - 94 - 24;
    const side = Math.max(220, Math.floor(Math.min(availW, availH)));

    const box = document.getElementById('box');
    box.style.width = side + 'px';
    box.style.height = side + 'px';

    if (!DRAWN) {
      S = VW; CELL = VW / 11; OX = 0; OY = 0; DPR = 1;
      cvs.width = VW;
      cvs.height = VW;
      draw();
      DRAWN = true;
    }
  }

  function placePanel() { /* 面板位置交给 CSS 百分比，无需计算 */ }

  /* ---------- HUD ---------- */
  const PIPS = { 1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8] };
  let diceVal = 6;
  function renderDice(v) {
    diceVal = v;
    const el = document.getElementById('dice');
    el.innerHTML = '';
    const on = PIPS[v] || [4];
    for (let k = 0; k < 9; k++) {
      const i = document.createElement('i');
      if (on.indexOf(k) >= 0) i.className = 'on';
      el.appendChild(i);
    }
  }
  function renderMoney() {
    const box = document.getElementById('pbox');
    box.innerHTML = '';
    _state.players.forEach((p, i) => {
      const row = document.createElement('div');
      row.className = 'prow' + (i === _state.turn ? ' on' : '');
      row.style.background = 'linear-gradient(180deg,' + mix(p.color, .12) + ',' + dark(p.color, .18) + ')';
      row.innerHTML = '<span class="ava">' + p.avatar + '</span><span class="nm">' + p.name + '</span><span class="cash">' + p.cash + '</span><span class="trail"></span>';
      box.appendChild(row);
    });
    document.getElementById('turnWho').innerHTML = _state.players[_state.turn].name + '<small>轮到你了</small>';
  }
  function roll() {
    const v = 1 + Math.floor(Math.random() * 6);
    renderDice(v);
    document.getElementById('roundTitle').textContent = '第 ' + _state.round + ' 回合 · ' + v + ' 点';
  }

  /* ---------- 组装 ---------- */
  function applyMode(mode) {
    MODE = mode;
    const app = document.getElementById('app');
    app.className = 'app ' + mode;
    const cp = document.getElementById('cpanel');
    const act = document.getElementById('actions');
    const foot = document.getElementById('foot');
    const side = document.getElementById('side');
    foot.innerHTML = '';
    side.innerHTML = '';

    if (mode === 'mobile') {
      cp.style.display = '';
      cp.style.position = 'absolute';
      document.getElementById('box').appendChild(cp);
      act.style.display = '';
      foot.appendChild(act);
    } else {
      cp.style.display = '';
      cp.style.position = 'static';
      cp.style.width = '100%';
      cp.style.height = 'auto';
      side.appendChild(cp);
      act.style.display = '';
      side.appendChild(act);
      const log = document.createElement('div');
      log.className = 'log';
      log.innerHTML = '<b>动态</b><br>· 老王 掷出 4 点<br>· 小李 买下 珠江路 $320<br>· 阿婆 建了一栋房子<br>· 游戏进行中…';
      side.appendChild(log);
    }
    setTimeout(layout, 0);
    setTimeout(layout, 120);
    setTimeout(layout, 420);
  }

  /* ---------- 启动 ---------- */
  _state = mock();
  renderDice(6);
  renderMoney();
  applyMode('mobile');

  document.getElementById('roll').addEventListener('click', roll);
  document.getElementById('dice').addEventListener('click', roll);
  document.getElementById('btnLayout').addEventListener('click', function () {
    applyMode(MODE === 'mobile' ? 'desktop' : 'mobile');
  });

  let rt = null;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(layout, 120);
  });
  if (window.ResizeObserver) {
    let ot = null;
    new ResizeObserver(function () {
      clearTimeout(ot);
      ot = setTimeout(layout, 80);
    }).observe(stage);
  }
})();
</script>
</body>
</html>
