<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>大富翁 · 插画棋盘（2.5D）</title>
<link rel="stylesheet" href="board2d.css?v=5">
</head>
<body>
<div class="app mobile" id="app">
  <div class="bgart" aria-hidden="true"></div>

  <header class="topbar">
    <button class="ico" id="btnHome">&#8962;</button>
    <div class="room">房间：A12345</div>
    <button class="rnd" id="btnLog">日志</button>
  </header>

  <aside class="players" id="players"></aside>

  <main class="boardWrap" id="boardWrap">
    <div class="boardInner" id="boardInner">
      <svg id="boardSvg" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="tokens" id="tokens"></div>
    </div>
  </main>

  <footer class="hud">
    <div class="turnCard">
      <div class="av" id="turnAv"></div>
      <div class="tv">
        <b id="turnName">—</b>
        <span id="turnHint">掷骰子，前进吧！</span>
        <div class="timer"><i id="timerFill"></i></div>
      </div>
      <div class="tsec" id="timerTxt">30s</div>
    </div>
    <div class="rollRow">
      <div class="dicePed"><div class="diceWrap"><canvas id="diceCv"></canvas></div></div>
      <div class="actions" id="actions"></div>
    </div>
    <div class="locCard">
      <div class="lic" id="locIc"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 11.2 12 3.6l9 7.6" fill="none" stroke="#2f7fe8" stroke-width="2.2" stroke-linecap="round"/><rect x="6.2" y="10.6" width="11.6" height="9.4" rx="1.6" fill="#8fd0ff"/><rect x="9.4" y="13.2" width="5.2" height="6.8" rx="1" fill="#fff"/></svg></div>
      <div class="lv"><b id="locName">当前位置：起点</b><span id="locTip">经过或停留领 $200</span></div>
      <button class="mini" id="btnProps">我的地产</button>
    </div>
  </footer>

  <div class="popCard" id="popCard"></div>
  <div class="toast" id="toast"></div>

  <div class="sheet" id="logSheet">
    <div class="sheetHead"><b>行动日志</b><button class="x" id="logClose">✕</button></div>
    <div class="logList" id="logList"></div>
  </div>

  <div class="sheet" id="propSheet">
    <div class="sheetHead"><b>我的地产</b><button class="x" id="propClose">✕</button></div>
    <div class="logList" id="propList"></div>
  </div>
</div>
<pre id="dbg"></pre>

<script src="assets/lib/three.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/engine.js"></script>
<script>
(function () {
  const D = window.MonoData, ENG = window.MonoEngine;
  const TILES = D.TILES, GROUPS = D.GROUPS;
  const dbgEl = document.getElementById('dbg');
  const log = function (s) { dbgEl.textContent += s + '\n'; };
  window.addEventListener('error', function (e) { log('ERR ' + e.message + ' @' + e.lineno); });

  /* ---------- 棋盘几何：40 格沿 11×11 外环铺开（等距投影） ---------- */
  const CELL = 88, N = 11, BOARD = CELL * N, PW = 78;
  const AX = 0.76, AY = 0.6;
  function iso(x, y) { return { x: AX * (x - y), y: AY * (x + y) }; }
  function cellRect(i) {
    if (i === 0) return { x: BOARD - CELL, y: BOARD - CELL, w: CELL, h: CELL };
    if (i === 10) return { x: 0, y: BOARD - CELL, w: CELL, h: CELL };
    if (i === 20) return { x: 0, y: 0, w: CELL, h: CELL };
    if (i === 30) return { x: BOARD - CELL, y: 0, w: CELL, h: CELL };
    if (i < 10) return { x: BOARD - CELL - i * CELL, y: BOARD - PW, w: CELL, h: PW };
    if (i < 20) return { x: 0, y: BOARD - CELL - (i - 10) * CELL, w: PW, h: CELL };
    if (i < 30) return { x: (i - 20) * CELL, y: 0, w: CELL, h: PW };
    return { x: BOARD - PW, y: (i - 30) * CELL, w: PW, h: CELL };
  }
  function cellCenter(i) {
    const r = cellRect(i);
    return iso(r.x + r.w / 2, r.y + r.h / 2);
  }

  /* ---------- 颜色 ---------- */
  function typeColor(t) {
    return ({ go: '#49b06a', rail: '#4a8fdd', util: '#2bb3a3', chance: '#3ea8dd',
      chest: '#8457cf', tax: '#e0574a', jail: '#4d6383', free: '#49b06a',
      gotojail: '#e0574a' })[t] || '#c9c2b0';
  }
  const TYPE_ICON = { go: 'GO', rail: '车', util: '水电', chance: '机会', chest: '命运', tax: '税', jail: '监狱', free: '停车', gotojail: '入狱' };
  function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const f = function (v) { return Math.max(0, Math.min(255, Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k))); };
    return ((f(r) << 16) | (f(g) << 8) | f(b)).toString(16).padStart(6, '0');
  }

  /* ---------- 视图框 ---------- */
  const corners = [iso(0, 0), iso(BOARD, 0), iso(0, BOARD), iso(BOARD, BOARD)];
  const minX = Math.min.apply(null, corners.map(function (c) { return c.x; })) - 70;
  const maxX = Math.max.apply(null, corners.map(function (c) { return c.x; })) + 70;
  const minY = Math.min.apply(null, corners.map(function (c) { return c.y; })) - 70;
  const maxY = Math.max.apply(null, corners.map(function (c) { return c.y; })) + 70;
  const VB = { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
  document.getElementById('boardInner').style.aspectRatio = VB.w + ' / ' + VB.h;

  /* ---------- 头像 ---------- */
  function avatarSVG(color, skin, hat) {
    return '<svg viewBox="0 0 40 40">' +
      '<circle cx="20" cy="20" r="20" fill="#fff"/>' +
      '<circle cx="20" cy="22" r="13.5" fill="' + skin + '"/>' +
      '<path d="M6 19c0-8 6-13 14-13s14 5 14 13z" fill="' + hat + '"/>' +
      '<rect x="3.4" y="18" width="33" height="4.6" rx="2.3" fill="' + hat + '"/>' +
      '<circle cx="15" cy="23" r="2.1" fill="#2b3550"/>' +
      '<circle cx="25" cy="23" r="2.1" fill="#2b3550"/>' +
      '<circle cx="11.8" cy="26.6" r="2.3" fill="#ff9d8f" opacity=".55"/>' +
      '<circle cx="28.2" cy="26.6" r="2.3" fill="#ff9d8f" opacity=".55"/>' +
      '<path d="M17 28.4c1.5 1.5 4.5 1.5 6 0" stroke="#2b3550" stroke-width="1.3" fill="none" stroke-linecap="round"/>' +
      '<path d="M8 40c2-7 7.5-10 12-10s20 3 12 10z" fill="' + color + '"/>' +
      '</svg>';
  }
  const FACES = [
    avatarSVG('#ef5b4c', '#ffe0c2', '#f2c94c'),
    avatarSVG('#3d8ef0', '#ffdcc0', '#2b3550'),
    avatarSVG('#57c06a', '#ffe4c8', '#7a4a2c'),
    avatarSVG('#e6a01e', '#ffe0c2', '#4a3a26')
  ];
  const FACE_OF = function (i) { return FACES[i % 4] || FACES[0]; };

  /* 小房子图标（屏幕空间直立绘制） */
  function houseIcon(cx, cy, w, body, roof) {
    const hh = w * 0.6, r = w * 0.46;
    return '<g>' +
      '<ellipse cx="' + cx.toFixed(1) + '" cy="' + (cy + 1).toFixed(1) + '" rx="' + (w * 0.5).toFixed(1) + '" ry="' +
      (w * 0.15).toFixed(1) + '" fill="#2f4a20" opacity=".22"/>' +
      '<rect x="' + (cx - w / 2).toFixed(1) + '" y="' + (cy - hh).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' +
      hh.toFixed(1) + '" rx="' + (w * 0.09).toFixed(1) + '" fill="' + body + '" stroke="#ffffff" stroke-width="' +
      (w > 46 ? 2.4 : 2) + '"/>' +
      '<path d="M' + (cx - w / 2 - w * 0.08).toFixed(1) + ',' + (cy - hh).toFixed(1) + ' L' + cx.toFixed(1) + ',' +
      (cy - hh - r).toFixed(1) + ' L' + (cx + w / 2 + w * 0.08).toFixed(1) + ',' + (cy - hh).toFixed(1) + ' Z" fill="' +
      roof + '" stroke="#ffffff" stroke-width="' + (w > 46 ? 2.4 : 2) + '"/>' +
      '<rect x="' + (cx - w * 0.09).toFixed(1) + '" y="' + (cy - hh * 0.62).toFixed(1) + '" width="' + (w * 0.18).toFixed(1) +
      '" height="' + (hh * 0.62).toFixed(1) + '" rx="1" fill="#ffffff" opacity=".8"/>' +
      '</g>';
  }

  /* ---------- 画棋盘 ---------- */
  function buildBoard() {
    const M = 'matrix(' + AX + ',' + AY + ',' + (-AX) + ',' + AY + ',0,0)';
    const det = 2 * AX * AY;
    const inv = 'matrix(' + (AY / det).toFixed(4) + ',' + (-AY / det).toFixed(4) + ',' +
      (AX / det).toFixed(4) + ',' + (AX / det).toFixed(4) + ',0,0)';
    let s = '';

    s += '<defs>' +
      '<pattern id="grassPat" width="150" height="150" patternUnits="userSpaceOnUse">' +
      '<image href="assets/tex/grass.png" width="150" height="150" preserveAspectRatio="none"/></pattern>' +
      '<linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#fffdf3"/><stop offset="1" stop-color="#f2e2c2"/></linearGradient>' +
      '<filter id="tileShadow" x="-30%" y="-30%" width="160%" height="170%">' +
      '<feDropShadow dx="0" dy="7" stdDeviation="4" flood-color="#2a1d08" flood-opacity=".34"/></filter>' +
      '<filter id="bshadow" x="-20%" y="-20%" width="140%" height="150%">' +
      '<feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#3a2a10" flood-opacity=".34"/></filter>' +
      '</defs>';

    /* 底板 */
    s += '<g filter="url(#bshadow)"><g transform="' + M + '">';
    s += '<rect x="-58" y="-58" width="' + (BOARD + 116) + '" height="' + (BOARD + 116) + '" rx="66" fill="#e2bd84"/>';
    s += '<rect x="-58" y="-58" width="' + (BOARD + 116) + '" height="' + (BOARD + 116) + '" rx="66" fill="url(#skyG)" opacity=".35"/>';
    s += '<rect x="-14" y="-14" width="' + (BOARD + 28) + '" height="' + (BOARD + 28) + '" rx="40" fill="#fffaf0"/>';
    s += '</g></g>';

    /* 草地 */
    s += '<g transform="' + M + '">';
    s += '<rect x="' + (PW + 4) + '" y="' + (PW + 4) + '" width="' + (BOARD - PW * 2 - 8) + '" height="' +
      (BOARD - PW * 2 - 8) + '" rx="26" fill="url(#grassPat)"/>';
    s += '<rect x="' + (PW + 4) + '" y="' + (PW + 4) + '" width="' + (BOARD - PW * 2 - 8) + '" height="' +
      (BOARD - PW * 2 - 8) + '" rx="26" fill="none" stroke="#ffffff" stroke-width="5" opacity=".4"/>';
    s += '<circle cx="' + (BOARD / 2) + '" cy="' + (BOARD / 2) + '" r="196" fill="#f7eeda" opacity=".75"/>';
    s += '<circle cx="' + (BOARD / 2) + '" cy="' + (BOARD / 2) + '" r="120" fill="#fdf7e8" opacity=".9"/>';
    s += '</g>';

    /* 树 */
    const trees = [[1.6, 1.6], [3.4, 1.4], [5.2, 1.6], [7.0, 1.5], [8.6, 2.2],
      [8.8, 4.0], [8.7, 5.8], [8.4, 7.6], [7.2, 8.8], [5.4, 8.9],
      [3.6, 8.8], [1.8, 8.2], [1.3, 6.6], [1.3, 4.8], [1.5, 3.2], [6.4, 3.6]];
    s += '<g transform="' + M + '">';
    trees.forEach(function (t, k) {
      const cx = t[0] * CELL, cy = t[1] * CELL, r = 13 + (k % 3) * 4;
      s += '<ellipse cx="' + cx + '" cy="' + (cy + r * 0.6) + '" rx="' + (r * 0.9) + '" ry="4" fill="#2f6b39" opacity=".22"/>';
      s += '<rect x="' + (cx - 3) + '" y="' + (cy - 2) + '" width="6" height="' + (r * 0.8) + '" rx="3" fill="#a9713f"/>';
      s += '<circle cx="' + cx + '" cy="' + (cy - r * 0.9) + '" r="' + r + '" fill="#57b661"/>';
      s += '<circle cx="' + (cx - r * 0.5) + '" cy="' + (cy - r * 0.4) + '" r="' + (r * 0.7) + '" fill="#6cc876"/>';
    });
    s += '</g>';

    /* 喷泉 */
    const fx = BOARD / 2, fy = BOARD / 2;
    s += '<g transform="' + M + '">';
    s += '<circle cx="' + fx + '" cy="' + (fy + 8) + '" r="86" fill="#3f7a3a" opacity=".13"/>';
    s += '<circle cx="' + fx + '" cy="' + fy + '" r="80" fill="#ffffff"/>';
    s += '<circle cx="' + fx + '" cy="' + fy + '" r="70" fill="#7fd8f2"/>';
    s += '<circle cx="' + fx + '" cy="' + fy + '" r="70" fill="#c9f1ff" opacity=".55"/>';
    s += '<circle cx="' + fx + '" cy="' + fy + '" r="22" fill="#ffffff"/>';
    s += '<circle cx="' + fx + '" cy="' + (fy - 8) + '" r="12" fill="#e2f6ff"/>';
    s += '</g>';

    /* 格子 */
    s += '<g filter="url(#tileShadow)"><g transform="' + M + '">';
    TILES.forEach(function (t, i) {
      const r = cellRect(i);
      const isProp = t.type === 'prop';
      const col = isProp ? (GROUPS[t.group] ? GROUPS[t.group].color : '#cfc7b4') : typeColor(t.type);
      const dark = '#' + shade(col, -0.22);
      s += '<rect x="' + (r.x + 2) + '" y="' + (r.y + 2) + '" width="' + (r.w - 4) + '" height="' + (r.h - 4) +
        '" rx="14" fill="' + dark + '"/>';
      s += '<rect x="' + r.x + '" y="' + r.y + '" width="' + r.w + '" height="' + r.h +
        '" rx="15" fill="' + col + '" stroke="#ffffff" stroke-width="5"/>';
      s += '<rect x="' + (r.x + 8) + '" y="' + (r.y + 8) + '" width="' + (r.w - 16) + '" height="' + (r.h - 16) +
        '" rx="10" fill="#ffffff" opacity=".' + (isProp ? '3' : '34') + '"/>';
    });
    s += '</g></g>';

    /* 中央街区 */
    const PAL = [['#ffd7a1', '#e8845a'], ['#a9d8f5', '#4f8fd6'], ['#f7b6cc', '#d9648f'],
      ['#c7e8ac', '#6aa860'], ['#ffe0a8', '#c99a4a'], ['#c9cdf5', '#7b84cc'],
      ['#f8c6a8', '#d0784a'], ['#b3e8dd', '#4fa893'], ['#e8d6f7', '#a98cd0']];
    function buildingIcon(cx, cy, w, c1, c2, hf) {
      const bh = w * 1.02 * (hf || 1), rh = w * 0.4;
      let o = '<g>' +
        '<ellipse cx="' + cx.toFixed(1) + '" cy="' + (cy + 2).toFixed(1) + '" rx="' + (w * 0.52).toFixed(1) + '" ry="' +
        (w * 0.17).toFixed(1) + '" fill="#2f4a20" opacity=".24"/>' +
        '<rect x="' + (cx - w / 2).toFixed(1) + '" y="' + (cy - bh).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' +
        bh.toFixed(1) + '" rx="' + (w * 0.1).toFixed(1) + '" fill="' + c1 + '" stroke="#ffffff" stroke-width="2.2"/>' +
        '<path d="M' + (cx - w / 2 - w * 0.1).toFixed(1) + ',' + (cy - bh).toFixed(1) + ' L' + cx.toFixed(1) + ',' +
        (cy - bh - rh).toFixed(1) + ' L' + (cx + w / 2 + w * 0.1).toFixed(1) + ',' + (cy - bh).toFixed(1) + ' Z" fill="' +
        c2 + '" stroke="#ffffff" stroke-width="2.2"/>';
      const ww = w * 0.2, wh = bh * 0.22;
      [[-1, -1], [1, -1], [-1, 0], [1, 0]].forEach(function (q) {
        o += '<rect x="' + (cx + q[0] * w * 0.22 - ww / 2).toFixed(1) + '" y="' +
          (cy - bh + bh * (q[1] < 0 ? 0.3 : 0.58)).toFixed(1) + '" width="' + ww.toFixed(1) + '" height="' +
          wh.toFixed(1) + '" rx="1.5" fill="#ffffff" opacity=".85"/>';
      });
      o += '<rect x="' + (cx - w * 0.11).toFixed(1) + '" y="' + (cy - bh * 0.3).toFixed(1) + '" width="' + (w * 0.22).toFixed(1) +
        '" height="' + (bh * 0.3).toFixed(1) + '" fill="' + c2 + '" opacity=".8"/>';
      return o + '</g>';
    }
    s += '<g>';
    let bi = 0;
    const rows = [
      { x: 170, y: BOARD - PW - 84, dx: 178, dy: 0, n: 4 },
      { x: 190, y: BOARD - PW - 218, dx: 178, dy: 0, n: 4 },
      { x: PW + 84, y: 170, dx: 0, dy: 178, n: 4 },
      { x: PW + 218, y: 190, dx: 0, dy: 178, n: 4 },
      { x: 170, y: PW + 84, dx: 178, dy: 0, n: 4 },
      { x: 190, y: PW + 218, dx: 178, dy: 0, n: 4 },
      { x: BOARD - PW - 84, y: 170, dx: 0, dy: 178, n: 4 },
      { x: BOARD - PW - 218, y: 190, dx: 0, dy: 178, n: 4 }
    ];
    rows.forEach(function (row) {
      for (let k = 0; k < row.n; k++) {
        const bx = row.x + row.dx * k, by = row.y + row.dy * k;
        const c = iso(bx, by);
        const w = 60 + ((k + bi) % 3) * 9;
        const hf = 1 + ((k * 5 + bi) % 3) * 0.2;
        const p = PAL[(bi + k) % PAL.length];
        s += buildingIcon(c.x, c.y, w, p[0], p[1], hf);
        bi++;
      }
    });
    s += '</g>';

    /* 格内图标 */
    s += '<g>';
    TILES.forEach(function (t, i) {
      const c = cellCenter(i);
      if (t.type === 'prop') {
        const gc = GROUPS[t.group] ? GROUPS[t.group].color : '#cfc7b4';
        s += houseIcon(c.x, c.y + 6, 34, '#fffdf6', '#' + shade(gc, -0.3));
        return;
      }
      const label = TYPE_ICON[t.type] || t.name;
      const big = (t.type === 'go' || t.type === 'jail' || t.type === 'free' || t.type === 'gotojail');
      const fs = big ? 46 : (label.length > 2 ? 24 : 30);
      s += '<g transform="translate(' + c.x.toFixed(1) + ',' + c.y.toFixed(1) + ') ' + inv + '">';
      s += '<text y="' + (fs * 0.34).toFixed(1) + '" text-anchor="middle" font-size="' + fs + '" font-weight="900" fill="#ffffff" ' +
        'stroke="rgba(20,30,50,.42)" stroke-width="' + (fs > 30 ? 7 : 4.5) + '" paint-order="stroke">' + label + '</text>';
      s += '</g>';
    });
    s += '</g>';

    const svg = document.getElementById('boardSvg');
    svg.setAttribute('viewBox', VB.x.toFixed(1) + ' ' + VB.y.toFixed(1) + ' ' + VB.w.toFixed(1) + ' ' + VB.h.toFixed(1));
    svg.innerHTML = s + '<g transform="' + M + '"><g id="ovl"></g></g>';
  }

  /* ---------- 归属 / 房屋层 ---------- */
  function renderOverlay() {
    const g = document.getElementById('ovl');
    if (!g) return;
    const parts = [];
    TILES.forEach(function (t, i) {
      const pr = state.props[i];
      if (!pr || !pr.owner) return;
      const p = state.players.find(function (x) { return x.id === pr.owner; });
      if (!p) return;
      const r = cellRect(i);
      const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
      // 领地着色（淡），表示归属
      parts.push('<rect x="' + (r.x + 5) + '" y="' + (r.y + 5) + '" width="' + (r.w - 10) + '" height="' + (r.h - 10) +
        '" rx="11" fill="' + p.color + '" opacity="' + (pr.mortgaged ? '.16' : '.3') + '"/>');
      // 外侧玩家徽章（白圈 + 玩家色圆心）
      const bx = cx - BOARD / 2, by = cy - BOARD / 2;
      const bl = Math.sqrt(bx * bx + by * by) || 1;
      const off = Math.min(r.w, r.h) / 2 - 12;
      const gx = cx + (bx / bl) * off, gy = cy + (by / bl) * off;
      parts.push('<circle cx="' + gx + '" cy="' + gy + '" r="11" fill="#ffffff" opacity=".92"/>');
      parts.push('<circle cx="' + (gx + (bx / bl) * 1.2) + '" cy="' + (gy + (by / bl) * 1.2) + '" r="8" fill="' + p.color + '"/>');
      if (pr.houses > 0) {
        const n2 = Math.min(4, pr.houses);
        for (let k = 0; k < n2; k++) {
          parts.push('<rect x="' + (r.x + 14 + k * 15) + '" y="' + (r.y + r.h - 26) + '" width="11" height="11" rx="3" fill="#ffffff"/>');
        }
        if (pr.houses >= 5) parts.push('<rect x="' + (r.x + r.w - 40) + '" y="' + (r.y + r.h - 30) + '" width="26" height="15" rx="4" fill="#ffd54a"/>');
      }
      if (pr.mortgaged) parts.push('<text x="' + (r.x + r.w / 2) + '" y="' + (r.y + r.h / 2 + 10) + '" text-anchor="middle" font-size="24" fill="#2b3550" opacity=".8">✕</text>');
    });
    g.innerHTML = parts.join('');
  }

  /* ---------- 骰子（两颗圆角立方体） ---------- */
  function roundedBoxGeo(w, h, d, seg, r) {
    const g = new THREE.BoxGeometry(w, h, d, seg, seg, seg);
    const pos = g.attributes.position;
    const inx = w / 2 - r, iny = h / 2 - r, inz = d / 2 - r;
    const v = new THREE.Vector3(), n = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      n.set(Math.max(-inx, Math.min(inx, v.x)), Math.max(-iny, Math.min(iny, v.y)), Math.max(-inz, Math.min(inz, v.z)));
      v.sub(n);
      if (v.lengthSq() > 1e-8) v.normalize().multiplyScalar(r);
      pos.setXYZ(i, n.x + v.x, n.y + v.y, n.z + v.z);
    }
    g.computeVertexNormals();
    return g;
  }
  const dcv = document.getElementById('diceCv');
  const dr = new THREE.WebGLRenderer({ canvas: dcv, antialias: true, alpha: true });
  dr.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  const ds = new THREE.Scene();
  const dc = new THREE.PerspectiveCamera(30, 1.7, 0.1, 60);
  dc.position.set(0, 2.0, 4.6); dc.lookAt(0, 0, 0);
  ds.add(new THREE.HemisphereLight(0xffffff, 0xbcd2ee, 1.0));
  const dl = new THREE.DirectionalLight(0xffffff, 0.85); dl.position.set(-2, 3, 3); ds.add(dl);
  const pipMat = new THREE.MeshBasicMaterial({ color: 0x2b3550 });
  const pipGeo = new THREE.CircleGeometry(0.082, 16);
  const PIP = { 1: [[0, 0]], 2: [[-1, -1], [1, 1]], 3: [[-1, -1], [0, 0], [1, 1]],
    4: [[-1, -1], [1, -1], [-1, 1], [1, 1]], 5: [[-1, -1], [1, -1], [0, 0], [-1, 1], [1, 1]],
    6: [[-1, -1], [0, -1], [1, -1], [-1, 1], [0, 1], [1, 1]] };
  function makeDie() {
    const grp = new THREE.Group();
    grp.add(new THREE.Mesh(roundedBoxGeo(1, 1, 1, 7, 0.17),
      new THREE.MeshLambertMaterial({ color: 0xfdfcf8, emissive: 0x16161a })));
    [{ n: 1, ax: 'z', s: 1 }, { n: 6, ax: 'z', s: -1 }, { n: 2, ax: 'y', s: 1 },
     { n: 5, ax: 'y', s: -1 }, { n: 3, ax: 'x', s: 1 }, { n: 4, ax: 'x', s: -1 }].forEach(function (f) {
      PIP[f.n].forEach(function (p) {
        const pip = new THREE.Mesh(pipGeo, pipMat);
        const o = 0.503, k = 0.165;
        if (f.ax === 'z') { pip.position.set(p[0] * k, p[1] * k, f.s * o); if (f.s < 0) pip.rotation.y = Math.PI; }
        else if (f.ax === 'y') { pip.position.set(p[0] * k, f.s * o, p[1] * k); pip.rotation.x = f.s > 0 ? -Math.PI / 2 : Math.PI / 2; }
        else { pip.position.set(f.s * o, p[0] * k, p[1] * k); pip.rotation.y = f.s > 0 ? Math.PI / 2 : -Math.PI / 2; }
        grp.add(pip);
      });
    });
    return grp;
  }
  const dieA = makeDie(), dieB = makeDie();
  dieA.position.set(-0.92, 0, 0.2); dieB.position.set(0.92, 0, -0.25);
  dieB.scale.setScalar(0.94);
  ds.add(dieA); ds.add(dieB);
  function setDieFace(die, n) {
    const base = { 1: [0, 0, 0], 6: [0, Math.PI, 0], 2: [-Math.PI / 2, 0, 0], 5: [Math.PI / 2, 0, 0], 3: [0, 0, -Math.PI / 2], 4: [0, 0, Math.PI / 2] };
    const r = base[n] || [0, 0, 0];
    die.rotation.set(r[0] + 0.16, r[1] + 0.4, r[2] + 0.06);
  }
  function renderDice() {
    const w = Math.max(80, dcv.clientWidth || 140), h = Math.max(60, dcv.clientHeight || 92);
    dr.setSize(w, h, false);
    dc.aspect = w / h; dc.updateProjectionMatrix();
    dr.render(ds, dc);
  }
  setDieFace(dieA, 3); setDieFace(dieB, 5);

  /* ---------- 状态 ---------- */
  const NAMES = [{ id: 'p1', name: '玩家A' }, { id: 'p2', name: '玩家B' },
    { id: 'p3', name: '玩家C' }, { id: 'p4', name: '玩家D' }];
  let state = ENG.createInitial(NAMES, Math.random);
  let rolling = false, timerLeft = 30, timerId = null, lastKey = '';

  const $ = function (id) { return document.getElementById(id); };
  const cur = function () { return state.players[state.turn]; };
  const actorId = function () { return cur().id; };
  const faceOf = function (p) {
    const idx = state.players.findIndex(function (x) { return x.id === p.id; });
    return FACE_OF(idx < 0 ? 0 : idx);
  };

  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    el.style.opacity = '1'; el.style.transform = 'translate(-50%,0)';
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('show'); el.style.opacity = '0'; el.style.transform = 'translate(-50%,-10px)'; }, 1600);
  }

  /* ---------- 执行动作 ---------- */
  function act(action, actor) {
    actor = actor || actorId();
    const before = state.players.map(function (p) { return p.pos; });
    const res = ENG.act(state, action, actor);
    if (!res.ok) { toast(res.msg || '不能这么做'); return false; }
    const prev = state;
    state = res.state;
    if (action.type === 'roll' && state.lastRoll) { rolling = true; spinDice(state.lastRoll.d1, state.lastRoll.d2); }
    syncAll(before);
    if (state.card && state.card.text) showCardPop(state.card.text);
    if (state.phase === 'ended' && state.winner) {
      const w = state.players.find(function (p) { return p.id === state.winner; });
      setTimeout(function () { toast(w.name + ' 成为最后的赢家 🏆'); }, 700);
    }
    return true;
  }

  function spinDice(d1, d2) {
    const t0 = performance.now(), dur = 640;
    const ax = dieA.rotation.x, az = dieA.rotation.z, bx = dieB.rotation.x, bz = dieB.rotation.z;
    (function step() {
      const k = Math.min(1, (performance.now() - t0) / dur);
      dieA.rotation.x = ax + k * 9 * Math.PI; dieA.rotation.z = az + k * 7 * Math.PI;
      dieB.rotation.x = bx + k * 8 * Math.PI; dieB.rotation.z = bz + k * 6 * Math.PI;
      renderDice();
      if (k < 1) requestAnimationFrame(step);
      else { setDieFace(dieA, d1); setDieFace(dieB, d2); renderDice(); rolling = false; }
    })();
  }

  function showCardPop(text) {
    const el = document.createElement('div');
    el.className = 'cardPop';
    el.innerHTML = '<b>卡牌</b><span>' + text + '</span>';
    $('app').appendChild(el);
    setTimeout(function () { el.classList.add('out'); }, 1500);
    setTimeout(function () { el.remove(); }, 1900);
  }

  /* ---------- 渲染 ---------- */
  function renderPlayers() {
    $('players').innerHTML = state.players.map(function (p, i) {
      const faceIdx = i;
      return '<div class="pcard' + (p.id === actorId() ? ' active' : '') + (p.bankrupt ? ' out' : '') +
        '" style="background:linear-gradient(180deg,' + D.COLORS[i % 4] + ',#' + shade(D.COLORS[i % 4], -0.2) + ')">' +
        '<div class="av">' + FACE_OF(faceIdx) + '</div>' +
        '<div class="nm">' + p.name + (p.inJail ? ' 🔒' : '') + '</div>' +
        '<div class="cash">$' + p.money.toLocaleString() + '</div></div>';
    }).join('');
  }

  const tokensEl = $('tokens');
  const tokenEls = [];
  function pct(p) { return { l: ((p.x - VB.x) / VB.w) * 100, t: ((p.y - VB.y) / VB.h) * 100 }; }
  function buildTokens() {
    tokensEl.innerHTML = '';
    tokenEls.length = 0;
    state.players.forEach(function (p, i) {
      const d = document.createElement('div');
      d.className = 'token';
      d.style.setProperty('--c', D.COLORS[i % 4]);
      d.style.zIndex = 3 + i;
      d.innerHTML = '<div class="shadow"></div><div class="body">' + FACE_OF(i) + '</div>';
      tokensEl.appendChild(d);
      tokenEls.push(d);
    });
  }
  function placeToken(i, pos) {
    const d = tokenEls[i];
    if (!d) return;
    if (pos == null) pos = state.players[i].pos;
    const pt = pct(cellCenter(pos));
    const OFF = [[-3.0, -2.6], [3.0, -2.6], [-3.0, 2.8], [3.0, 2.8]];
    d.style.left = (pt.l + OFF[i % 4][0]) + '%';
    d.style.top = (pt.t + OFF[i % 4][1]) + '%';
    d.style.opacity = state.players[i].bankrupt ? '.35' : '1';
  }
  function syncTokens(before) {
    state.players.forEach(function (p, i) {
      const from = before && before[i] != null ? before[i] : p.pos;
      if (from === p.pos) { placeToken(i, p.pos); return; }
      const steps = (p.pos - from + 40) % 40;
      if (steps > 18) { placeToken(i, p.pos); return; }
      let k = 0;
      const t = setInterval(function () {
        k++;
        placeToken(i, (from + k) % 40);
        if (k >= steps) clearInterval(t);
      }, 76);
    });
    tokenEls.forEach(function (el, i) {
      el.className = 'token' + (state.players[i].id === actorId() ? ' me' : '');
    });
  }

  function tileInfo(i) {
    const t = TILES[i], pr = state.props[i];
    if (!pr || !pr.owner) return { name: t.name, tip: t.price ? '地产价 $' + t.price : (t.note || '') };
    const o = state.players.find(function (p) { return p.id === pr.owner; });
    const rent = ENG.rentAt(state, i, state.lastRoll ? state.lastRoll.total : 7);
    return { name: t.name + (pr.mortgaged ? '（抵押）' : ''), tip: o.name + ' 持有 · 租金 $' + rent };
  }

  function renderHUD() {
    const p = cur();
    $('turnAv').innerHTML = faceOf(p);
    $('turnName').textContent = p.name + ' 的回合';
    const hints = {
      awaitRoll: p.inJail ? '你在监狱里：掷双骰或交保释金' : '掷骰子，前进吧！',
      awaitBuy: '要不要买下这块地？',
      awaitAuction: '拍卖进行中，请出价',
      awaitEnd: '结束回合，交给下一位',
      awaitTrade: '有交易待处理'
    };
    $('turnHint').textContent = hints[state.turnPhase] || '';

    const info = tileInfo(p.pos);
    $('locName').textContent = '当前位置：' + info.name;
    $('locTip').textContent = info.tip;

    renderActions();
    renderPopCard();
  }

  function btn(label, kind, fn, disabled) {
    const b = document.createElement('button');
    b.className = 'actBtn ' + (kind || '');
    b.textContent = label;
    if (disabled) b.disabled = true;
    b.addEventListener('click', fn);
    return b;
  }

  function renderActions() {
    const wrap = $('actions');
    wrap.innerHTML = '';
    if (state.phase === 'ended') {
      const w = state.players.find(function (x) { return x.id === state.winner; });
      wrap.appendChild(btn((w ? w.name : '赢家') + ' 获胜', 'primary', function () { location.reload(); }));
      return;
    }
    const tp = state.turnPhase;

    if (tp === 'awaitRoll') {
      if (cur().inJail) {
        wrap.appendChild(btn('缴 $50 保释', 'alt', function () { act({ type: 'jailPay' }); }));
        if (cur().cards > 0) wrap.appendChild(btn('用出狱卡', 'alt', function () { act({ type: 'jailCard' }); }));
      }
      wrap.appendChild(btn('掷骰子', 'primary', function () { if (!rolling) act({ type: 'roll' }); }));
      return;
    }
    if (tp === 'awaitBuy') {
      return; // 买地决策由浮卡承担
    }
    if (tp === 'awaitAuction') {
      const a = state.auction;
      const bidder = state.players.find(function (x) { return x.id === a.queue[a.i]; });
      const min = a.bid + 10;
      const lab = document.createElement('div');
      lab.className = 'bidWho';
      lab.textContent = (bidder ? bidder.name : '—') + ' 出价（当前 $' + a.bid + '）';
      wrap.appendChild(lab);
      wrap.appendChild(btn('$' + min, 'alt', function () { act({ type: 'bid', amount: min }, bidder.id); }));
      wrap.appendChild(btn('$' + (min + 40), 'alt', function () { act({ type: 'bid', amount: min + 40 }, bidder.id); }));
      wrap.appendChild(btn('放弃', 'primary', function () { act({ type: 'auctionPass' }, bidder.id); }));
      return;
    }
    if (tp === 'awaitEnd') {
      wrap.appendChild(btn('结束回合', 'primary', function () { act({ type: 'endTurn' }); }));
      if (state.needRollAgain) wrap.appendChild(btn('再掷一次', 'alt', function () { act({ type: 'endTurn' }); }));
      return;
    }
    wrap.appendChild(btn('结束回合', 'primary', function () { act({ type: 'endTurn' }); }));
  }

  function renderPopCard() {
    const el = $('popCard');
    if (state.turnPhase !== 'awaitBuy') { el.classList.remove('show'); el.style.opacity = '0'; el.style.transform = 'translateY(18px)'; el.style.pointerEvents = 'none'; el.innerHTML = ''; return; }
    const p = cur(), i = p.pos, t = TILES[i], pr = state.props[i];
    const grp = t.group ? GROUPS[t.group] : null;
    const mates = grp ? D.TILES.filter(function (x) { return x.group === t.group; }) : [];
    const mine = grp ? mates.filter(function (x) { return state.props[x.i].owner === p.id; }).length : 0;
    const tleft = Math.max(0, timerLeft);
    let rentRow = '';
    if (t.rent) rentRow = '租金 $' + ENG.rentAt(state, i, 7) + '（未建房）';
    else if (t.type === 'rail') rentRow = '车站租金按持有数量递增';
    else if (t.type === 'util') rentRow = '公用事业按骰子点数计费';
    el.innerHTML =
      '<div class="pcBar" style="background:' + (grp ? grp.color : typeColor(t.type)) + '"></div>' +
      '<div class="pcBody">' +
      '<div class="pcTitle">' + t.name + '</div>' +
      '<div class="pcPrice">价格 $' + (t.price || 0) + ' · ' + rentRow + '</div>' +
      (grp ? '<div class="pcSet">' + grp.name + '组：已持有 ' + mine + ' / ' + mates.length + '</div>' : '') +
      '<div class="pcPrice" id="pcT">剩余 ' + tleft + 's 后自动放弃</div>' +
      '<div class="pcBtns">' +
      '<button class="actBtn alt" id="pcNo">不买</button>' +
      '<button class="actBtn primary" id="pcYes">购买 $' + (t.price || 0) + '</button>' +
      '</div></div>';
    el.classList.add('show');
    el.style.opacity = '1';
    el.style.transform = 'translateY(0)';
    el.style.pointerEvents = 'auto';
    $('pcNo').onclick = function () { act({ type: 'decline' }); };
    $('pcYes').onclick = function () { act({ type: 'buy' }); };
  }

  function renderLog() {
    $('logList').innerHTML = state.logs.slice().reverse().map(function (l) {
      return '<div class="logrow">' + l + '</div>';
    }).join('');
  }

  function renderProps() {
    const list = ENG.propsOf(state, actorId()).sort(function (a, b) { return a - b; });
    if (!list.length) { $('propList').innerHTML = '<div class="logrow">还没有地产，先掷骰子买地吧</div>'; return; }
    $('propList').innerHTML = list.map(function (i) {
      const t = TILES[i], pr = state.props[i];
      const can = ENG.canBuild(state, i);
      const items = [];
      if (t.type === 'prop') {
        items.push('<button class="chip" data-a="build" data-i="' + i + '"' + (can.ok ? '' : ' disabled') + '>建房 $' + t.house + '</button>');
        if (pr.houses > 0) items.push('<button class="chip" data-a="sellHouse" data-i="' + i + '">拆房 +$' + Math.floor(t.house / 2) + '</button>');
      }
      if (!pr.mortgaged) items.push('<button class="chip" data-a="mortgage" data-i="' + i + '">抵押 +$' + Math.floor(t.price / 2) + '</button>');
      else items.push('<button class="chip" data-a="unmortgage" data-i="' + i + '">赎回 -$' + Math.ceil(t.price / 2 * 1.1) + '</button>');
      const tag = pr.houses >= 5 ? '旅馆' : (pr.houses > 0 ? pr.houses + ' 栋房' : '空地');
      return '<div class="prow"><div class="pv"><b>' + t.name + '</b><span>' + tag +
        (pr.mortgaged ? ' · 抵押中' : '') + '</span></div><div class="pb">' + items.join('') + '</div></div>';
    }).join('');
    $('propList').querySelectorAll('button[data-a]').forEach(function (b) {
      b.onclick = function () {
        const r = act({ type: b.getAttribute('data-a'), tile: Number(b.getAttribute('data-i')) });
        if (r) renderProps();
      };
    });
  }

  /* ---------- 计时 ---------- */
  function updateTimer() {
    const pctv = Math.max(0, timerLeft / 30);
    $('timerFill').style.width = (pctv * 100) + '%';
    $('timerFill').style.background = pctv > 0.5 ? '#4bc07a' : (pctv > 0.25 ? '#e8a93b' : '#e0574a');
    $('timerTxt').textContent = Math.max(0, timerLeft) + 's';
    const pcT = $('pcT');
    if (pcT) pcT.textContent = '剩余 ' + Math.max(0, timerLeft) + 's 后自动放弃';
  }
  function resetTimer() { timerLeft = 30; updateTimer(); }
  function autoAct() {
    const tp = state.turnPhase;
    if (state.phase === 'ended') return;
    if (tp === 'awaitRoll') act({ type: 'roll' });
    else if (tp === 'awaitBuy') act({ type: 'decline' });
    else if (tp === 'awaitAuction') {
      const a = state.auction;
      const bidder = a ? a.queue[a.i] : null;
      if (bidder) act({ type: 'auctionPass' }, bidder);
    } else if (tp === 'awaitEnd') act({ type: 'endTurn' });
    else act({ type: 'endTurn' });
    resetTimer();
  }
  function startTimer() {
    if (timerId) clearInterval(timerId);
    resetTimer();
    timerId = setInterval(function () {
      timerLeft--;
      updateTimer();
      if (timerLeft <= 0) autoAct();
    }, 1000);
  }

  /* ---------- 总渲染 ---------- */
  function syncAll(before) {
    renderPlayers();
    renderOverlay();
    syncTokens(before);
    renderHUD();
    renderLog();
    if ($('propSheet').classList.contains('open')) renderProps();
    const key = state.turn + '#' + state.turnPhase + '#' + state.phase;
    if (key !== lastKey) {
      lastKey = key;
      if (!(state.phase === 'ended')) startTimer();
    }
  }

  /* ---------- 弹层 ---------- */
  $('btnLog').onclick = function () { $('propSheet').classList.remove('open'); $('logSheet').classList.add('open'); };
  $('logClose').onclick = function () { $('logSheet').classList.remove('open'); };
  $('btnProps').onclick = function () { $('logSheet').classList.remove('open'); $('propSheet').classList.add('open'); renderProps(); };
  $('propClose').onclick = function () { $('propSheet').classList.remove('open'); };
  $('btnHome').onclick = function () { location.href = '../index.html'; };

  function applyMode() {
    const q = new URLSearchParams(location.search).get('mode');
    const desktop = q ? q === 'desktop' : window.innerWidth >= 900;
    $('app').className = 'app ' + (desktop ? 'desktop' : 'mobile');
  }

  /* 页面不可见（后台/无焦点）时禁用过渡，防止状态停在起点 */
  function syncAnimFlag() { document.body.classList.toggle('noanim', document.hidden); }
  syncAnimFlag();
  document.addEventListener('visibilitychange', syncAnimFlag);
  setInterval(syncAnimFlag, 600);

  /* ---------- 启动 ---------- */
  applyMode();
  buildBoard();
  buildTokens();
  state.players.forEach(function (p, i) { placeToken(i, p.pos); });
  syncAll(null);
  renderDice();
  window.addEventListener('resize', function () { applyMode(); renderDice(); });
  window.addEventListener('orientationchange', function () { setTimeout(function () { applyMode(); renderDice(); }, 200); });
  if (new URLSearchParams(location.search).get('dbg') === '1') dbgEl.style.display = 'block';
  log('ready ' + VB.w.toFixed(0) + 'x' + VB.h.toFixed(0));
})();
</script>
</body>
