<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大富翁 · 牌桌改版原型</title>
<style>
  :root{
    --bg:#f1f4f6;
    --surface:#fff;
    --ink:#182430;
    --ink2:#5b6b78;
    --ink3:#9aa8b3;
    --line:#e7edf0;
    --line2:#eff4f6;
    --accent:#0f9a75;
    --accent-d:#0b7f60;
    --accent-soft:#e9f6f1;
    --gold:#c9a227;
    --radius:14px;
    --shadow-s:0 5px 16px -8px rgba(16,36,48,.18);
    --shadow-m:0 16px 38px -22px rgba(16,36,48,.28);
    --shadow-l:0 28px 60px -30px rgba(16,36,48,.34);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 520px at 50% -12%, #ffffff 0%, rgba(255,255,255,0) 62%),
      radial-gradient(900px 700px at 100% 110%, #eef7f4 0%, rgba(238,247,244,0) 55%),
      var(--bg);
    display:flex;
    flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- 顶栏 ---------- */
  .topbar{
    height:56px;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 16px;
  }
  .brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;letter-spacing:.2px}
  .brand .logo{
    width:22px;height:22px;border-radius:50%;
    background:radial-gradient(circle at 30% 25%, #23c194 0%, #0f9a75 60%, #0a7357 100%);
    box-shadow:0 4px 10px -4px rgba(15,154,117,.6);
  }
  .topbar .grow{flex:1}
  .code{
    display:flex;align-items:center;gap:6px;
    font-size:12px;color:var(--ink2);
    background:rgba(255,255,255,.7);
    border:1px solid var(--line);
    padding:6px 10px;border-radius:10px;
    backdrop-filter:blur(8px);
  }
  .code strong{font-size:12.5px;letter-spacing:1.5px;color:var(--ink);font-weight:600}
  .ghost{
    font:inherit;font-size:12.5px;color:var(--ink2);
    background:transparent;border:1px solid transparent;
    padding:7px 10px;border-radius:10px;cursor:pointer;transition:.18s;
  }
  .ghost:hover{background:#fff;border-color:var(--line);color:var(--ink)}

  /* ---------- 主体 ---------- */
  main{
    flex:1 1 auto;
    min-height:0;
    display:flex;flex-direction:column;align-items:center;
    gap:12px;
    padding:4px 16px 16px;
  }

  .board-shell{
    position:relative;
    width:min(calc(100vh - 200px), calc(100vw - 32px), 900px);
    aspect-ratio:1/1;
    max-width:100%;
  }

  .board{
    position:absolute;inset:0;
    display:grid;
    grid-template-columns:repeat(11,1fr);
    grid-template-rows:repeat(11,1fr);
    gap:3px;
    padding:8px;
    background:var(--surface);
    border-radius:20px;
    box-shadow:var(--shadow-l);
    border:1px solid rgba(226,236,240,.9);
  }
  #fx{
    position:absolute;inset:0;
    width:100%;height:100%;
    pointer-events:none;
    z-index:3;
  }

  /* ---------- 格子 ---------- */
  .tile{
    position:relative;
    z-index:2;
    display:flex;flex-direction:column;
    background:#fff;
    border:1px solid var(--line);
    border-radius:9px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .tile:hover{transform:translateY(-1px);box-shadow:var(--shadow-s);border-color:#dbe6ea}
  .tile.corner{border-radius:11px;background:#fbfcfd}

  .tile .bar{height:7px;flex:0 0 auto}
  .tile .body{
    flex:1;display:flex;flex-direction:column;align-items:center;
    justify-content:flex-start;
    padding:4px 2px 0;
    text-align:center;min-height:0;
  }
  .tile .nm{
    font-size:clamp(8.5px,1.35vmin,10.5px);
    font-weight:600;
    line-height:1.15;
    color:var(--ink);
    letter-spacing:.2px;
  }
  .tile .pr{
    margin-top:1px;
    font-size:clamp(7.5px,1.1vmin,9px);
    color:var(--ink3);
    font-variant-numeric:tabular-nums;
  }
  .tile .nm.long{font-size:clamp(8px,1.25vmin,9.5px)}

  .tile.corner .body{padding:2px 4px 6px;justify-content:center;gap:3px}
  .tile.corner .nm{font-size:clamp(9.5px,1.6vmin,12.5px)}
  .tile.corner .hint{font-size:clamp(7.5px,1.1vmin,9px);color:var(--ink3)}

  .tile .owner{
    position:absolute;right:4px;top:4px;z-index:3;
    width:7px;height:7px;border-radius:50%;
    box-shadow:0 0 0 1.5px #fff;
  }
  .tile .mort{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    background:repeating-linear-gradient(135deg,rgba(24,36,48,.05) 0 6px,rgba(24,36,48,0) 6px 12px);
  }
  .tile.current{
    border-color:var(--accent);
    box-shadow:0 0 0 2px rgba(15,154,117,.14), var(--shadow-s);
  }

  /* ---------- 中央操作台 ---------- */
  .center{
    position:relative;z-index:4;
    grid-area:2 / 2 / 11 / 11;
    display:grid;
    justify-items:center;align-items:stretch;
    padding:clamp(6px,2vmin,20px);
    background:linear-gradient(180deg,#fbfdfc 0%,#eef6f3 100%);
    border:1px solid #e8f0ed;
    border-radius:14px;
    box-shadow:inset 0 1px 0 #fff, inset 0 -28px 46px -34px rgba(16,36,48,.26);
  }
  .panel{
    width:100%;
    max-width:520px;
    max-height:100%;
    height:auto;
    overflow:auto;
    display:flex;flex-direction:column;
    justify-content:space-between;
    gap:clamp(8px,2vmin,16px);
    padding:clamp(8px,3vmin,26px) clamp(6px,2vmin,16px);
    animation:pop .26s cubic-bezier(.2,.9,.3,1) both;
  }
  .panel.card{
    height:auto;
    align-self:center;
    justify-content:flex-start;
    background:rgba(255,255,255,.97);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow-m);
    padding:clamp(12px,2.4vmin,20px);
    max-width:400px;
  }
  @keyframes pop{
    from{opacity:0;transform:translateY(6px) scale(.985)}
    to{opacity:1;transform:none}
  }

  .p-head{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
  .p-dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2.5px #fff,0 0 0 3.5px rgba(24,36,48,.06)}
  .p-name{font-size:13px;font-weight:600}
  .p-name em{font-style:normal;font-size:11px;font-weight:500;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:20px;margin-left:6px}
  .p-badge{font-size:11px;color:var(--ink3)}

  .p-money{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
  .p-money strong{
    font-size:clamp(30px,6.6vmin,64px);
    font-weight:700;letter-spacing:-1.2px;line-height:1.04;
    font-variant-numeric:tabular-nums;
  }
  .p-money span{font-size:11.5px;color:var(--ink3)}

  .dice-row{display:flex;align-items:center;gap:10px}
  .die{
    width:clamp(46px,7.8vmin,72px);
    aspect-ratio:1/1;
    background:#fff;
    border:1px solid #d7e2e7;
    border-radius:11px;
    box-shadow:0 8px 18px -12px rgba(16,36,48,.5), inset 0 -2px 0 rgba(16,36,48,.06);
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    transition:transform .18s;
  }
  .die i{display:block;width:60%;aspect-ratio:1/1;border-radius:50%;margin:auto;background:transparent}
  .die i.on{background:#2b3a46;box-shadow:inset 0 -1px 0 rgba(255,255,255,.55)}
  .die.rolling{animation:shake .18s linear infinite}
  @keyframes shake{
    0%{transform:rotate(-7deg) translateY(0)}
    50%{transform:rotate(6deg) translateY(-4px)}
    100%{transform:rotate(-7deg) translateY(0)}
  }
  .dice-box{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0}
  .btn.primary.mid{width:auto;min-width:210px;align-self:center}
  .total{
    font-size:12px;color:var(--ink2);
    background:#f5f8fa;border:1px solid var(--line2);
    padding:5px 10px;border-radius:9px;
    font-variant-numeric:tabular-nums;
  }
  .total b{color:var(--ink);font-size:14px}

  .btn{
    font:inherit;font-size:13px;font-weight:600;
    border-radius:12px;border:1px solid var(--line);
    background:#fff;color:var(--ink);
    padding:10px 14px;cursor:pointer;
    transition:.16s;
  }
  .btn:hover{border-color:#d6e2e7;box-shadow:var(--shadow-s)}
  .btn.primary{
    background:linear-gradient(180deg,#17a97f,#0d8f6c);
    border-color:#0d8f6c;color:#fff;
    box-shadow:0 10px 22px -14px rgba(13,143,108,.9);
    font-size:14px;padding:13px 16px;
  }
  .btn.primary:hover{filter:brightness(1.03)}
  .btn.wide{width:100%}
  .btn.danger{color:#b4483c;border-color:#f0d8d4}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}

  .row{display:flex;gap:8px}
  .row .btn{flex:1}
  .row.sub{justify-content:center;gap:8px}
  .row.sub .btn{flex:0 0 auto;font-size:12px;color:var(--ink2);padding:8px 14px;border-color:var(--line2)}

  .p-log{
    background:#fff;
    border:1px solid var(--line);
    border-radius:11px;
    padding:9px 12px;
    display:flex;flex-direction:column;gap:5px;
  }
  .p-log .l{font-size:11.5px;color:var(--ink3);display:flex;gap:7px;align-items:baseline;justify-content:center}
  .p-log .l::before{content:"";flex:0 0 auto;width:4px;height:4px;border-radius:50%;background:#d2dde2;transform:translateY(-2px)}
  .p-log .l:first-child{color:var(--ink)}
  .p-log .l:first-child::before{background:var(--accent)}

  /* 格子详情 */
  .t-head{display:flex;align-items:center;gap:8px}
  .t-swatch{width:26px;height:8px;border-radius:5px}
  .t-name{font-size:15px;font-weight:700}
  .t-price{margin-left:auto;font-size:12px;color:var(--ink2)}
  .rents{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:11.5px;color:var(--ink2)}
  .rents .n{color:var(--ink3)}
  .rents .v{font-variant-numeric:tabular-nums;text-align:right;color:var(--ink)}
  .rents .v.hi{color:var(--accent);font-weight:600}

  .t-note{
    font-size:11.5px;color:var(--ink3);
    background:#f7fafb;border:1px solid var(--line2);
    border-radius:10px;padding:8px 10px;
  }

  /* ---------- 玩家条 ---------- */
  .rail{
    width:min(calc(100vh - 200px), calc(100vw - 32px), 900px);
    display:grid;
    grid-auto-flow:column;
    grid-auto-columns:1fr;
    gap:8px;
  }
  .pc{
    display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.85);
    border:1px solid var(--line);
    border-radius:12px;
    padding:8px 11px;
    transition:.18s;
  }
  .pc .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .pc .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pc .sub{font-size:10.5px;color:var(--ink3);margin-top:1px}
  .pc .${
    margin-left:auto;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;
  }
  .pc.active{
    background:#fff;
    border-color:rgba(15,154,117,.35);
    box-shadow:0 8px 20px -14px rgba(15,154,117,.7);
  }
  .pc.out{opacity:.55}

  /* ---------- 演示开关 ---------- */
  .demo{
    position:fixed;left:14px;bottom:14px;z-index:20;
    display:flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.82);
    border:1px solid var(--line);
    border-radius:12px;
    padding:6px 8px;
    backdrop-filter:blur(10px);
    font-size:11px;color:var(--ink3);
  }
  .demo button{
    font:inherit;font-size:11.5px;color:var(--ink2);
    background:transparent;border:1px solid transparent;border-radius:8px;
    padding:4px 8px;cursor:pointer;
  }
  .demo button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-d);font-weight:600}
  .tag{
    position:fixed;right:14px;bottom:14px;z-index:20;
    font-size:11px;color:var(--ink3);
    background:rgba(255,255,255,.82);
    border:1px solid var(--line);
    border-radius:20px;padding:5px 10px;
  }

  @media (max-width:860px){
    main{padding:2px 10px 12px}
    .rail{gap:6px}
    .pc{padding:6px 9px;gap:6px}
    .pc .sub{display:none}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="logo"></span><span>桌游大厅</span></div>
  <div class="grow"></div>
  <div class="code">房间 <strong>K7M2Q</strong></div>
  <button class="ghost">离开房间</button>
</header>

<main>
  <div class="board-shell">
    <div class="board" id="board">
      <canvas id="fx"></canvas>
      <div class="center"><div class="panel" id="panel"></div></div>
    </div>
  </div>

  <div class="rail" id="rail"></div>
</main>

<div class="demo">
  <span>演示</span>
  <button data-mode="turn" aria-current="true">当前回合</button>
  <button data-mode="tile">格子详情</button>
  <button data-mode="auction">拍卖</button>
</div>
<div class="tag">原型预览 · 未接入联机</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="../js/data.js"></script>
<script src="./scene-proto.js"></script>
<script>
(function () {
  const D = window.MonoData;
  const T = D.TILES;
  const $ = (id) => document.getElementById(id);

  /* ---------------- 假数据 ---------------- */
  const state = {
    phase: 'playing',
    turn: 0,
    turnPhase: 'awaitRoll',
    round: 3,
    lastRoll: { d1: 4, d2: 3, total: 7 },
    players: [
      { id: 'me', name: '阿蒙', color: D.COLORS[0], pos: 1, money: 1500, inJail: false, cards: 0, bankrupt: false },
      { id: 'b', name: '老王', color: D.COLORS[1], pos: 25, money: 900, inJail: false, cards: 1, bankrupt: false },
      { id: 'c', name: '小李', color: D.COLORS[2], pos: 7, money: 1240, inJail: false, cards: 0, bankrupt: false }
    ],
    props: {
      1: { owner: 'me', houses: 2, mortgaged: false },
      3: { owner: 'me', houses: 1, mortgaged: false },
      6: { owner: 'b', houses: 3, mortgaged: false },
      8: { owner: 'b', houses: 1, mortgaged: false },
      9: { owner: 'b', houses: 5, mortgaged: false },
      11: { owner: 'c', houses: 0, mortgaged: true },
      37: { owner: 'c', houses: 5, mortgaged: false },
      39: { owner: 'c', houses: 1, mortgaged: false }
    },
    logs: [
      '阿蒙 掷出 4 + 3 = 7',
      '老王 买下 珠江路，付 $100',
      '轮到 阿蒙'
    ]
  };

  const me = state.players[0];

  function rgba(hex, a) {
    const h = String(hex).replace('#', '');
    const full = h.length === 3 ? h.split('').map((x) => x + x).join('') : h;
    const n = parseInt(full, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  /* ---------------- 建棋盘 ---------------- */
  function cellOf(i) {
    if (i <= 10) return { r: 11, c: 11 - i };
    if (i <= 20) return { r: 11 - (i - 10), c: 1 };
    if (i <= 30) return { r: 1, c: i - 19 };
    return { r: 1 + (i - 30), c: 11 };
  }

  const board = $('board');
  const CENTER = board.querySelector('.center');

  T.forEach((t, i) => {
    const rc = cellOf(i);
    const el = document.createElement('div');
    el.className = 'tile' + ([0, 10, 20, 30].indexOf(i) >= 0 ? ' corner' : '');
    el.dataset.i = i;
    el.style.gridRow = rc.r;
    el.style.gridColumn = rc.c;

    const g = t.group ? D.GROUPS[t.group] : null;
    if (g) {
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.background = typeof g.color === 'string' ? g.color : ('#' + (g.color || 0).toString(16));
      el.appendChild(bar);
    }
    // 分组色有深浅两段时，取深色一档
    if (g && g.dark) el.querySelector('.bar').style.background = '#' + g.dark.toString(16);

    const body = document.createElement('div');
    body.className = 'body';

    const nm = document.createElement('div');
    nm.className = 'nm' + (t.name && t.name.length >= 4 ? ' long' : '');
    nm.textContent = t.name || '';
    body.appendChild(nm);

    if (t.price) {
      const pr = document.createElement('div');
      pr.className = 'pr';
      pr.textContent = '$' + t.price;
      body.appendChild(pr);
    } else if ([0, 10, 20, 30].indexOf(i) >= 0) {
      const hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = i === 0 ? '领 $200' : (i === 10 ? '路过' : (i === 20 ? '免费' : '直入监狱'));
      body.appendChild(hint);
    }

    // 房子数用 2D 小点示意（真实渲染由 scene.js 叠在上面）
    el.appendChild(body);

    const pr = state.props[i];
    if (pr && pr.owner) {
      const p = state.players.find((x) => x.id === pr.owner);
      const dot = document.createElement('span');
      dot.className = 'owner';
      dot.style.background = p ? p.color : '#888';
      el.appendChild(dot);
      if (pr.mortgaged) {
        const m = document.createElement('div');
        m.className = 'mort';
        el.appendChild(m);
      }
    }

    el.addEventListener('click', () => setMode('tile', i));
    board.insertBefore(el, CENTER);
  });

  /* ---------------- 骰子 ---------------- */
  const PIPS = {
    1: [4],
    2: [0, 8],
    3: [0, 4, 8],
    4: [0, 2, 6, 8],
    5: [0, 2, 4, 6, 8],
    6: [0, 2, 3, 5, 6, 8]
  };

  function dieHTML(v) {
    let cells = '';
    for (let k = 0; k < 9; k++) {
      cells += '<i class="' + (PIPS[v].indexOf(k) >= 0 ? 'on' : '') + '"></i>';
    }
    return '<div class="die" data-v="' + v + '">' + cells + '</div>';
  }

  /* ---------------- 中央面板 ---------------- */
  let mode = 'turn';
  let tileIndex = 1;

  function money(n) { return '$' + n.toLocaleString('en-US'); }

  function netWorth(p) {
    const E = window.MonoEngine;
    if (E && E.netWorth) return E.netWorth(state, p.id);
    let v = p.money;
    Object.keys(state.props).forEach((k) => {
      const pr = state.props[k];
      if (pr.owner !== p.id) return;
      const t = T[k];
      v += pr.mortgaged ? 0 : (t.price || 0) / 2;
      v += (pr.houses || 0) * (t.house || 0);
    });
    return Math.round(v);
  }

  function panelTurn() {
    const p = state.players[state.turn];
    const active = state.turnPhase === 'awaitRoll';
    const owned = Object.keys(state.props).filter((k) => state.props[k].owner === p.id).length;
    return '' +
      '<div class="p-head">' +
        '<span class="p-dot" style="background:' + p.color + '"></span>' +
        '<span class="p-name">' + p.name + '<em>你的回合</em></span>' +
        '<span class="p-badge">第 ' + state.round + ' 轮</span>' +
      '</div>' +
      '<div class="p-money"><strong>' + money(p.money) + '</strong>' +
        '<span>净资产 ' + money(netWorth(p)) + ' · ' + owned + ' 块地产</span></div>' +
      '<div class="dice-box">' +
        dieHTML(state.lastRoll.d1) + dieHTML(state.lastRoll.d2) +
        '<span class="total"><b>' + state.lastRoll.total + '</b> 点</span>' +
      '</div>' +
      '<button class="btn primary mid" id="btn-roll">' + (active ? '掷骰子' : '等待结算…') + '</button>' +
      '<div class="row sub">' +
        '<button class="btn">发起交易</button>' +
        '<button class="btn">查看地产</button>' +
      '</div>' +
      '<div class="p-log">' +
        state.logs.map((x) => '<div class="l">' + x + '</div>').join('') +
      '</div>';
  }

  function groupSwatch(t) {
    if (!t.group) return '';
    const g = D.GROUPS[t.group];
    let color = typeof g.color === 'string' ? g.color : '#' + (g.color || 0).toString(16);
    if (g.dark) color = '#' + g.dark.toString(16);
    return '<span class="t-swatch" style="background:' + color + '"></span>';
  }

  function panelTile(i) {
    const t = T[i];
    const pr = state.props[i] || { owner: null, houses: 0, mortgaged: false };
    const owner = pr.owner ? state.players.find((x) => x.id === pr.owner) : null;

    let head = '<div class="t-head">' + groupSwatch(t) +
      '<span class="t-name">' + t.name + '</span>' +
      (t.price ? '<span class="t-price">$' + t.price + '</span>' : '') + '</div>';

    let rents = '';
    if (t.rent) {
      const labels = ['无房', '1 栋', '2 栋', '3 栋', '4 栋', '旅馆'];
      const lvl = pr.owner ? Math.min(pr.houses || 0, 5) : 0;
      rents = '<div class="rents">';
      t.rent.forEach((r, k) => {
        rents += '<div class="n">' + labels[k] + '</div><div class="v' + (k === lvl ? ' hi' : '') + '">$' + r + '</div>';
      });
      rents += '</div>';
    }

    let note = '';
    if (t.house) note = '每栋造价 $' + t.house;
    if (owner) {
      note = '主人：' + owner.name + '　' + (pr.houses === 5 ? '旅馆' : (pr.houses ? pr.houses + ' 栋房' : '未开发'))
        + (pr.mortgaged ? '　已抵押' : '') + (t.house ? '　每栋造价 $' + t.house : '');
    } else if (t.type === 'prop') {
      note = '无主　' + (t.house ? '每栋造价 $' + t.house : '');
    }

    let actions;
    if (!t.price) {
      actions = '<button class="btn wide" data-act="turn">返回</button>';
    } else if (owner && owner.id === me.id) {
      actions = '<div class="row">' +
        '<button class="btn primary">' + (pr.houses === 5 ? '暂不可建' : '建房 $' + (t.house || 0)) + '</button>' +
        '<button class="btn">抵押</button>' +
        '</div><button class="btn wide" data-act="turn">返回</button>';
    } else if (owner) {
      actions = '<div class="row"><button class="btn">发起交易</button>' +
        '<button class="btn" data-act="turn">返回</button></div>';
    } else {
      actions = '<div class="row">' +
        '<button class="btn primary">买下 $' + t.price + '</button>' +
        '<button class="btn">送去拍卖</button>' +
        '</div>';
    }

    return head + (rents || '') +
      (note ? '<div class="t-note">' + note + '</div>' : '') +
      actions;
  }

  function panelAuction(i) {
    const t = T[i];
    return '' +
      '<div class="p-head"><span class="p-dot" style="background:var(--gold)"></span>' +
      '<span class="p-name">拍卖进行中</span><span class="p-badge">无人购买 · 转入拍卖</span></div>' +
      '<div class="t-head">' + groupSwatch(t) + '<span class="t-name">' + t.name + '</span>' +
      '<span class="t-price">原价 $' + t.price + '</span></div>' +
      '<div class="p-money"><strong>$120</strong><span>当前最高价 · 小李</span></div>' +
      '<div class="row">' +
        '<button class="btn primary">出价 $130</button>' +
        '<button class="btn">放弃</button>' +
      '</div>' +
      '<div class="p-log"><div class="l">老王 放弃竞拍</div><div class="l">小李 出价 $120</div></div>';
  }

  function render() {
    const panel = $('panel');
    panel.className = mode === 'turn' ? 'panel' : 'panel card';
    if (mode === 'tile') panel.innerHTML = panelTile(tileIndex);
    else if (mode === 'auction') panel.innerHTML = panelAuction(8);
    else panel.innerHTML = panelTurn();

    // 高亮当前玩家所在格
    document.querySelectorAll('.tile.current').forEach((x) => x.classList.remove('current'));
    const cur = state.players[state.turn];
    const el = document.querySelector('.tile[data-i="' + cur.pos + '"]');
    if (el) el.classList.add('current');

    // 中央区色光跟随当前玩家
    const center = document.querySelector('.center');
    center.style.background =
      'radial-gradient(78% 56% at 50% 26%, ' + rgba(cur.color, 0.13) + ' 0%, ' + rgba(cur.color, 0) + ' 62%),' +
      'linear-gradient(180deg,#fbfdfc 0%,#eef6f3 100%)';

    bindPanel();
    renderRail();
    if (window.MonoScene) window.MonoScene.update(state);
  }

  function bindPanel() {
    const back = $('panel').querySelectorAll('[data-act="turn"]');
    back.forEach((b) => b.addEventListener('click', () => setMode('turn')));

    const roll = $('btn-roll');
    if (roll) {
      roll.addEventListener('click', () => {
        const dice = $('panel').querySelectorAll('.die');
        dice.forEach((d) => d.classList.add('rolling'));
        roll.disabled = true;
        setTimeout(() => {
          const d1 = 1 + Math.floor(Math.random() * 6);
          const d2 = 1 + Math.floor(Math.random() * 6);
          state.lastRoll = { d1: d1, d2: d2, total: d1 + d2 };
          render();
        }, 520);
      });
    }
  }

  function renderRail() {
    const rail = $('rail');
    rail.innerHTML = state.players.map((p, i) => {
      const props = Object.keys(state.props).filter((k) => state.props[k].owner === p.id).length;
      return '<div class="pc' + (i === state.turn ? ' active' : '') + '">' +
        '<span class="dot" style="background:' + p.color + '"></span>' +
        '<div><div class="nm">' + p.name + (p.id === me.id ? '（你）' : '') + '</div>' +
        '<div class="sub">' + props + ' 块地产</div></div>' +
        '<div class="$">' + money(p.money) + '</div>' +
        '</div>';
    }).join('');
  }

  function setMode(m, i) {
    mode = m;
    if (i !== undefined) tileIndex = i;
    document.querySelectorAll('.demo button').forEach((b) => {
      b.setAttribute('aria-current', b.dataset.mode === m ? 'true' : 'false');
    });
    render();
  }

  document.querySelectorAll('.demo button').forEach((b) => {
    b.addEventListener('click', () => setMode(b.dataset.mode));
  });

  /* ---------------- 3D 层 ---------------- */
  function mount3d() {
    if (!window.THREE || !window.MonoScene) return;
    window.MonoScene.mount($('fx'), board);
    window.MonoScene.update(state);
  }

  render();
  mount3d();
  window.addEventListener('resize', () => {
    if (window.MonoScene) window.MonoScene.resize();
  });
})();
</script>
</body>
</html>
