name: Sync cabin content packs

on:
  push:
    branches: [main]
    paths:
      - 'content/cabin/**'
      - 'tools/build-cabin-packs.mjs'
      - 'tools/audit-cabin-content.mjs'
      - 'js/games/cabin.js'
      - 'js/games/cabin-packs.js'
      - 'js/net.js'
      - 'sql/rooms-private.sql'
      - 'tests/cabin*.test.js'
      - '.github/workflows/cabin-packs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build content packs
        run: node tools/build-cabin-packs.mjs

      - name: Audit 3E content baseline
        run: node tools/audit-cabin-content.mjs --summary

      - name: Run cabin rules tests
        run: node tests/cabin.test.js

      - name: Run cabin content-pack tests
        run: node tests/cabin-packs.test.js

      - name: Run cabin official 3E tests
        run: node tests/cabin-official.test.js

      - name: Run cabin 3E rule tests
        run: node tests/cabin-3e-rules.test.js

      - name: Run cabin scenario special tests
        run: node tests/cabin-specials.test.js

      - name: Run cabin scenario setup tests
        run: node tests/cabin-setup.test.js

      - name: Run cabin scenario rule-fix tests
        run: node tests/cabin-rule-fixes.test.js

      - name: Run all 50 scenarios through the engine
        run: node tests/cabin-all-scenarios.test.js

      - name: Run independent scenario acceptance
        run: node tests/cabin-scenario-acceptance.test.js

      - name: Run 50 scenario legal-action playthroughs
        run: node tests/cabin-scenario-playthrough.test.js

      - name: Run cabin private-state security tests
        run: node tests/cabin-security.test.js

      - name: Run remaining 3E monster and scenario mechanics
        run: node tests/cabin-mechanic-3e.test.js

      - name: Run coverage handler matrix
        run: node tests/cabin-full-coverage.test.js

      - name: Commit generated manifest
        run: |
          if git diff --quiet -- js/games/cabin-packs.js; then
            echo "No content-pack changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/games/cabin-packs.js
          git commit -m "chore: sync cabin content packs"
          git push origin HEAD:main
